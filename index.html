 {h:'Health checks and failure behaviour',ul:['Active checks probe an endpoint; passive checks eject servers that return errors or time out.','A shallow check (port open) misses a broken app; a deep check that calls dependencies can take everything down when one dependency blips. Aim for checks that reflect the server\'s ability to serve.','Use slow start for new servers so they are not flooded cold, and connection draining so removals do not cut requests.','Retries on another backend are safe only for idempotent requests, and need budgets to avoid retry storms.']},
 {h:'Stickiness and state',p:['Sticky sessions keep a user on one server so local state works, but they unbalance load and lose the session when that server dies. Prefer stateless servers with state in a shared store or signed tokens, and use stickiness only for caching or connection affinity (WebSockets).'],
  ul:['Cookie-based stickiness survives IP changes; IP hash does not and breaks behind large NATs.','Consistent hashing keeps most keys on the same server when the pool changes.']},
 {h:'The balancer must not be the weak link',ul:['Run balancers as a redundant pair (active-active or active-passive with a floating address) or as a managed, horizontally scaled service.','Distribute across zones and watch capacity: a balancer has connection, bandwidth and certificate-handshake limits.','Use ECMP or anycast to spread traffic across many balancer instances.','Test failover. An untested failover is a hypothesis.']}
],[
 {q:'Your fleet is behind a round robin balancer yet some servers are at 95% CPU while others sit at 30%. Why, and what do you change?',cover:['Round robin balances request counts, not work; heavy requests, uneven server sizes, long-lived connections (WebSockets, gRPC streams) and sticky sessions all skew load.','Look at per-server request duration distribution, connection counts and hot keys.','Switch to least outstanding requests or power of two choices, add weights for mixed hardware, and for long-lived connections rebalance by periodic reconnects or max connection age.','Check for client-side connection reuse that pins all traffic to few servers, and for hashing-based routing that concentrates hot keys.'],pitfalls:['Adding servers without fixing the distribution.','Ignoring long-lived connections.']},
 {q:'A health check calls the database, and one night a brief database slowdown takes the entire site down. What happened and how do you fix the check?',cover:['All backends failed the deep check at once, so the balancer removed every server, turning a partial slowdown into a total outage (a correlated failure).','Fix: make health checks local and cheap (process alive, can accept work); handle dependency failure with degraded behaviour, circuit breakers and timeouts, not by removing capacity.','If a balancer has no healthy backends, use fail-open behaviour (send to all) rather than none, and set minimum healthy thresholds.','Add separate readiness and liveness semantics, with hysteresis (several failures to eject, several successes to return).'],pitfalls:['Treating health checks as end-to-end tests.','No fail-open policy.']},
 {q:'Design global load balancing for an application in four regions with regional failover, data residency rules and a 99.99% target.',lvl:'Staff+',cover:['Entry: anycast or geo DNS in front of regional L7 balancers; latency or geo steering with health checks, and residency pinning so some users only route to allowed regions.','Within a region: multi-zone balancer fleet with capacity for the loss of a zone; connection draining and slow start.','Failover: region-level health from synthetic and real traffic, capacity reserved or autoscaled in surviving regions, and a plan for the data tier (replication, RPO and RTO) and for residency exceptions.','Safety: gradual traffic shifting, protection against cascading failure (load shedding, retry budgets), and kill switches to override automation.','Verification: game days, chaos tests, and capacity tests for the failover case. Compute availability from component availability, since 99.99% means about 52 minutes a year.'],pitfalls:['Failing over load into a region with no headroom.','Ignoring residency during failover.']}
]);

enrich('Checksums',[
 {h:'What a checksum can and cannot do',p:['A checksum maps data to a small value. Equal data always gives equal checksums, but different data can collide. Good checksums make accidental collisions very unlikely. They detect corruption; they do not correct it (that needs error-correcting codes such as ECC memory or erasure coding) and do not stop deliberate edits.'],
  ul:['The shorter the checksum, the higher the chance of an undetected error: 16 bits miss about 1 in 65,536 random corruptions.','Detecting is different from preventing; the response to a mismatch (drop, retransmit, repair from a replica, alert) is part of the design.']},
 {h:'The families',ul:['Parity and simple sums: trivial, catch single-bit flips but little else.','Internet checksum (one\'s complement 16-bit sum): used in IPv4 headers, TCP and UDP. Fast but blind to reordered words.','CRC (CRC-32, CRC-32C, CRC-64): strong for burst errors, hardware-accelerated, used in Ethernet, storage engines, Kafka, gzip, many file formats.','Cryptographic hashes (SHA-256): detect any change and resist deliberate collisions; slower.','MAC and HMAC and signatures: add a secret or private key so the checker knows who produced it.']},
 {h:'Where they sit in a system',ul:['Link layer: the Ethernet frame check sequence catches bit errors on one hop.','Transport: TCP and UDP checksums cover header and data end to end between hosts, though the weak 16-bit sum is not enough alone for large transfers.','Storage: databases and file systems checksum pages and blocks to detect silent disk corruption (bit rot) and repair from replicas.','Application: upload APIs accept an MD5, CRC32C or SHA-256 from the client and verify after upload; Kafka verifies each record batch.']},
 {h:'The end-to-end argument',p:['Every hop can verify its own link, but corruption can happen between checks: in a router\'s memory, in a buffer, in software that copies data. Only a check from the original source to the final consumer proves the whole path, so critical data gets an end-to-end checksum at the application layer.'],
  ul:['Compute the checksum as early as possible and verify as late as possible.','Re-verify periodically for data at rest (scrubbing).']},
 {h:'Common mistakes',ul:['Using a checksum or plain hash as a security control. An attacker who can change the data can recompute it.','Using MD5 or SHA-1 where collision resistance matters.','Comparing checksums of data that was re-encoded or normalised differently.','Ignoring corruption in the pipeline because TCP "guarantees" delivery; TCP\'s check is weak and does not cover disk or memory.']}
],[
 {q:'Why do large-scale storage systems checksum data even though disks and networks already have error checks?',cover:['Silent corruption exists: bit rot, firmware bugs, faulty controllers, memory errors, and software bugs that copy wrong data; lower-layer checks do not cover all paths.','End-to-end argument: only a checksum computed at the source and verified at the consumer covers the whole path.','Detect on read and write, scrub data in the background, and repair from replicas or erasure-coded fragments.','Choose the algorithm for speed and detection power (CRC32C with hardware support) and store checksums separately or with the block, ideally covering the checksum itself too.','Design the response: quarantine, repair, alert on rates by disk and host to find failing hardware.'],pitfalls:['Verifying only at write time.','Storing the checksum in a place that shares a failure mode with the data.']},
 {q:'A partner uploads files to your service. How do you make sure they arrived intact, and when do you need more than a checksum?',cover:['Client computes a checksum (SHA-256 or CRC32C) and sends it in a header; the server computes its own over the stored bytes and rejects a mismatch; for large files use per-part checksums.','This detects accidental corruption. If the channel or the partner could be tampered with, the checksum must travel over an authenticated path, or use an HMAC or a digital signature.','Also store the checksum as metadata, use it for deduplication and resumable uploads, and verify again on download.','Consider the threat model explicitly: accidental versus adversarial.'],pitfalls:['Sending the hash in the same unauthenticated channel as the file and calling it secure.','Using MD5 as a security measure.']},
 {q:'You see occasional corrupted records in a data pipeline that reads from a message queue, transforms and writes to a database. Where would you add checks and how would you find the corrupting stage?',lvl:'Staff+',cover:['Add an end-to-end checksum or content hash at the producer, carried in the record, and verify at each stage boundary and at the sink, logging the stage at which the mismatch first appears.','Use record-level and batch-level checks; sample or shadow-verify to bound cost.','Correlate failures with hosts, zones, software versions and time to separate hardware faults (a bad memory module or NIC) from software bugs (serialisation, truncation, encoding).','Remediate: quarantine bad records to a dead-letter store, replay from the source of truth, and add alerts on mismatch rate.','Account for performance cost and the schema evolution problem so that a legitimate format change does not look like corruption.'],pitfalls:['Checking only at the end and learning nothing about where it broke.','Treating corruption as a one-off rather than a signal about hardware.']}
]);

PHASES[1].iq=[
 {q:'A user types a URL and presses Enter. Describe everything that happens until the first byte of the response arrives, with approximate round trips, and how you would cut the time for users far away.',cover:['DNS (cached or a multi-hop walk), then TCP handshake (1 RTT), TLS handshake (1 RTT for TLS 1.3, 2 for 1.2), then the HTTP request and first byte (1 RTT plus server time).','A cold connection costs 3 to 4 round trips before useful work; distance multiplies it.','Cut it with CDN edges that terminate TLS near users, connection reuse and pooling to origins, TLS 1.3 with session resumption, HTTP/3, preconnect hints and fewer origins.','Measure per phase with real-user monitoring split by region and network type.'],pitfalls:['Skipping DNS and TLS.','Only talking about server speed.']},
 {q:'Design the network entry path for a global web service: DNS, edge, load balancers and backends. Where are the single points of failure and how do you remove them?',lvl:'Staff+',cover:['DNS with multiple authoritative providers and anycast; CDN or global proxy at the edge; regional L7 balancers across zones; L4 below if needed; stateless backends.','SPOFs to remove: DNS provider, single balancer, single zone or region, certificate expiry, the configuration pipeline.','Health checks, failover behaviour, capacity headroom for loss of a zone or region, and overload protection.','Operational: gradual rollouts, game days, alerting from outside the network.'],pitfalls:['Redundant servers behind a single balancer.','Not mentioning DNS or certificates as dependencies.']},
 {q:'Where do you terminate TLS in a multi-tier architecture, and what are the trade-offs of terminating at the edge versus re-encrypting to backends?',cover:['Edge termination centralises certificates, enables L7 features and caching, and lowers CPU on backends, but traffic inside the network is plaintext unless re-encrypted.','Re-encryption or mutual TLS inside (to the proxy and between services) protects against internal snooping and lateral movement, at the cost of CPU, latency and certificate management at scale (often a service mesh).','Compliance and threat model decide; regulated data usually needs encryption in transit everywhere.','Operationally, automate certificate rotation and watch handshake cost.'],pitfalls:['Assuming the internal network is safe.','Ignoring certificate lifecycle work.']},
 {q:'For each of these problems, name the likely networking cause and the first tool you would reach for: (1) intermittent connection failures under load, (2) only large requests hang, (3) users in one country cannot reach you, (4) 5xx spikes after a deploy.',cover:['(1) Ephemeral port or conntrack exhaustion, connection churn, backend limits: ss counts by state, NAT metrics.','(2) MTU or path MTU or proxy body limits: ping with DF flag, packet capture, proxy logs.','(3) DNS poisoning or resolver issues, routing or BGP problems, geo blocks: dig from that region, traceroute, synthetic probes from the country.','(4) Health-check or draining misconfiguration, timeouts mismatch, bad backends in the pool: balancer metrics, per-backend error rates, rollback.','Method: isolate by layer, compare working and failing paths, and use data over guesses.'],pitfalls:['Reaching for the application first every time.','Changing several things at once.']}
];

/* ===== Phase 2 lessons: API Fundamentals ===== */
lesson(2,{key:'APIs',short:'APIs',tag:'APIs 1 of 8',title:'APIs: a contract between two programs',
  lead:'An API (application programming interface) is the set of requests one program may send to another, and the replies it can expect. It is a contract: the caller does not care how the work is done, only what to send and what comes back. On the web, most APIs run over HTTP and exchange JSON.',
  more:['Every API call has the same parts: a method (what to do), a path (which thing), headers (metadata such as authentication), an optional body, and a reply with a status code and a body. GET reads, POST creates or triggers, PUT replaces, PATCH changes part, DELETE removes. Status codes group by their first digit: 2xx worked, 3xx go elsewhere, 4xx the caller made a mistake, 5xx the server failed.',
    'Two properties of methods matter in system design. Safe methods (GET) never change anything, so caches and crawlers may call them freely. Idempotent methods (GET, PUT, DELETE) leave the same end state if repeated, so a client that times out may retry them without fear. POST is neither, which is why retries on POST need extra care (see the Idempotency lesson).',
    'An API is also a boundary you cannot easily take back. Once other teams or customers depend on a field, you must keep it working or version it. Treat the shape of an API as a product decision, and the code behind it as an implementation detail.'],
  demo:'apis',takeaway:'An API is a long-lived contract. Know what each HTTP method promises (safe, idempotent), read status codes by their first digit, and design every endpoint knowing a client will one day retry it.',
  pre:['HTTP/HTTPS'],
  quiz:[{q:'A mobile app sends POST /orders and the connection drops before any reply arrives. What is the risk of simply sending it again?',o:['None, the server ignores duplicates automatically','The server may have created the order already, so a retry can create a second one','The request will always fail with 400'],a:1,why:'POST is not idempotent. The first request may have succeeded with the reply lost. Without an idempotency mechanism, the retry creates a duplicate.',hint:'Think about what the client knows after a timeout.'},
        {q:'Which status code family means the client sent something wrong and retrying the same request will not help?',o:['2xx','4xx','5xx'],a:1,why:'4xx means the request itself is at fault (bad input, no permission, not found). 5xx means the server failed and a retry may succeed. 429 is the notable 4xx that does say try later.',hint:'The first digit tells you whose fault it is.'}],
  terms:[['Endpoint','A method plus a path, such as GET /orders/42.'],['Idempotent','Repeating the call leaves the same end state as calling once.'],['Safe method','A method that does not change server state, such as GET.'],['Status code','Three-digit result: 2xx ok, 4xx client error, 5xx server error.']]});

lesson(2,{key:'API Gateway',short:'API Gateway',tag:'APIs 2 of 8',title:'API gateway: one front door for many services',
  lead:'When a system is split into many services, clients should not need to know about all of them. An API gateway is a single entry point that takes every request, checks it, and sends it to the right service. It is a reverse proxy that understands your APIs.',
  more:['A gateway handles the work every request needs so each service does not repeat it: TLS termination, authentication, rate limiting, request logging and metrics, routing by path or header, and protocol translation (public REST to internal gRPC, for example). Putting these in one place gives you a single spot for security policy and a single place to watch traffic.',
    'A gateway can also aggregate. A phone screen that needs profile, orders and recommendations would otherwise make three or four calls across a slow mobile network. The gateway takes one call, fans out to the services in parallel inside the data center where hops cost a couple of milliseconds, and merges the reply. A variation, the backend for frontend (BFF), gives each client type (web, iOS, partner API) its own gateway shaped to what that client needs.',
    'The cost is that the gateway sits on every request path. It must be highly available and horizontally scaled, kept thin (routing, security and aggregation, not business rules), and watched closely, otherwise it becomes both a single point of failure and a team bottleneck.'],
  demo:'gateway',takeaway:'A gateway centralises cross-cutting concerns and can cut client round trips by aggregating. Keep it thin and highly available, because it is on every request.',
  pre:['Proxy vs Reverse Proxy','APIs'],
  quiz:[{q:'A phone app takes 800 ms to render its home screen because it calls five backend services one by one. What does an aggregating gateway or BFF change?',o:['It makes each backend service faster','It turns several slow mobile round trips into one, and the fan-out happens inside the data center','It removes the need for authentication'],a:1,why:'The slow part is the mobile network round trips. One call to the gateway pays that cost once, and the parallel calls behind it are on a fast internal network.',hint:'Where is the time actually spent?'},
        {q:'Which is the most important risk of putting all traffic through one gateway?',o:['It must be built in a different language','It becomes a single point of failure and a bottleneck unless it is replicated and kept thin','It cannot do authentication'],a:1,why:'Every request depends on it, so it needs redundancy, horizontal scaling and discipline about keeping business logic out.',hint:'Think SPOF.'}],
  terms:[['BFF','Backend for frontend: a gateway tailored to one kind of client.'],['Aggregation','Combining several service replies into one response.'],['Edge','The outermost layer, where traffic first enters your system.'],['Cross-cutting concern','Work every request needs, such as auth or logging.']]});

lesson(2,{key:'REST vs GraphQL',short:'REST vs GraphQL',tag:'APIs 3 of 8',title:'REST vs GraphQL: who decides the shape of the response',
  lead:'In REST the server decides what each URL returns. In GraphQL the client sends a query that says exactly which fields it wants, and the server returns just those. Both run over HTTP. The difference is where the flexibility lives, and what that costs.',
  more:['REST models the world as resources with URLs (/users/42, /users/42/posts) and uses HTTP methods and status codes directly. It is simple, easy to cache with ordinary HTTP caches and CDNs, easy to debug with curl, and every tool understands it. Its weakness shows up on rich screens: over-fetching (the endpoint returns many fields you do not need) and under-fetching (one screen needs several calls that depend on each other).',
    'GraphQL exposes a typed schema and usually a single endpoint. A client asks for nested data in one request and gets back only those fields. This helps mobile clients and teams where front ends change fast. The price is on the server side: every field needs a resolver, naive resolvers cause the N+1 query problem (one query for a list, then one per item), a query can be made deliberately expensive so you need depth and cost limits, and responses are POSTs so HTTP caching does not work by default.',
    'Neither is better in general. Public, cache-heavy, resource-style APIs fit REST. A product with many clients and screens that mix data from many services fits GraphQL, often as a layer in front of REST or gRPC services. Many companies use both.'],
  demo:'restgql',takeaway:'REST: simple, cacheable, server-shaped replies. GraphQL: client-shaped replies in one trip, paid for with server complexity and weaker HTTP caching. Choose by who your clients are.',
  pre:['APIs','API Gateway'],vid:'PTfZcN20fro',
  quiz:[{q:'A public read-heavy API serves product pages that are the same for millions of users and sits behind a CDN. Which fits better by default?',o:['REST, because plain GET URLs are cached by HTTP caches and CDNs','GraphQL, because every query is a unique POST','Neither can be cached'],a:0,why:'GET on a stable URL is exactly what CDNs cache. GraphQL over POST needs extra work (persisted queries, GET for queries) to get similar caching.',hint:'What does a CDN key its cache on?'},
        {q:'A GraphQL query fetches 50 posts and the author of each. The server runs 1 query for posts and then 50 for authors. What is this called and what is the usual fix?',o:['Over-fetching; remove fields','The N+1 problem; batch the author lookups (for example with a data loader)','Under-fetching; add more endpoints'],a:1,why:'One query for the list plus N more for the items is the N+1 problem. Batching or joining the lookups reduces it to two queries.',hint:'Count the queries: 1 plus how many?'}],
  terms:[['Over-fetching','Receiving more data than the screen needs.'],['Under-fetching','Needing several calls to assemble one screen.'],['Resolver','A GraphQL function that fetches one field.'],['N+1 problem','One query for a list, then one more per item.']]});

lesson(2,{key:'WebSockets',short:'WebSockets',tag:'APIs 4 of 8',title:'WebSockets: a connection that stays open both ways',
  lead:'HTTP is request and reply: the client always asks first. For chat, live scores or collaborative editing the server needs to talk first. A WebSocket upgrades an ordinary HTTP connection into a long-lived, two-way channel where either side can send a message at any time.',
  more:['The client sends a normal HTTP request asking to upgrade. If the server agrees, the same TCP connection stays open and switches to the WebSocket protocol, with small message frames instead of full HTTP headers on each message. Messages arrive in tens of milliseconds, with no polling and no repeated handshakes.',
    'Alternatives sit between plain HTTP and WebSockets. Short polling asks every few seconds: simple, but wasteful and slow. Long polling holds a request open until something happens: lower delay, still one request per event. Server-Sent Events (SSE) is a one-way stream from server to client over plain HTTP, which is often enough for feeds and notifications and works well with proxies. Use WebSockets when the client also sends frequent messages.',
    'The price is state. Each connected client holds an open connection and some memory on one specific server, so you cannot treat servers as interchangeable. Load balancers must support long-lived connections, deploys must drain connections gracefully, clients need reconnect logic with backoff and a way to resume missed messages, and to send to a user connected to another server you need a pub/sub layer between servers.'],
  demo:'realtime',takeaway:'Use WebSockets (or SSE) when the server must push often. Plan for the cost: one open connection per client, sticky or routed connections, reconnect and resume logic, and a pub/sub layer to reach users on other servers.',
  pre:['HTTP/HTTPS','TCP vs UDP'],
  quiz:[{q:'A live sports score page only needs the server to send updates to the browser, never the other way. Which is usually the simplest fit?',o:['Short polling every second','Server-Sent Events over plain HTTP','A custom UDP protocol'],a:1,why:'SSE is a one-way server push over ordinary HTTP. It is simpler than WebSockets, works through most proxies and reconnects automatically.',hint:'Do you need the client to send frequent messages?'},
        {q:'Two users are chatting. User A is connected to WebSocket server 1 and user B to server 2. How does A\'s message reach B?',o:['Server 1 connects directly to B\'s browser','Servers publish messages to a shared pub/sub layer, and server 2 pushes it down B\'s connection','It cannot, both users must be on the same server'],a:1,why:'Each connection lives on one server, so servers need a shared channel (Redis pub/sub, a message broker) to route a message to whichever server holds the recipient.',hint:'Who knows which server B is on?'}],
  terms:[['Upgrade','An HTTP request that switches the connection to another protocol.'],['SSE','Server-Sent Events: a one-way push stream over HTTP.'],['Long polling','Holding a request open until there is data to return.'],['Heartbeat','A small periodic message that shows a connection is alive.']]});

lesson(2,{key:'Webhooks',short:'Webhooks',tag:'APIs 5 of 8',title:'Webhooks: the provider calls you',
  lead:'Instead of your system asking a payment provider every few seconds whether a payment finished, you give the provider a URL and it sends an HTTP request to you when the event happens. A webhook is an API call in reverse: the service that has the news calls the service that wants it.',
  more:['A webhook endpoint is just a public URL that accepts POST requests. The provider sends a JSON event (type, id, data) and expects a quick 2xx reply. Because anyone can POST to a public URL, the provider signs each request with a shared secret (an HMAC of the body plus a timestamp), and you must verify the signature and reject old timestamps before trusting the event.',
    'Delivery is at least once, never exactly once. If your endpoint is slow or down the provider retries with growing delays, sometimes for days, and sometimes sends the same event twice even after a success. Events can also arrive out of order. So the receiver must be idempotent (store processed event ids), tolerate any order (fetch the current state from the API when it matters), and answer fast.',
    'The usual receiver design is: verify the signature, write the raw event to a queue or table, return 200 immediately, and process asynchronously. Doing the real work inside the request means timeouts, retries and duplicates all pile up on the slowest path. As a provider, you also need retry schedules, a dead letter or replay tool, per-customer rate limits and delivery logs customers can inspect.'],
  demo:'steps',opts:{variants:{
    'Happy path':{actors:['Provider','Your endpoint','Your worker'],steps:[
      {f:0,t:0,m:'Payment succeeds',n:'Something happens inside the provider\'s system and they want to tell you.'},
      {f:0,t:1,m:'POST /webhooks  (event id evt_81, signature header)',n:'The provider sends a JSON event and signs the body with a shared secret, plus a timestamp.'},
      {f:1,t:1,m:'Verify signature and timestamp',n:'You recompute the HMAC with your secret and compare. You also reject timestamps older than a few minutes so a captured request cannot be replayed later.'},
      {f:1,t:2,m:'Save event evt_81 to a queue',n:'You store the event and do not process it inside the request.'},
      {f:1,t:0,m:'200 OK (a few milliseconds)',n:'You acknowledge quickly. A slow reply looks like a failure to the provider and triggers retries.',r:1},
      {f:2,t:2,m:'Process: mark the order as paid',n:'The worker handles it at its own pace. It checks the event id first so a duplicate does nothing.'}]},
    'Your endpoint is down':{actors:['Provider','Your endpoint'],steps:[
      {f:0,t:1,m:'POST /webhooks (evt_82)',n:'The provider sends the event.'},
      {f:1,t:0,m:'503 Service Unavailable',n:'Your server is mid-deploy or overloaded.',bad:1,r:1},
      {f:0,t:0,m:'Wait 1 minute, retry',n:'Providers retry with growing delays: seconds, minutes, then hours, often for up to several days.'},
      {f:0,t:1,m:'POST /webhooks (evt_82 again)',n:'Same event, same id.'},
      {f:1,t:0,m:'503 again',n:'Still down.',bad:1,r:1},
      {f:0,t:1,m:'Retry after 10 minutes: POST (evt_82)',n:'You are back up.'},
      {f:1,t:0,m:'200 OK',n:'Delivered. The lesson: webhooks are at-least-once, so you may be down for a while and still get the event, but you must handle repeats.',r:1}]},
    'Forged and duplicate calls':{actors:['Attacker','Provider','Your endpoint'],steps:[
      {f:0,t:2,m:'POST /webhooks {"paid": true}  (no valid signature)',n:'Anyone can find a public URL and send a fake "payment succeeded" event.'},
      {f:2,t:0,m:'401 Unauthorized',n:'Signature check fails, so the event is rejected before anything is read from it.',bad:1,r:1},
      {f:1,t:2,m:'POST /webhooks (evt_83, valid signature)',n:'A real event arrives and you start processing it.'},
      {f:2,t:2,m:'Processing is slow, request times out',n:'Your handler did the real work inline and ran past the provider\'s timeout.',bad:1},
      {f:1,t:2,m:'POST /webhooks (evt_83 again)',n:'The provider retries because it never saw a 2xx.'},
      {f:2,t:2,m:'evt_83 already recorded, skip',n:'Because you store event ids you see this is a repeat.'},
      {f:2,t:1,m:'200 OK',n:'You acknowledge without doing the work twice.',r:1}]}}},
  takeaway:'Webhooks push events to you. Verify the signature, acknowledge fast, store the event, process asynchronously, and make processing idempotent because delivery is at least once and may be out of order.',
  pre:['HTTP/HTTPS','APIs'],
  quiz:[{q:'Your webhook handler calls three slow services before returning 200, and the provider keeps retrying the same event. What is the best fix?',o:['Lengthen your server timeout to one hour','Save the event, return 200 right away, and process it from a queue','Ignore all retries'],a:1,why:'Acknowledging fast stops needless retries. Queueing the event moves slow work off the request path and lets you control the pace.',hint:'The provider only needs to know you received it.'},
        {q:'Why must a webhook receiver verify a signature instead of trusting the POST?',o:['Because HTTP is unreliable','Because anyone can send a request to a public URL, including fake events','Because JSON is hard to parse'],a:1,why:'Without a signature check an attacker could forge a "payment succeeded" event. The HMAC proves the sender knows the shared secret.',hint:'The URL is public.'}],
  terms:[['HMAC','A hash that uses a secret key, so only the key holders can produce it.'],['At-least-once','Delivery guarantee: an event may be delivered more than once, never zero times.'],['Replay attack','Re-sending a captured valid request later.'],['Dead letter','A place for events that kept failing, for later inspection.']]});

lesson(2,{key:'Idempotency',short:'Idempotency',tag:'APIs 6 of 8',title:'Idempotency: making retries safe',
  lead:'On a network, a client cannot tell "the request failed" from "the request worked but the reply was lost". So it retries, and the server sees the same request twice. An operation is idempotent when doing it many times has the same effect as doing it once. Designing for this is what separates a payment API that charges once from one that charges twice.',
  more:['Some operations are naturally idempotent: setting a value (PUT /users/7 with a full body), deleting by id, reading. Others are not: "add $10", "create an order", "send an email". For those, the standard fix is an idempotency key. The client generates a unique key per logical action (a UUID or an order id), sends it in a header, and reuses the same key on every retry of that action.',
    'The server stores each key with the result of the first attempt. On a repeat it does not run the work again, it returns the saved result. Three details matter. The check and the work must be atomic, with a unique constraint on the key or a lock, or two simultaneous retries both slip through. The stored key must include a fingerprint of the request so the same key with a different body is rejected rather than replayed. And keys expire after a window (often 24 hours) so storage does not grow without bound.',
    'The same idea protects message consumers. A queue delivers at least once, so a consumer records which message ids it has processed (or makes the update itself a "set" operation) so redelivery does nothing. "Exactly once" in distributed systems is really at-least-once delivery plus idempotent processing.'],
  demo:'idem',takeaway:'Retries are unavoidable, so make operations safe to repeat. Use an idempotency key stored atomically with the first result, return the saved result on repeats, and apply the same thinking to every queue consumer.',
  pre:['APIs','Webhooks'],
  quiz:[{q:'A client retries POST /charges with the same Idempotency-Key after a timeout. What should the server do if the first attempt already succeeded?',o:['Charge again, then refund the extra','Return the stored result of the first attempt without charging again','Return 500'],a:1,why:'The key lets the server recognise the repeat and replay the original answer, so the effect happens exactly once.',hint:'The server remembered the key.'},
        {q:'Two identical requests with the same key arrive at the same instant on different servers. What protects the customer?',o:['Nothing, the odds are tiny','An atomic check, such as a unique constraint on the key, so only one request does the work','Faster servers'],a:1,why:'A check-then-act without atomicity has a race: both see no key and both run. A unique constraint or lock makes exactly one win.',hint:'Think of the gap between checking and writing.'}],
  terms:[['Idempotency key','A client-chosen unique id for one logical action, reused on retries.'],['Replay','Returning the stored first result instead of redoing the work.'],['Exactly once','In practice: at-least-once delivery plus idempotent processing.'],['Unique constraint','A database rule that rejects a second row with the same key.']]});

lesson(2,{key:'Rate limiting',short:'Rate limiting',tag:'APIs 7 of 8',title:'Rate limiting: protecting a service from too much traffic',
  lead:'A rate limiter caps how many requests a client may make in a period. It protects the service from overload and abuse, keeps one noisy customer from starving the others, controls cost, and enforces paid plans. When the limit is hit the server answers 429 Too Many Requests, usually with a Retry-After hint.',
  more:['Four algorithms cover most designs. Fixed window counts requests in each clock window (for example 100 per minute) and resets: very cheap, but a client can send 100 at the end of one minute and 100 at the start of the next, so almost double the limit lands in a few seconds. Sliding window log stores a timestamp for every request and is exact but uses memory per request. Sliding window counter blends the current and previous window counts to approximate a true sliding window with tiny state. Token bucket adds tokens at a steady rate up to a capacity and spends one per request: it allows short bursts and enforces the average rate, which is why many APIs use it. Leaky bucket processes at a constant rate and queues the rest, which smooths traffic out.',
    'In a distributed system the counters must be shared. The common design keeps them in Redis and updates them with an atomic script, so every API server sees the same count. For very high rates, servers can keep local counters and sync occasionally, accepting some slack. Decide what happens if the limiter itself is down: failing open keeps the product working but unprotected, failing closed protects the backend but blocks everyone.',
    'Decide who is being limited: API key, user, IP address, or endpoint. IP-based limits hurt people behind shared addresses and are easy to evade. Return limit headers so well-behaved clients can slow down, and tell clients to retry with exponential backoff and jitter so a flood of rejected clients does not all come back at the same second.'],
  demo:'ratelimit',takeaway:'Pick the algorithm by the burst you will tolerate: fixed window is cheapest but leaks bursts at boundaries, sliding log is exact but costly, token bucket allows controlled bursts. Share counters across servers and decide what to do when the limiter fails.',
  pre:['API Gateway','Idempotency'],
  quiz:[{q:'A limit is 100 requests per minute using fixed windows. A client sends 100 requests at 12:00:59 and 100 more at 12:01:00. What happens?',o:['The second batch is blocked','Both batches are allowed, so 200 requests hit in about two seconds','Only 50 of the second batch pass'],a:1,why:'Each batch lands in a different window with a fresh counter. This boundary burst is the main weakness of fixed windows.',hint:'Where does the counter reset?'},
        {q:'Which algorithm allows a short burst but still keeps the long-run average at the limit?',o:['Fixed window counter','Token bucket','Sliding window log'],a:1,why:'A full bucket lets a burst through, then requests are limited to the refill rate. That is the property API providers want.',hint:'Think of saved-up credit.'}],
  terms:[['429','HTTP status for Too Many Requests, often with a Retry-After header.'],['Token bucket','Tokens refill at a steady rate; each request spends one.'],['Backoff and jitter','Waiting longer after each failure, with randomness, to avoid retry stampedes.'],['Fail open','If the limiter is down, let traffic through.']]});

lesson(2,{key:'API Design',short:'API Design',tag:'APIs 8 of 8',title:'API design: making an API people can use for years',
  lead:'A good API is predictable, hard to misuse, and survives change. Most of the long-term pain in an API comes from a few early decisions: how resources are named, how lists are paged, how errors look, how versions work, and what happens on retries.',
  more:['Model nouns, not verbs: /orders and /orders/42 with HTTP methods for the action, and consistent plural names and field casing. Use status codes properly (201 for created, 204 for no content, 400 for bad input, 401 for unauthenticated, 403 for forbidden, 404 for missing, 409 for conflict, 429 for rate limited) and return errors in one consistent JSON shape with a machine-readable code, a human message and a request id.',
    'Page every list from day one. Offset pagination (?page=3) is simple but slow on large tables and skips or repeats rows when data changes during paging. Cursor pagination (?after=opaque_token) returns a stable next page and scales well, at the cost of not jumping to page 50. Let clients filter, sort and select fields so they do not need new endpoints for each screen.',
    'Plan for change. Additive changes (new optional fields, new endpoints) are safe if clients ignore unknown fields. Breaking changes need a new version, in the URL (/v2/orders) or a header, with a published deprecation window. Make unsafe operations retry-safe with idempotency keys, document rate limits, and publish a machine-readable spec (OpenAPI) so clients, tests and docs come from one source.'],
  demo:'pick',opts:{prompt:'Pick the design tool that solves each problem.',options:[
    {id:'cursor',name:'Cursor pagination',desc:'Stable next-page tokens'},
    {id:'idem',name:'Idempotency key',desc:'Safe retries on POST'},
    {id:'version',name:'New API version',desc:'/v2 with a deprecation window'},
    {id:'fields',name:'Field selection / filtering',desc:'Clients choose fields and filters'},
    {id:'limit',name:'429 + Retry-After',desc:'Rate limit with a retry hint'}],
    rounds:[
    {s:'An infinite-scroll feed keeps getting new posts at the top. Page 2 sometimes repeats items from page 1.',a:'cursor',why:'Offset paging shifts when new rows are inserted. A cursor points at a position in the data, so the next page is stable.'},
    {s:'Mobile clients retry POST /payments on bad networks and some customers were charged twice.',a:'idem',why:'An idempotency key lets the server recognise the retry and return the first result.'},
    {s:'You must rename a response field that thousands of partner apps depend on.',a:'version',why:'Renaming is a breaking change. Ship it in a new version and keep the old one alive through a published deprecation window.'},
    {s:'A watch app only needs two fields from a 60-field user object and downloads all of it.',a:'fields',why:'Letting the client select fields (or offering a lean variant) cuts payload size without a new endpoint per client.'},
    {s:'One customer\'s script is hammering your API and slowing everyone else.',a:'limit',why:'Rate limit per key and answer 429 with Retry-After so well-behaved clients slow down.'}]},
  takeaway:'Name resources as nouns, return consistent errors, page every list (prefer cursors at scale), make unsafe calls retry-safe, and treat every published field as a promise that needs a versioning plan.',
  pre:['APIs','Idempotency','Rate limiting'],
  quiz:[{q:'Which change to a public API is safe without a new version?',o:['Renaming a field','Adding a new optional response field','Changing a field from a number to a string'],a:1,why:'Clients that ignore unknown fields keep working. Renames and type changes break existing clients.',hint:'Which change cannot break existing code?'},
        {q:'Why is offset pagination a problem on a table with 100 million rows and constant inserts?',o:['It cannot return JSON','Deep offsets are slow because the database still walks past all skipped rows, and results shift as rows are inserted','It needs HTTPS'],a:1,why:'OFFSET N must skip N rows each time and the window moves when data changes, giving slow queries and repeated or missing items.',hint:'What does the database do to find row 5,000,000?'}],
  terms:[['OpenAPI','A standard file format that describes an HTTP API.'],['Cursor','An opaque token marking where the next page starts.'],['Breaking change','A change that makes existing clients fail.'],['Deprecation window','The announced period an old version keeps working.']]});

/* ===== Phase 2: in-depth sections and senior interview questions ===== */

enrich('APIs',[
 {h:'Anatomy of a call',p:['A request is a method, a URL (path and query string), headers and an optional body. A response is a status code, headers and a body. Everything else in API design is a convention on top of these parts.'],
  ul:['Headers carry authentication (Authorization), content negotiation (Content-Type, Accept), caching (Cache-Control, ETag), and tracing (request ids).','Query parameters filter, sort and page; the body carries the thing being created or replaced.','Keep GET free of side effects. Crawlers, prefetchers and caches will call it.']},
 {h:'Safe, idempotent and cacheable are different properties',ul:['Safe: does not change state (GET, HEAD, OPTIONS).','Idempotent: repeating gives the same end state (GET, PUT, DELETE and also HEAD and OPTIONS). POST and a PATCH that adds to a value are not.','Cacheable: the reply can be stored and reused. GET is cacheable by default, and conditional requests (If-None-Match with an ETag) turn repeats into cheap 304 replies.','Idempotent does not mean the same response: a repeated DELETE may return 404 the second time and still be idempotent.']},
 {h:'Reading status codes',ul:['2xx: 200 OK, 201 Created (with a Location header), 202 Accepted (work queued), 204 No Content.','3xx: 301 and 308 permanent redirects, 302 and 307 temporary, 304 Not Modified.','4xx: 400 invalid input, 401 not authenticated, 403 not allowed, 404 not found, 409 conflict, 422 semantically invalid, 429 too many requests.','5xx: 500 unexpected failure, 502 and 504 a gateway got a bad or no reply from a backend, 503 temporarily unavailable. Clients may retry 5xx with backoff, and should not retry most 4xx.']},
 {h:'Styles you will meet',ul:['REST over JSON: resources and HTTP verbs; the default for public APIs.','GraphQL: client-shaped queries, one endpoint.','gRPC: typed contracts with Protocol Buffers over HTTP/2, fast and compact, common between internal services.','Webhooks and streaming (WebSocket, SSE): the server pushes to the client.']},
 {h:'Common mistakes',ul:['Using 200 with an error inside the body, which breaks monitoring and retries.','Letting GET change state.','Exposing database structure as the API, so every schema change is a breaking change.','Shipping without pagination, timeouts and rate limits, then adding them under pressure.']}
],[
 {q:'A client calls POST /orders, the connection times out, and the client retries. Walk through what can go wrong and every layer you would put in to make this safe.',cover:['Timeout is ambiguous: the server may have processed the request. A blind retry can duplicate the order.','Idempotency key generated by the client per logical order, sent in a header, stored by the server with the first result and a request fingerprint.','Atomic claim of the key (unique constraint), replay of the stored response, and a distinct response for a request still in flight.','Client side: retry only on timeouts and 5xx with exponential backoff and jitter, with a retry budget; same key every attempt.','Observability: log the key and request id, and alert on duplicate-key rates.'],pitfalls:['Saying "just make POST idempotent" without a mechanism.','Retrying immediately in a tight loop, creating a retry storm.']},
 {q:'How would you design the error model for a public API used by thousands of third-party developers?',cover:['One consistent JSON error shape: stable machine-readable code, human message, field-level details for validation errors, request id, optional link to documentation.','Correct HTTP status codes so generic clients, proxies and monitoring behave; never 200 for errors.','Distinguish retryable from non-retryable errors, include Retry-After for 429 and 503.','Never leak internals (stack traces, SQL), treat error codes as part of the contract and version them.','Test the error paths and publish them in the OpenAPI spec.'],pitfalls:['Free-text errors that clients parse with regular expressions.','Changing error codes between releases.']},
 {q:'Your company wants to expose an internal service to partners. What changes between an internal API and a public one?',lvl:'Staff+',cover:['Stability: a public field is a promise, so introduce versioning, a deprecation policy and contract tests.','Security: authentication (OAuth 2 or API keys), authorisation per resource and scope, input validation, least privilege, audit logs.','Protection: rate limits and quotas per customer, request size and time limits, pagination caps, abuse detection.','Operability: SLOs, status page, support tooling, request ids, per-customer dashboards.','Developer experience: OpenAPI spec, SDKs, sandbox environment, clear changelog, idempotency support.','Decouple the public contract from the internal model with a gateway or façade so internals can change.'],pitfalls:['Exposing the internal service directly and then being unable to change it.','Treating rate limits and versioning as later work.']}
]);

enrich('API Gateway',[
 {h:'What belongs in the gateway',ul:['Edge concerns: TLS termination, authentication and token validation, coarse authorisation, rate limiting and quotas, request size limits, WAF rules.','Routing: by host, path, header or version, with canary and blue-green traffic splits.','Observability: access logs, metrics, request ids and trace propagation.','Translation: public REST or GraphQL to internal gRPC, request and response shaping, compression, caching of public responses.']},
 {h:'What does not belong in it',p:['Business rules. When a gateway starts to hold orchestration logic and data joins it becomes a shared monolith owned by nobody and changed by everybody.'],ul:['Keep it declarative where possible: configuration over code.','Put per-feature orchestration in the owning service or in a BFF owned by the client team.','Treat gateway changes like production changes: staged rollout, versioned config, fast rollback.']},
 {h:'Aggregation and the backend for frontend',p:['Aggregation turns many client round trips into one. A BFF takes this further: one gateway per client type (web, iOS, Android, partner), owned by the team that builds that client, shaped to its screens.'],ul:['Gain: fewer slow mobile round trips and payloads tailored to the screen.','Cost: more services to run, and duplicated logic across BFFs unless shared libraries are careful.','Aggregation needs a partial-failure policy: if recommendations are down, return the page without them instead of failing everything.']},
 {h:'Availability and scaling',ul:['Run many stateless gateway instances behind a load balancer across zones; the gateway must not hold per-request state.','Fail safely: decide what happens when the auth service or rate-limit store is down (fail closed for security, fail open for non-critical limits).','Set timeouts and circuit breakers per upstream so one slow service cannot exhaust the gateway\'s connections.','Watch p99 latency added by the gateway: it adds a hop to every request.']},
 {h:'Gateway, reverse proxy, service mesh, load balancer',ul:['A load balancer spreads traffic; a reverse proxy adds TLS, caching and routing; an API gateway adds API-aware policy (auth, quotas, versions).','A service mesh handles service-to-service traffic (mTLS, retries, telemetry) inside the cluster; a gateway handles north-south traffic from outside.','One product can play several roles. Name the role, not just the tool.']}
],[
 {q:'Design the edge for a system with 40 microservices, a web app, two mobile apps and a partner API. Where do the gateway and BFFs go and who owns them?',cover:['Edge layer: global DNS and CDN, then regional load balancers into a gateway fleet doing TLS, auth, rate limiting, routing and WAF.','BFFs per client type owned by the client teams, for tailored aggregation; partner API as its own gateway product with versioning and quotas.','Services stay behind private networking and trust gateway-issued identity (signed tokens or mTLS).','Ownership: platform team owns the shared gateway and policies; client teams own BFFs; service teams own contracts.','Resilience: timeouts, circuit breakers, partial responses, autoscaling, config rollout safety.'],pitfalls:['One giant gateway with business logic that every team edits.','No plan for what the gateway does when a dependency is down.']},
 {q:'The gateway has become the slowest part of every request and a deploy bottleneck. How do you diagnose and fix it?',cover:['Measure first: latency added by the gateway per route (p50, p99), CPU, connection counts, upstream wait versus gateway time.','Remove work: move heavy plugins, body transformations and aggregation logic out; cache auth decisions and public responses.','Scale and isolate: separate gateway fleets for critical or noisy routes; connection pooling and keep-alives to upstreams.','Process: split config ownership by route group, add automated config tests, canary config rollout.','Consider a thin edge plus BFFs owned by teams, instead of one shared aggregation layer.'],pitfalls:['Adding more instances without finding what is slow.','Letting every team ship custom plugins into the shared path.']},
 {q:'How should authentication and authorisation be split between a gateway and the services behind it?',lvl:'Staff+',cover:['Gateway authenticates (validates the token, resolves the caller, applies coarse scope checks) and forwards a verified identity, for example a short-lived signed internal token.','Each service still authorises against its own data: is this user allowed to see this order. The gateway cannot know object-level rules.','Do not trust the network: services verify the internal identity (mTLS or signed claims), so a bypass of the gateway does not grant access.','Handle token expiry, revocation and propagation to downstream calls (act on behalf of the user).','Audit: log decisions with request ids for investigations.'],pitfalls:['Doing all authorisation at the edge, so any service reachable internally is wide open.','Forwarding the raw user token everywhere with no scoping.']}
]);

enrich('REST vs GraphQL',[
 {h:'REST done well',ul:['Resource-oriented URLs, correct methods and status codes, hypermedia links optional but useful.','HTTP caching for free: Cache-Control, ETag and conditional requests; CDNs can serve public GETs.','Sparse fieldsets (?fields=name,avatar) and expansion (?include=posts) close much of the over-fetch gap.','Purpose-built endpoints for hot screens are fine; REST is a style, not a ban on practicality.']},
 {h:'GraphQL: where it shines',ul:['Many clients with different data needs; the server publishes a typed graph and clients select what they need.','One round trip for nested data, which matters on slow mobile networks.','Strong typing and introspection give generated clients, docs and tooling.','Schema evolution by adding fields and deprecating old ones, without versioned URLs.']},
 {h:'GraphQL: operating costs',ul:['N+1 queries: batch with data loaders or push joins down to the database.','Query cost: any client can write an expensive query, so enforce depth limits, complexity scoring, timeouts and persisted (allow-listed) queries.','Caching: POST bodies defeat CDNs; use persisted queries over GET, response caching keyed by query, and normalised client caches.','Error handling: a response can be partly successful with HTTP 200 and an errors array, so monitoring must look inside the body.','Authorisation per field, not just per endpoint.']},
 {h:'gRPC and the third option',p:['For internal service-to-service calls, many teams pick gRPC: Protocol Buffers give compact binary messages and strict contracts, HTTP/2 gives multiplexing and streaming. Browsers cannot call it directly without a proxy, so public APIs usually stay REST or GraphQL.'],ul:['A common stack: public REST or GraphQL at the edge, gRPC between services.','Choose by consumer: browsers and partners, REST; many UI clients, GraphQL; internal and latency-sensitive, gRPC.']},
 {h:'Common mistakes',ul:['Adopting GraphQL to avoid designing endpoints, then having no plan for N+1 and query cost.','Calling an API "REST" while using POST for everything and 200 for errors.','Exposing the database schema one-to-one as the GraphQL schema.']}
],[
 {q:'A team proposes replacing a REST API with GraphQL because the mobile app makes too many calls. How do you evaluate that?',cover:['Quantify the problem first: calls per screen, payload sizes, p95 on mobile; is it under-fetching or just missing endpoints?','Cheaper alternatives: a BFF or aggregation endpoint, sparse fieldsets, includes, HTTP/2, caching.','What GraphQL needs: schema governance, resolvers with batching, query cost limits, persisted queries, tracing per resolver, field-level auth.','Migration: introduce it as a layer in front of existing services, keep REST for public and cacheable endpoints.','Decide by client count and rate of change, not fashion; run a pilot on one screen and compare metrics.'],pitfalls:['Treating GraphQL as free flexibility without costing the server side.','Rewriting everything at once.']},
 {q:'How do you protect a public GraphQL API from abusive or accidentally expensive queries?',cover:['Depth and complexity limits computed from the schema; reject or truncate above a budget.','Persisted or allow-listed queries for first-party clients; only trusted operations in production.','Per-client rate limiting by query cost instead of by request count; timeouts and cancellation.','Pagination limits on every list field, disabling introspection for untrusted callers where appropriate.','Monitoring: per-operation latency, cost and error rate; alert on new expensive operations.'],pitfalls:['Rate limiting only by request count when one request can cost a thousand.','Leaving introspection and unbounded lists open.']},
 {q:'Design the data fetching layer for a social app home screen that combines data from six services, with sub-second load on mobile and graceful partial failure.',lvl:'Staff+',cover:['One client call to a BFF or GraphQL gateway; parallel fan-out to services with per-service timeouts and budgets.','Critical versus optional data: render the shell and critical parts first, defer or skip optional blocks (stream the response or use deferred fields).','Caching at several levels: CDN for public parts, edge or gateway cache for shared data, per-user cache, client cache with stale-while-revalidate.','Failure handling: circuit breakers, fallbacks, partial responses with explicit nulls and error entries.','Observability: trace the whole fan-out and track the slowest dependency per request; protect against tail latency with hedged requests or timeouts.'],pitfalls:['Waiting for the slowest of six calls with no timeout.','All-or-nothing responses.']}
]);

enrich('WebSockets',[
 {h:'The connection lifecycle',ul:['Handshake: an HTTP request with Upgrade: websocket; the server replies 101 Switching Protocols and the TCP connection becomes the socket.','Messages are small frames, text or binary, in both directions, with no per-message request headers.','Keep-alive: ping/pong or application heartbeats detect dead connections that never sent a close.','Closing: either side sends a close frame; mobile networks often drop connections silently, so assume disconnects are normal.']},
 {h:'Choosing a transport',ul:['Short polling: simplest, fine for slow updates and low client counts.','Long polling: lower delay without special infrastructure, one request per event.','SSE: one-way server push over HTTP, automatic reconnect with Last-Event-ID, good fit for feeds and notifications.','WebSocket: two-way and low overhead, for chat, collaboration, games and trading screens.','WebTransport and HTTP/3 are newer options for lower latency and multiple streams.']},
 {h:'Scaling a stateful connection tier',ul:['Each connection is pinned to one server; millions of sockets need OS tuning (file descriptors, memory per connection) and horizontal scale.','Use a pub/sub or message broker between servers so a message published on one server reaches subscribers connected to others.','Keep a presence or routing store (user to server) if you need targeted delivery.','Load balancers need long idle timeouts and connection-aware algorithms such as least connections; rolling deploys must drain connections slowly to avoid reconnect storms.']},
 {h:'Reliability on the client',ul:['Reconnect with exponential backoff and jitter; thousands of clients reconnecting at once is a self-inflicted outage.','Resume: send the last seen message id or offset so the server can replay what was missed; WebSockets give no delivery guarantee across reconnects.','Deduplicate by message id and tolerate reordering where the application needs it.','Fall back to long polling or SSE where proxies block upgrades.']},
 {h:'Security',ul:['Authenticate during the handshake (token in a header or a short-lived ticket), never trust the connection afterwards without expiry and re-checks.','Check the Origin header to block cross-site hijacking; use wss:// only.','Limit message size and rate per connection; slow or abusive clients can hold resources open.']}
],[
 {q:'Design the connection layer for a chat app with 5 million concurrent users. How do messages reach a user connected to a different server, and what happens during a deploy?',cover:['Capacity: connections per server (tens to hundreds of thousands with tuning), so a fleet of tens to hundreds of gateways; connection servers hold sockets only, business logic elsewhere.','Routing: pub/sub or broker per user or channel topic; presence/routing store mapping user to gateway for direct delivery.','Persistence: write the message to durable storage before acknowledging, then fan out; clients resume with last message id after reconnect.','Deploys: drain gateways gradually, signal clients to reconnect to another server with jittered delay, cap reconnect rate per server.','Failure modes: gateway crash (clients reconnect and resume), broker lag, thundering reconnect, and slow consumers needing backpressure.'],pitfalls:['Treating the socket as the source of truth for messages.','Restarting all gateways at once.']},
 {q:'Compare long polling, SSE and WebSockets for a notification feature used by millions of browsers. Which would you choose and why?',cover:['Notifications are mostly server to client and tolerate a second of delay; SSE or long polling over plain HTTP is often enough and simpler to operate.','SSE: automatic reconnect, event ids for resume, works through HTTP infrastructure, one-way only, per-browser connection limits under HTTP/1.1 (fine under HTTP/2).','WebSockets: needed for frequent client-to-server messages or very low latency; more operational overhead.','Cost drivers: open connections per user, idle timeouts on proxies, fan-out infrastructure; polling costs requests per second instead.','Choose the simplest that meets the latency requirement, and keep the message format transport-independent.'],pitfalls:['Picking WebSockets by default for one-way updates.','Ignoring proxy and corporate network behaviour.']},
 {q:'Your WebSocket service is healthy, but after a deploy every client reconnects at once and the service falls over. Explain the failure and how you prevent it.',lvl:'Staff+',cover:['Thundering herd: all clients lose the connection together, reconnect together, and each needs authentication and state load, so load spikes far above steady state.','Client mitigations: exponential backoff with jitter, randomised initial delay, a server-sent "reconnect after N seconds" hint.','Server mitigations: connection admission control and rate limits, cheap authentication path, drain old servers gradually so only a slice reconnects at a time, over-provision during deploys.','Resume cost: make resume cheap (offset-based catch-up, cached state) so reconnect does not trigger heavy reads.','Test it: load test the reconnect storm, add dashboards for connection churn, and game-day the deploy.'],pitfalls:['Fixing only the server capacity without changing client behaviour.','Immediate retries with no backoff.']}
]);

enrich('Webhooks',[
 {h:'Designing a receiver',ul:['Verify first: compute the HMAC over the raw body (not re-serialised JSON) with a constant-time compare, and reject timestamps outside a small window.','Persist then acknowledge: store the raw event and its id, return 2xx quickly, process in a worker.','Idempotent processing: record the event id as handled, ignore repeats.','Order independence: treat the event as a hint and fetch the latest object state from the provider API when ordering matters.','Observe: log event id, type, signature result, processing outcome and lag.']},
 {h:'Designing a sender (when you are the provider)',ul:['Signed requests with a per-customer secret, rotation support (accept old and new for a period) and a timestamp.','Retries with exponential backoff and jitter over hours or days, then a disabled-endpoint state with notification to the customer.','Delivery logs and a replay button so customers can debug and recover.','Stable event ids, versioned payloads, and a thin payload plus a fetch API for large or sensitive data.','Per-customer concurrency and rate limits so one slow endpoint cannot block everyone; isolate queues per customer.']},
 {h:'Webhooks versus polling versus streaming',ul:['Polling: simple for the consumer, wasteful, delayed, and rate-limit prone; useful as a reconciliation backstop.','Webhooks: efficient and fast, but the consumer must expose a public endpoint and handle retries, duplicates and disorder.','Streaming or queues (Kafka, SSE, pub/sub): consumer pulls an ordered log with replay; better for high volume and strict ordering.','Robust integrations combine webhooks for speed with periodic reconciliation to catch missed events.']},
 {h:'Security details that get missed',ul:['SSRF: if customers register URLs, a sender must block internal addresses and metadata endpoints and follow redirects carefully.','Do not log secrets or full sensitive payloads.','Rotate secrets and use separate secrets per endpoint.','Receivers should restrict by signature, not by source IP alone, since provider IP lists change.']},
 {h:'Common mistakes',ul:['Doing the real work inside the request and timing out.','Trusting an unsigned POST.','Assuming exactly-once or in-order delivery.','Having no way to replay missed events after an outage.']}
],[
 {q:'Design a webhook delivery system for a platform with 10,000 customers sending millions of events per day. What are the hard parts?',cover:['Event pipeline: events written to a durable log or queue, a delivery service per endpoint with its own retry schedule and state.','Isolation: per-customer queues and concurrency limits so a slow or dead endpoint does not delay others; circuit breaker per endpoint with automatic disablement and notification.','Reliability: at-least-once delivery, exponential backoff with jitter, retry for days, dead letter store and replay by customers.','Security: HMAC signing with rotation, timestamps, SSRF protection on registered URLs, TLS only.','Scale and visibility: autoscaled workers, delivery logs and metrics per endpoint, ordering policy (per object if required), payload versioning.'],pitfalls:['One shared queue where one slow customer causes head-of-line blocking.','No replay or visibility for customers.']},
 {q:'You consume a payment provider\'s webhooks and notice orders marked paid twice and some marked paid before they were created. How did that happen and how do you fix the design?',cover:['Duplicates: at-least-once delivery and provider retries; fix with an idempotent handler that records event ids and makes the state change conditional.','Out of order: events can arrive before the related record exists or in the wrong order; fix by treating the event as a notification and reading current state from the API, or by buffering and retrying until the prerequisite exists.','Handler hygiene: verify signature, store raw event, ack fast, process asynchronously, use transactions around state change and event id insert.','Safety net: periodic reconciliation job against the provider API.','Add alerts for processing lag, repeated failures and mismatches.'],pitfalls:['Assuming order and exactly-once.','Making the HTTP handler perform long processing.']},
 {q:'How would you make a system that depends on partner webhooks resilient to the partner being down for six hours, or to your own endpoint being down?',lvl:'Staff+',cover:['Your endpoint down: provider retries; your job is to recover and be idempotent; keep the endpoint a thin, highly available ingest layer separate from business processing so it stays up when the rest fails.','Partner down or events lost: reconciliation by polling the partner\'s list or changes API on a schedule using a cursor, so gaps are filled without webhooks.','Reprocessing: keep raw events for replay and be able to rebuild state from them.','Monitoring: alert on silence (no events when you expect some), lag between event time and processing time, and reconciliation diffs.','Runbooks: manual replay tools, backfill procedures and communication with the partner.'],pitfalls:['Relying on webhooks alone with no backstop.','Ingest and processing coupled so any downstream outage drops events.']}
]);

enrich('Idempotency',[
 {h:'Naturally idempotent and not',ul:['Set operations are idempotent: SET status = shipped, PUT with a full body, DELETE by id.','Relative or creating operations are not: balance = balance + 10, INSERT a new row, send an email, publish a message.','Often you can reshape: instead of "add 10" send "set balance to 110 if version is 7" (compare-and-set) or store each transfer as its own row with a unique id.']},
 {h:'The idempotency key pattern step by step',ul:['Client generates one key per logical action (UUID or business id) and reuses it for retries.','Server, in one transaction: insert (key, request fingerprint, status = in progress) with a unique constraint; if it already exists, read it instead of working.','Do the work; save the response and mark complete in the same transaction where possible.','On a repeat: complete means replay the saved response; in progress means wait, or return 409 or 425 so the client retries shortly; fingerprint mismatch means return 422.','Expire keys after a window (for example 24 hours) and say so in the docs.']},
 {h:'The hard cases',ul:['Side effects outside your database (charging a card, sending an email): pass your key or a derived one to the downstream API, because a crash between "did it" and "recorded it" can repeat the external action.','Crash mid-operation: design the steps as a state machine so a retry resumes at the right step, not from the start.','Concurrent duplicates: need a lock or unique constraint, not a read-then-write check.','Multiple regions: the key store must be consistent for the key scope, or route a given key to one region.']},
 {h:'Message consumers',ul:['Brokers deliver at least once, so every consumer needs deduplication by message id or naturally idempotent updates.','Transactional inbox: record the processed message id in the same transaction as the state change.','Transactional outbox on the sending side: write the event with the data change, then publish from the outbox, so a crash cannot lose or invent events.','"Exactly once" claims are scoped to a system boundary; across systems it is at-least-once plus idempotency.']},
 {h:'Common mistakes',ul:['Check-then-insert without a constraint, losing the race.','Reusing one key for different requests, or generating a new key on every retry.','Treating the key store as optional or letting it evict entries early.','Ignoring downstream calls that are not idempotent.']}
],[
 {q:'Design the idempotency layer for a payments API. Include the storage schema, the concurrency behaviour, and what happens when the server crashes halfway through a charge.',cover:['Table keyed by (merchant, idempotency key) with request hash, state (started, charged, completed), response snapshot, created time; unique constraint on the key scope.','Flow: atomic insert of the key; if present, replay or wait depending on state; fingerprint mismatch returns an error.','Crash recovery: state machine with recorded steps; the external charge uses a derived idempotency key so retrying the PSP call cannot double charge; a recovery job resumes started requests.','Concurrency: unique constraint or row lock; in-progress duplicates get 409 with retry hint.','Operations: key TTL, storage sizing, metrics on replays and conflicts, and clear docs for client retry behaviour.'],pitfalls:['Doing check-then-act without atomicity.','Forgetting the external side effect can repeat after a crash.']},
 {q:'A queue consumer processes "credit account" messages. Messages are sometimes redelivered. How do you prevent double credits?',cover:['Assume at-least-once delivery.','Dedup table keyed by message id, written in the same transaction as the balance change (transactional inbox), so either both happen or neither.','Or reshape the data model: insert a ledger entry with a unique transfer id and derive balance from entries.','Handle poison messages and ordering separately; keep a retention window for dedup ids at least as long as the broker\'s redelivery window.','Test with fault injection: kill the consumer between steps and redeliver.'],pitfalls:['Dedup in memory only, lost on restart.','Dedup window shorter than redelivery window.']},
 {q:'Your team says "we have exactly-once processing". How do you test that claim and what do you ask about scope?',lvl:'Staff+',cover:['Ask where the boundary is: within one broker and its transactions, or end to end including external side effects and the database.','Typically the truth is at-least-once delivery plus idempotent effects; look for dedup keys, atomic commit of offsets and state, and idempotent external calls.','Failure-injection tests: crash after processing and before ack, crash after ack and before commit, duplicate delivery, reordering, partial network partitions, replay from an older offset.','Verify by invariants: totals reconcile, no duplicate business keys, counts match source.','Document the guarantees and the retention windows they depend on.'],pitfalls:['Accepting a vendor claim without defining the boundary.','Testing only the happy path.']}
]);

enrich('Rate limiting',[
 {h:'The algorithms side by side',ul:['Fixed window counter: one counter per key per window. Tiny state, but allows up to 2x the limit across a boundary.','Sliding window log: a timestamp per request. Exact, memory heavy at high limits.','Sliding window counter: current plus a weighted share of the previous window. Small state, good accuracy, slight approximation.','Token bucket: tokens refill at rate r up to capacity b. Allows bursts of size b, long-run rate r. Two numbers of state per key.','Leaky bucket: a queue drained at a fixed rate. Smooths output, adds queueing delay, drops when full.']},
 {h:'Where to enforce and what to key on',ul:['Edge or gateway: protects everything behind it, cheapest place for coarse limits.','In services: needed for per-resource or expensive-operation limits the gateway cannot see.','Key by API key or user for fairness and billing; by IP only for anonymous traffic and as an extra layer; by endpoint for expensive operations.','Several limits at once are normal: per second burst limit, per minute limit, per day quota.']},
 {h:'Distributed enforcement',ul:['Central store (Redis) with atomic operations or Lua scripts so check-and-increment is one step; shard by key.','Local counters with periodic sync trade accuracy for latency and survive store outages.','Race conditions: a read-then-write count lets concurrent requests overshoot; use atomic increment.','Cost: one network call per request; use pipelining, local pre-checks, or approximate limits at very high scale.','Failure policy: fail open for most APIs, fail closed for security-sensitive endpoints such as login.']},
 {h:'Client experience',ul:['Return 429 with Retry-After and headers such as limit, remaining and reset so clients can self-pace.','Document limits and give burst allowances for legitimate spikes.','Tell clients to back off exponentially with jitter, and to retry only idempotent requests.','Distinguish rate limiting (too fast), quotas (too much per period) and load shedding (the service is overloaded for everyone).']},
 {h:'Common mistakes',ul:['Limiting only by IP and blocking whole offices behind a NAT.','Non-atomic counters that let bursts through.','No limit headers, so clients retry blindly and make it worse.','A limiter that is a single point of failure for the whole API.']}
],[
 {q:'Design a distributed rate limiter for an API gateway fleet handling 500,000 requests per second with per-customer limits. Choose the algorithm and explain the trade-offs.',cover:['Requirements: per-customer limits (several windows), low added latency, accuracy tolerance, behaviour on failure.','Algorithm: token bucket (or sliding window counter) for burst plus average control; two numbers of state per key.','Storage: sharded Redis cluster with atomic Lua scripts for check-and-update; key by customer and limit name; TTLs for idle keys.','Scaling: local token caching or batch borrowing per gateway node to cut network calls, accepting small overshoot; hot customers pinned or split into sub-buckets.','Failure: fail open with a conservative local limit for non-critical routes, fail closed for abuse-prone ones; metrics on denials, store latency and drift.'],pitfalls:['One Redis call per request with no plan for hot keys.','Ignoring what happens when the store is down.']},
 {q:'Compare fixed window, sliding window and token bucket for a public API. Show a case where fixed window fails badly.',cover:['Fixed window: cheap, but a client can spend a full quota at the end of one window and again at the start of the next, doubling the effective rate over a short span.','Sliding log: exact but stores a timestamp per request.','Sliding counter: weights the previous window; small memory and close to exact.','Token bucket: bursts up to capacity, average rate fixed; fits bursty well-behaved clients.','Choose by burst policy, memory budget and accuracy needs; combine layers such as a per-second bucket plus a daily quota.'],pitfalls:['Naming algorithms without a failure example.','Ignoring memory cost at scale.']},
 {q:'A flash sale is overloading your checkout service even though every customer is under their individual rate limit. What do you do?',lvl:'Staff+',cover:['Per-client limits do not protect aggregate capacity; you need global protection: load shedding based on service health (queue depth, latency, concurrency limits).','Prioritise: protect checkout and payment over browsing, keep critical user journeys alive, reject or defer low-priority traffic first.','Admission control: virtual waiting room or queue with a token for entry, adaptive concurrency limits per instance.','Backpressure and timeouts end to end, autoscaling with warm capacity, cached or static fallbacks for read-heavy parts.','Plan: load tests that model the sale, kill switches, clear 429 or 503 responses with Retry-After, and post-sale review.'],pitfalls:['Raising per-client limits and hoping.','Letting all endpoints compete equally for the same capacity.']}
]);

enrich('API Design',[
 {h:'Resources, URLs and methods',ul:['Nouns in plural: /orders, /orders/42, /orders/42/items; verbs come from the HTTP method.','Actions that do not fit CRUD can be sub-resources or explicit action endpoints (POST /orders/42/cancel); consistency matters more than purity.','Use query parameters for filtering, sorting and paging; keep URLs stable and lowercase.','Return the created resource with 201 and a Location header; use PUT for full replacement and PATCH for partial change, and document which fields are mutable.']},
 {h:'Pagination, filtering and sorting',ul:['Offset: simple, supports jumping to a page, but gets slow with big offsets and unstable under inserts.','Cursor (keyset): stable, scales to huge tables, requires a deterministic sort order including a unique tiebreaker; return an opaque next token.','Cap page size, default it, and return how to fetch the next page in the body or Link headers.','Allow filters on indexed fields only, or you invite expensive queries.']},
 {h:'Errors, validation and consistency',ul:['One error envelope: code, message, details per field, request id.','Validate input at the edge and return all field errors at once.','Use consistent naming, date formats (ISO 8601 in UTC), money as integer minor units with a currency, ids as strings.','Be liberal in what you accept only where it is safe; be strict and explicit in what you return.']},
 {h:'Versioning and evolution',ul:['Additive changes (new optional fields, new endpoints, new enum values with care) are non-breaking if clients ignore the unknown.','Breaking changes: new version in the URL or a header, a deprecation date, Sunset and Deprecation headers, usage tracking per version, and direct outreach to heavy users.','Prefer evolving one version for a long time over many parallel versions, which multiply the maintenance burden.','Contract tests and an OpenAPI diff in CI to catch accidental breaks.']},
