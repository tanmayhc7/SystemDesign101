 {h:'Reliability and security by default',ul:['Idempotency keys for unsafe operations, timeouts and rate limits documented and enforced.','Authenticate with OAuth 2 or scoped API keys; authorise per object, not just per endpoint (avoid IDOR bugs).','Limit payload sizes, validate content types, avoid leaking internal ids or stack traces.','CORS: browsers block a web page from reading responses from another origin unless the API opts in with Access-Control-Allow-Origin headers. Allow-list the specific origins you trust, answer the preflight OPTIONS request correctly, and never combine a wildcard origin with credentials. CORS protects users in browsers, it is not authentication, and server-to-server callers ignore it.','Support ETags and conditional requests for safe concurrent updates (If-Match) and cheaper reads.']}
],[
 {q:'Design the API for an order service used by web, mobile and partner clients. Cover resources, pagination, errors, retries and versioning.',cover:['Resources: /orders, /orders/{id}, /orders/{id}/items, actions such as POST /orders/{id}/cancel; identifiers as opaque strings.','Lists: cursor pagination with a capped page size, filters on indexed fields, sort with a tiebreaker.','Unsafe calls: Idempotency-Key on POST /orders and payments; PUT or PATCH with If-Match ETags for concurrent updates.','Errors: consistent envelope with code, message, field details and request id; right status codes; 429 with Retry-After.','Evolution: additive changes only within a version, /v1 in the URL, deprecation headers and a published policy; OpenAPI as the source of truth with contract tests.','Security and ops: OAuth scopes, object-level authorisation, per-client rate limits, tracing ids returned to callers.'],pitfalls:['No pagination on lists.','Using 200 for errors or exposing internal database ids and shapes.']},
 {q:'Offset or cursor pagination for a feed with 200 million rows and constant writes? Explain the failure of offset and what cursor needs.',cover:['Offset: the database scans and discards N rows, so deep pages are slow; inserts and deletes shift windows so items repeat or vanish.','Cursor: encode the last seen sort key (for example created_at plus id) and query "after" it with an index, so cost is constant per page and the window is stable.','Requirements: a total order with a unique tiebreaker, an index matching the sort, opaque tokens so you can change the format.','Trade-offs: no jump to page N and no cheap total count; offer approximate counts or search instead.','Consider bidirectional cursors and handling deleted anchors.'],pitfalls:['Cursors on a non-unique sort key, causing skipped rows.','Exposing the raw key so clients depend on its format.']},
 {q:'You must remove a field and change the meaning of another in an API used by 3,000 integrations. Plan the migration.',lvl:'Staff+',cover:['Find out who uses it: per-client and per-field usage telemetry, contract inventory, and which clients are first party versus third party.','Prefer an additive path: add the new field alongside the old one, run both, mark the old one deprecated in docs, the spec and response headers.','New version only if the meaning change cannot be expressed additively; run old and new side by side with a shared implementation behind a translation layer.','Communicate: dated deprecation notice, changelog, direct contact for top clients, sandbox for testing, SDK updates.','Enforce gradually: brownouts (temporary failures of the old path at announced times), then removal; keep a rollback.','Prevent repeats: OpenAPI diff checks, API review for every public change.'],pitfalls:['Removing a field because "nobody should use it".','Announcing and removing on the same schedule for every client.']}
]);

PHASES[2].iq=[
 {q:'A mobile app calls your REST API and users on poor networks see slow screens and occasional duplicate orders. Walk through the changes you would make, in order.',cover:['Measure: calls per screen, payload size, p95 by network type, duplicate order rate and where retries come from.','Duplicates: Idempotency-Key on order creation, client retry only with backoff and jitter, server stores key and replays the result.','Slowness: aggregate in a gateway or BFF to cut round trips, sparse fields or leaner payloads, compression, HTTP/2 or HTTP/3, cache what is cacheable.','Protection: rate limits per user, timeouts, 429 with Retry-After.','Verify: dashboards for duplicates and latency, load test with packet loss, staged rollout.'],pitfalls:['Jumping to GraphQL or a rewrite before measuring.','Adding retries without idempotency.']},
 {q:'Design an API platform for external developers: gateway, authentication, rate limiting, versioning, webhooks and developer experience.',lvl:'Staff+',cover:['Edge: gateway with TLS, OAuth or API keys, scopes, per-customer quotas and rate limits, WAF and abuse detection.','Contract: OpenAPI as source of truth, versioning and deprecation policy, idempotency keys, cursor pagination, consistent errors.','Eventing: signed webhooks with retries, per-customer isolation, delivery logs and replay; polling endpoint for reconciliation.','Operations: SLOs and status page, request ids, per-customer analytics, audit logs, incident tooling.','Developer experience: sandbox, SDKs, docs generated from the spec, changelog and migration guides.','Organisation: API review board or checklist so public changes stay compatible.'],pitfalls:['Treating the public API as an afterthought on top of internal services.','No isolation between customers.']},
 {q:'Real-time features: when do you use polling, long polling, SSE, WebSockets or webhooks? Give the decision criteria and the operational cost of each.',cover:['Direction and frequency: server-to-client only vs two-way; updates per second vs per minute.','Audience: browsers and mobile (SSE, WebSockets, push notifications) vs server-to-server (webhooks, streaming APIs).','Delay tolerance: seconds (polling or long polling) vs sub-second (WebSockets, SSE).','Cost: polling costs requests; sockets cost open connections, state, reconnect logic and pub/sub fan-out; webhooks cost retries, signing and idempotent receivers.','Recommend the simplest that meets the latency need, and design the message format to be transport independent.'],pitfalls:['WebSockets for everything.','Ignoring reconnect, resume and ordering problems.']},
 {q:'Your API is being abused by one client and your database is struggling. Describe immediate mitigation and the longer-term design.',cover:['Immediate: identify the client by key or token, apply a temporary lower limit or block, return 429 with Retry-After, protect the database with connection limits and timeouts, shed lowest priority work.','Diagnose: which endpoint and query pattern, whether it is abuse or a buggy retry loop, whether caching or an index would remove the load.','Long term: per-client quotas and burst limits at the gateway, per-endpoint cost-aware limits, caching, pagination caps, adaptive concurrency limits and load shedding for aggregate protection.','Communication: contact the client, publish limits, provide headers so they can self-limit.','Prevention: dashboards and alerts for per-client usage, abuse detection, game-day tests.'],pitfalls:['Blocking by IP only and hurting shared networks.','Only limiting per client without any global protection.']}
];

/* ===== Phase 3 lessons: Database Fundamentals ===== */
lesson(3,{key:'Databases Types',short:'Database Types',tag:'Databases 1 of 9',title:'Database types: pick the shape of your data first',
  lead:'There is no best database, only a best fit for how your data is shaped and how it is read. Relational databases store tables with strict schemas. Key-value stores map one key to one value. Document stores keep whole JSON-like records. Wide-column stores spread huge tables across many machines. Graph databases store relationships. Time-series and search engines are tuned for one kind of query.',
  more:['Start from the access pattern, not the product name. Ask: what are the main reads and writes, how big will the data get, how consistent must it be, and do I need joins or ad hoc queries? A shopping cart read by user id is a key lookup. A bank ledger needs transactions across rows. A social network asks "friends of friends", which is a graph question. Sensor readings arrive in time order and are queried by time range.',
    'Relational (PostgreSQL, MySQL) is the safe default: flexible queries, joins, constraints and transactions. Key-value (Redis, DynamoDB) gives very fast lookups by key and easy scaling, but little querying beyond the key. Document (MongoDB) suits records you read and write whole. Wide-column (Cassandra, Bigtable) takes very high write volume spread over many nodes. Graph (Neo4j) makes multi-hop relationship queries cheap. Time-series (TimescaleDB, InfluxDB) compresses and queries data by time. Search (Elasticsearch, OpenSearch) builds inverted indexes for full-text search and filters.',
    'Real systems use several at once (polyglot persistence): a relational database as the source of truth, a cache in front, and a search index fed from it. Each extra store adds a copy of the data to keep in sync and one more thing to operate, so add one only when the access pattern clearly needs it.'],
  demo:'pick',opts:{prompt:'Pick the database family that best fits each workload.',options:[
    {id:'rel',name:'Relational',desc:'Tables, joins, transactions'},
    {id:'kv',name:'Key-value',desc:'Lookup by key, very fast'},
    {id:'doc',name:'Document',desc:'Whole records as JSON'},
    {id:'wide',name:'Wide-column',desc:'Huge write volume, many nodes'},
    {id:'graph',name:'Graph',desc:'Multi-hop relationships'},
    {id:'ts',name:'Time-series',desc:'Metrics by time range'},
    {id:'search',name:'Search engine',desc:'Full-text and facets'}],
   rounds:[
    {s:'A bank ledger where a transfer must debit one account and credit another, or neither.',a:'rel',why:'Multi-row transactions and constraints are what relational databases are built for.'},
    {s:'A session store: given a session token, return the user data in under a millisecond.',a:'kv',why:'One key in, one value out. A key-value store (often in memory) does exactly this and nothing else.'},
    {s:'A product catalog where each product has different attributes (a shirt has sizes, a laptop has ports) and is always read as a whole.',a:'doc',why:'Flexible, self-contained records read whole fit a document store. A relational design needs many nullable columns or extra tables.'},
    {s:'Ingesting 500,000 messages per second from a fleet of devices, queried mostly by device id and recent time.',a:'wide',why:'Wide-column stores are built for very high, evenly spread writes with queries known in advance.'},
    {s:'"Show people you may know": friends of friends who share an employer.',a:'graph',why:'Multi-hop traversals are cheap in a graph database and become expensive chains of self-joins in a relational one.'},
    {s:'Server CPU and memory metrics every 10 seconds, queried as "average over the last 6 hours", with old data downsampled.',a:'ts',why:'Time-ordered appends, range queries, compression and retention policies are what a time-series database optimises.'},
    {s:'A shop needs typo-tolerant text search with filters by brand, price range and rating.',a:'search',why:'An inverted index with relevance scoring and facets is the job of a search engine, usually fed from the main database.'}]},
  takeaway:'Choose from the access pattern: how you read, write, scale and need consistency. Default to relational, add specialised stores only for a clear need, and treat each extra store as a copy you must keep in sync.',
  pre:['Basic SQL (SELECT, JOIN)'],
  quiz:[{q:'Which question should you answer first when choosing a database?',o:['Which product is most popular','What are the main reads and writes, and how consistent must the data be','Which one has the most features'],a:1,why:'The access pattern and consistency needs decide which family fits. Popularity says nothing about your workload.',hint:'Start from how the data is used.'},
        {q:'Your system keeps its source of truth in PostgreSQL and also runs Elasticsearch for text search. What is the main ongoing cost of that choice?',o:['Elasticsearch cannot read data','You must keep the search index in sync with the source of truth, and operate a second system','PostgreSQL stops supporting transactions'],a:1,why:'Every derived store is another copy. It needs a reliable pipeline (change data capture, an outbox) and tolerates some staleness.',hint:'Think about two copies of the same data.'}],
  terms:[['Access pattern','The queries and writes an application actually performs.'],['Polyglot persistence','Using different database types for different jobs in one system.'],['Source of truth','The store whose data wins when copies disagree.'],['Schema','The declared structure of the data: tables, columns, types.']]});

lesson(3,{key:'ACID Transactions',short:'ACID',tag:'Databases 2 of 9',title:'ACID transactions: all or nothing, and safely alone',
  lead:'A transaction groups several reads and writes into one unit. ACID names four guarantees: Atomicity (all of it happens or none of it), Consistency (the data always satisfies its rules), Isolation (concurrent transactions do not see each other\'s half-finished work) and Durability (once committed, it survives a crash).',
  more:['Atomicity is what makes "move $100 from A to B" safe. If the server crashes after the debit but before the credit, the database rolls the debit back on restart. Durability comes from a write-ahead log: the change is written to a sequential log on disk before the commit is acknowledged, so after a crash the database replays the log.',
    'Consistency here means the database enforces your rules (foreign keys, unique constraints, check constraints), so a transaction cannot leave it in an invalid state. Note that this is different from the "consistency" in CAP, which is about replicas agreeing.',
    'Isolation is the subtle one, because perfect isolation is expensive. Databases offer levels. Read committed prevents reading uncommitted data. Repeatable read keeps a stable view within a transaction. Serializable behaves as if transactions ran one at a time. Weaker levels allow anomalies such as the lost update (two sessions read the same value and both write back an increment) and write skew. Fix these with row locks (SELECT ... FOR UPDATE), atomic updates (SET balance = balance + 10), optimistic version columns, or a stronger level.',
    'Transactions inside one database are cheap. Across several databases or services they are not, which is why distributed systems use patterns such as two-phase commit or sagas, covered in later phases.'],
  demo:'acid',takeaway:'ACID lets you treat a group of changes as one safe unit. The write-ahead log gives atomicity and durability; isolation levels trade safety for speed, and the default level often still allows lost updates.',
  pre:['Databases Types'],
  quiz:[{q:'Two requests each read a counter of 100 and each write back 101. What is the problem, and what is a simple fix?',o:['Durability failed; add a log','A lost update from weak isolation; use an atomic UPDATE counter = counter + 1 or lock the row','Atomicity failed; wrap in BEGIN'],a:1,why:'Both sessions read before either wrote. An atomic increment, a row lock, or an optimistic version check makes the second one see the first one\'s result.',hint:'Both read the same old value.'},
        {q:'What lets a database recover a committed transaction after power loss?',o:['The cache','The write-ahead log, flushed to disk before the commit is acknowledged','The query planner'],a:1,why:'The log records changes sequentially on durable storage first. On restart, committed changes are replayed and uncommitted ones are undone.',hint:'Write it down before saying it is done.'}],
  terms:[['Transaction','A group of operations treated as one unit.'],['Write-ahead log (WAL)','An append-only log written before data changes, used for recovery.'],['Isolation level','How much concurrent transactions can see of each other.'],['Lost update','Two writers overwrite each other because both read an old value.']]});

lesson(3,{key:'SQL vs NoSQL',short:'SQL vs NoSQL',tag:'Databases 3 of 9',title:'SQL vs NoSQL: normalize or embed',
  lead:'SQL databases store data in related tables and let you ask new questions with joins. NoSQL is a loose label for stores that give up some of that (often joins, a fixed schema, or full transactions) to gain something else: easier scaling, flexible records, or very fast simple access.',
  more:['The core design choice is normalize or embed. Normalizing splits data into tables so each fact is stored once (orders, items, products, customers) and joins put it back together. Updates are cheap and consistent, and you can answer questions you did not plan for. Embedding stores an order with its items and customer name inside one document. Reading or writing a whole order becomes one operation, but the same product name is now copied into thousands of documents, and reports across orders must scan them all.',
    'Many NoSQL stores scale out by sharding, which makes cross-record joins and transactions hard, so they push you to model data around the queries you know in advance. Relational databases scale up easily and have scaled out (replicas, sharding, distributed SQL such as Spanner and CockroachDB), but need more effort to spread writes.',
    'The line is blurring. PostgreSQL stores and indexes JSON. MongoDB supports multi-document transactions. DynamoDB offers transactions. So avoid the slogan "SQL does not scale" or "NoSQL has no consistency". Compare the specific product on the specific workload: data shape, query variety, consistency needs, write volume and team experience.'],
  demo:'sqlnosql',takeaway:'Normalize when many different questions will be asked of shared data. Embed when data is always read and written together. Choose per workload and product, not by the SQL or NoSQL label.',
  pre:['Databases Types','ACID Transactions'],
  quiz:[{q:'A product is renamed. Which design makes this change cheapest and least error-prone?',o:['Embed the product name in every order document','Store product names once in a products table and reference them by id','Keep the name in a cache only'],a:1,why:'A normalized design stores each fact once, so a rename is one update and every reader sees it.',hint:'How many places hold the name?'},
        {q:'Which statement is the most accurate?',o:['NoSQL databases cannot be consistent','Relational databases can never scale beyond one server','The labels hide wide differences: compare specific products on your actual workload'],a:2,why:'Both families have borrowed features from each other. The right choice depends on data shape, queries, consistency and write volume.',hint:'Be wary of absolute claims.'}],
  terms:[['Normalization','Storing each fact once, in its own table, linked by keys.'],['Denormalization','Copying data to make reads faster, at the cost of updates.'],['Join','Combining rows from two tables by a matching key.'],['Aggregate','A group of related data read and written together, such as an order and its items.']]});

lesson(3,{key:'Database Scaling',short:'DB Scaling',tag:'Databases 4 of 9',title:'Database scaling: find the bottleneck, then pick the tool',
  lead:'A database slows down when it runs out of CPU, memory, disk or connections. Scaling is the order of moves you make: first use the machine better (indexes, queries), then add a cache, then read replicas for read load, then sharding to split write load. Pick the move that matches the bottleneck.',
  more:['Scale up means a bigger machine. It is simple and often the right first step, but it has a ceiling and a price curve that climbs steeply. Scale out means more machines, which is cheaper at the top end but adds complexity.',
    'Reads and writes scale differently. A cache absorbs repeated reads. Read replicas copy data from a primary and serve reads, but every write must still be applied on the primary and replayed on every replica, so replicas do not reduce write load. Writes only scale by splitting the data across primaries, which is sharding.',
    'Work from evidence. Measure queries per second, read to write ratio, slow queries, lock waits, cache hit rate and connection counts. Often the biggest win is fixing one bad query or adding one index. Also plan for the other limits: connection pools (use a pooler such as PgBouncer), storage growth (archive or partition old data), and the cost of backups and schema changes on very large tables.'],
  demo:'dbscale',takeaway:'Identify whether you are read-bound or write-bound. Index and cache for reads, replicas for more read capacity, and shard when writes exceed what one primary can handle.',
  pre:['Databases Types','Scalability'],
  quiz:[{q:'A database is saturated because of heavy write traffic. Which addition helps least?',o:['Sharding the data across several primaries','Adding more read replicas','Batching writes and removing unnecessary indexes'],a:1,why:'Replicas only serve reads. Every write still hits the primary and must be replayed on each replica.',hint:'Where do writes go?'},
        {q:'What should you do before adding hardware or a new database to fix slowness?',o:['Nothing, just scale up','Measure: find the slow queries, missing indexes, and whether load is read or write','Rewrite the application'],a:1,why:'A single missing index or query can cost more than a whole cluster. Measurement tells you which scaling move fits.',hint:'Do not guess.'}],
  terms:[['Scale up','Move to a bigger machine.'],['Scale out','Add more machines.'],['Read replica','A copy that serves reads, fed from a primary.'],['Connection pool','A reused set of database connections shared by many requests.']]});

lesson(3,{key:'Database Indexes',short:'Indexes',tag:'Databases 5 of 9',title:'Database indexes: a sorted map to your rows',
  lead:'Without an index, finding rows means reading the whole table. An index is a separate, sorted structure (usually a B-tree) that lets the database jump straight to matching rows. It is the single biggest lever for read speed, and it is paid for with slower writes and extra storage.',
  more:['A B-tree keeps keys sorted in wide pages (hundreds of keys per page), so a lookup in a billion rows takes about four or five page reads instead of a billion row reads. Because keys are sorted, the same index serves equality (email = x), ranges (created_at between a and b), ordering and prefix matches. A hash index only serves equality.',
    'An index only helps if the query can use it. A leading wildcard (LIKE \'%x\'), a function on the column (lower(email) = ...) unless indexed on that expression, a type mismatch, or a low-selectivity column (a country that half the rows share) can all lead the planner to scan instead. A composite index on (a, b) serves queries on a, or on a and b, but not on b alone: the leftmost prefix rule. A covering index contains every column the query needs, so the table is never touched.',
    'Every index must be updated on every insert, update and delete touching its columns, and it takes space and cache memory. Add indexes for real queries (check with EXPLAIN), drop unused ones, and be careful on write-heavy tables. A clustered index (the table itself stored in key order, as in InnoDB) makes primary key range reads fast but means the primary key choice shapes the whole table.'],
  demo:'indexes',takeaway:'An index trades write speed and space for fast reads. Design them from real queries, check with EXPLAIN, mind column order and selectivity, and remove ones nobody uses.',
  pre:['Databases Types'],
  quiz:[{q:'You have an index on (country, city). Which query can use it efficiently?',o:['WHERE city = \'Paris\'','WHERE country = \'FR\' AND city = \'Paris\'','Neither'],a:1,why:'A composite index serves a leftmost prefix. The query on city alone skips the first column, so the index cannot be walked directly.',hint:'Think of a phone book sorted by last name, then first name.'},
        {q:'A table has 12 indexes and inserts have become slow. What is the likely cause?',o:['Each insert must update all 12 indexes','Indexes only slow down reads','The table has too few rows'],a:0,why:'Every index is a structure that must be maintained on writes. Unused or overlapping indexes are pure cost.',hint:'Who pays for an index?'}],
  terms:[['B-tree','A sorted, wide, shallow tree used by most database indexes.'],['Selectivity','How small a fraction of rows a condition matches.'],['Covering index','An index containing every column a query needs.'],['EXPLAIN','A command that shows how the database will run a query.']]});

lesson(3,{key:'Database Partitioning',short:'Partitioning',tag:'Databases 6 of 9',title:'Partitioning: splitting one big table into pieces',
  lead:'Partitioning splits a large table into smaller parts that the database manages as one logical table. Each partition is smaller to scan, index, back up and drop. Queries that name the partition key can skip the others entirely, which is called partition pruning.',
  more:['Three common schemes. Range partitioning divides by value ranges, such as one partition per month: dropping old data becomes dropping a partition, and time-range queries touch few pieces. Hash partitioning applies a hash to a key and spreads rows evenly, which avoids hot spots but makes range queries touch every partition. List partitioning assigns discrete values (a region, a tenant) to partitions, which suits data that is queried or retained by that value.',
    'Pick the key from the queries and the lifecycle of the data. The best key appears in most WHERE clauses, spreads data and traffic evenly, and matches how you delete or archive. A poor key creates hot partitions (all today\'s writes land in the newest month) or forces every query to scan all partitions.',
    'Partitioning is usually within one database server, to make a big table manageable. When you spread partitions across servers, it is called sharding, which adds network, routing and consistency problems. Partitioning has its own cost: the key becomes part of the primary key and unique constraints, you must create future partitions ahead of time, and cross-partition queries are slower.'],
  demo:'partition',takeaway:'Partition to keep tables manageable and let queries skip data. Choose the key from your common queries and retention rules, and watch for hot partitions and cross-partition scans.',
  pre:['Database Indexes'],
  quiz:[{q:'Logs older than 90 days must be deleted every night from a 5 TB table. Which design makes this cheap?',o:['Range partition by day and drop old partitions','Hash partition by log id','Add an index on every column'],a:0,why:'Dropping a partition is a quick metadata operation, unlike deleting billions of rows one by one.',hint:'How does the data age?'},
        {q:'You hash-partition by user id. Which query now has to look at every partition?',o:['WHERE user_id = 42','WHERE created_at > yesterday','Both are fast'],a:1,why:'Hash partitions scatter rows by user id, so a time-based query has no partition to prune to and must search them all.',hint:'Which column does the hash use?'}],
  terms:[['Partition key','The column that decides which partition a row goes to.'],['Partition pruning','Skipping partitions that cannot contain matching rows.'],['Hot partition','A partition that receives far more traffic than the others.'],['Range / hash / list','The three common ways to assign rows to partitions.']]});

lesson(3,{key:'Database Sharding',short:'Sharding',tag:'Databases 7 of 9',title:'Sharding: spreading data across servers',
  lead:'Sharding splits a dataset across several database servers, each holding a subset (a shard). It is how writes and storage scale beyond one machine. It also takes away easy joins, transactions and queries across the whole dataset, so use it after simpler options run out.',
  more:['A shard key decides where each row lives. Hashing the key modulo N spreads data evenly but is fragile: changing N changes the owner of almost every key, forcing a massive data move. Consistent hashing places shards (with many virtual nodes each) on a ring and assigns a key to the next shard clockwise, so adding a shard moves only about 1/(N+1) of the keys. A directory (lookup table) maps keys or ranges to shards explicitly, which is flexible but adds a service every request depends on.',
    'Choosing the shard key is the most important decision and the hardest to change. It should appear in nearly every query so requests go to one shard, and it should spread data and load evenly. A user id often works for user-centric apps. A celebrity or a huge tenant can still overload one shard (a hot key), and fixes include splitting the key with a suffix, caching, or dedicating a shard.',
    'What you lose: joins across shards, global unique constraints, and multi-shard transactions need extra machinery (scatter-gather queries, sagas, or two-phase commit). Resharding must be planned: use many more logical shards than servers from the start so you can move whole logical shards between machines. Managed options (Vitess, Citus, Spanner, DynamoDB) handle routing and rebalancing for you.'],
  demo:'shard',takeaway:'Shard when writes or storage outgrow one machine. Choose a shard key present in most queries, prefer consistent hashing or many logical shards so resharding moves little data, and plan for hot keys and cross-shard queries.',
  pre:['Database Partitioning','Consistent Hashing'],
  quiz:[{q:'With hash(key) mod 4 you add a fifth shard. Roughly what fraction of keys changes owner?',o:['About 20%','Almost all of them (about 80%)','None'],a:1,why:'The divisor changed, so most keys hash to a different remainder. Consistent hashing moves only about one in five.',hint:'Compare 12 mod 4 with 12 mod 5.'},
        {q:'One user generates 30% of all traffic on a user-id-sharded system. What actually helps?',o:['Adding more shards','Splitting that key (for example id plus a suffix), caching it, or giving it a dedicated shard','Changing the hash function'],a:1,why:'Any hash maps one key to one shard. You must spread that key\'s own load, cache it, or isolate it.',hint:'Hashing spreads keys, not one key\'s traffic.'}],
  terms:[['Shard key','The field that decides which shard stores a row.'],['Hot key','A single key receiving a large share of traffic.'],['Virtual node','One of many ring positions per shard, for even balance.'],['Scatter-gather','Query every shard and merge the results.']]});

lesson(3,{key:'Database Replication',short:'Replication',tag:'Databases 8 of 9',title:'Replication: copies for speed and survival',
  lead:'Replication keeps copies of the same data on several servers. It gives you more read capacity, survival when a server dies, and copies close to users. The hard part is deciding when a write counts as done while the copies are still catching up.',
  more:['The common setup is leader-follower: all writes go to the leader, which streams its log of changes to followers. Followers serve reads. If the leader fails, a follower is promoted (failover). Multi-leader (several write points, often one per region) and leaderless (any node accepts writes, with quorum reads and writes, as in Dynamo-style systems) trade simplicity for write availability and need conflict resolution.',
    'Synchronous replication acknowledges a write only after the followers have it: no acknowledged write is lost on failover, but every write waits for the slowest follower and a dead follower can block writes. Asynchronous replication acknowledges immediately: it is fast and tolerates followers being down, but a leader crash can lose the most recent acknowledged writes, and followers lag. Semi-synchronous keeps one follower in sync and the rest asynchronous, a common middle path.',
    'Lag causes visible anomalies when reading from followers: you update your profile and the page shows the old one (read-your-writes violation), or two reads go backwards in time (monotonic reads). Mitigate by reading your own writes from the leader for a short time, routing a user to one replica, or tracking the log position a user has seen. Failover itself is risky: choose the most up-to-date follower, avoid split brain (two leaders) with fencing and consensus, and test it before you need it.'],
  demo:'repl',takeaway:'Replication buys read capacity and fault tolerance. Synchronous is safe but slower, asynchronous is fast but can lose recent writes and serves stale reads. Plan for lag and for safe failover.',
  pre:['Database Scaling','CAP Theorem'],
  quiz:[{q:'A leader using asynchronous replication crashes. What is the main risk?',o:['Followers refuse reads','Writes that were acknowledged but not yet replicated can be lost','The followers become read-only forever'],a:1,why:'The leader acknowledged before followers had the data, so promoting a follower can discard the latest writes.',hint:'When was the client told "done"?'},
        {q:'A user edits their profile and immediately sees the old version. A likely cause and fix?',o:['Replication lag; read recent own writes from the leader or track the log position','A broken index; rebuild it','Too many shards'],a:0,why:'The read hit a follower that had not applied the write yet. Read-your-writes routing hides the lag for that user.',hint:'Which server answered the read?'}],
  terms:[['Leader / follower','The node that accepts writes, and the copies that follow it.'],['Replication lag','How far behind a follower is.'],['Failover','Promoting a follower when the leader fails.'],['Split brain','Two nodes both believing they are the leader.']]});

lesson(3,{key:'Bloom Filters',short:'Bloom Filters',tag:'Databases 9 of 9',title:'Bloom filters: a tiny "definitely not here" check',
  lead:'A Bloom filter answers "have I seen this item?" using very little memory. It can say "definitely not" or "probably yes". It never gives a false negative, but it occasionally gives a false positive. That is enough to avoid expensive lookups for items that are not there.',
  more:['The structure is a bit array of m bits, all zero, and k hash functions. To add an item, hash it k ways and set those k bits. To check, hash it the same way: if any of the k bits is 0, the item was never added. If all are 1, it was probably added, but those bits might have been set by other items.',
    'The false positive rate is about (1 - e^(-kn/m))^k for n items. A rate near 1% needs roughly 10 bits per item with about 7 hash functions, far less than storing the items. The more items you add to a fixed-size filter, the more bits fill up and the higher the error. Standard Bloom filters cannot remove items (counting Bloom filters and cuckoo filters can).',
    'Databases use them to skip disk reads: LSM-tree stores such as Cassandra, RocksDB and HBase keep a filter per file, so a read for a missing key usually skips the file with no disk access. Other uses: a cache or CDN checking "has anyone requested this object before" so one-hit wonders are not cached, a browser or crawler checking known-bad or already-seen URLs, and avoiding a database query for usernames that cannot exist. Size the filter for the largest expected n, because it cannot grow gracefully.'],
  demo:'bloom',takeaway:'A Bloom filter trades a small false positive rate for tiny memory and fast checks. "No" is certain, "yes" is only probable. Use it in front of expensive lookups, sized for the expected number of items.',
  pre:['Database Indexes','Hashing'],
  quiz:[{q:'A Bloom filter says an item is NOT present. How sure can you be?',o:['Not sure, it might be a false negative','Completely sure: at least one of its bits is zero, so it was never added','About 99% sure'],a:1,why:'Adding an item always sets all its k bits, so a zero bit proves the item was never added. Bloom filters have no false negatives.',hint:'Which direction can it be wrong in?'},
        {q:'You keep adding items to a fixed-size Bloom filter. What happens?',o:['Nothing changes','More bits become 1, so the false positive rate rises','It starts giving false negatives'],a:1,why:'As the array fills up, an unadded item is more likely to have all its bits already set by others.',hint:'Think of the bit array as a nearly full parking lot.'}],
  terms:[['False positive','Saying an item is present when it was never added.'],['False negative','Saying an item is absent when it was added. Bloom filters never do this.'],['Hash function','A function mapping an item to a number, spread evenly.'],['LSM tree','A write-optimised storage structure that keeps data in sorted files.']]});

/* ===== Phase 3: in-depth sections and senior interview questions ===== */

enrich('Databases Types',[
 {h:'The families and what they are good at',ul:['Relational: tables, SQL, joins, constraints, transactions. Best default for business data.','Key-value: get and put by key; very fast and easy to partition. Caches, sessions, carts, feature flags.','Document: JSON-like records with flexible schema, read and written whole. Catalogs, user profiles, content.','Wide-column: rows grouped by partition key, sorted within it, huge write throughput. Messaging, telemetry, activity feeds.','Graph: nodes and edges with traversal queries. Recommendations, fraud rings, access graphs.','Time-series: append-heavy, time-range queries, compression and retention. Metrics, IoT, finance ticks.','Search: inverted indexes, relevance, facets. Product search, log search.']},
 {h:'Start from the access pattern',p:['List the five most important queries and writes, with their rates, before comparing products.'],ul:['Lookup by one key, range scan, join of several entities, full-text, or multi-hop traversal each point to a different family.','Read to write ratio, data size in a year, and latency target narrow the choice further.','Ad hoc queries (analytics, support tools) favor relational or a warehouse; fixed queries known in advance allow stores that only do those well.']},
 {h:'Consistency and scale expectations',ul:['Single-node relational: strong consistency, vertical scale, easy replicas.','Dynamo-style and wide-column stores: tunable consistency, built to spread over many nodes, often without joins or multi-row transactions.','Distributed SQL (Spanner, CockroachDB, YugabyteDB): relational model and transactions across nodes, at a latency and cost premium.','Ask what happens if two users write the same item at once, and what a stale read costs the business.']},
 {h:'Polyglot persistence done carefully',ul:['One store is the source of truth; others are derived and can be rebuilt.','Feed derived stores with change data capture or an outbox, not dual writes from the application.','Expect derived data to lag, and design screens and APIs to tolerate that.','Count the operational cost: backups, upgrades, monitoring, on-call knowledge for every extra system.']},
 {h:'Common mistakes',ul:['Choosing a trendy database before writing down the queries.','Using a document store and then needing joins everywhere.','Using a relational database as a queue or as a cache for sub-millisecond lookups.','Running five different databases for a product with ten thousand users.']}
],[
 {q:'You are designing a ride-sharing platform. Which data stores would you use for trips, driver locations, payments, search and analytics, and why?',cover:['Payments and trips: relational with transactions as source of truth.','Driver locations: high write rate, short-lived, read by region: in-memory store with geospatial indexes, with periodic snapshots.','Search and ratings: derived index or document store fed from the source of truth.','Analytics: events to a log, then a warehouse or columnar store, separate from the serving path.','Consistency per store, how derived data is synchronised, and what happens during partial failure.'],pitfalls:['Naming a product for each box without tying it to an access pattern, rate or consistency need.']},
 {q:'A team wants to move from PostgreSQL to a NoSQL store because "it will scale better". How do you evaluate that request?',cover:['Ask for numbers: current and projected reads, writes, data size, and where the bottleneck is today.','Check cheaper options first: indexes, query fixes, caching, replicas, partitioning, a bigger machine.','Model the real queries on the target store: joins, transactions, secondary indexes, ad hoc reporting you would lose.','Migration cost and risk: dual running, backfill, rollback, team skills.','Decide with a measured prototype on production-like data.'],pitfalls:['Accepting or rejecting the move based on slogans about SQL and NoSQL.']},
 {q:'Explain how you would keep a search index consistent with a primary database, and what guarantees users should see.',lvl:'Staff+',cover:['No dual writes from the application: they diverge on partial failure.','Transactional outbox or change data capture from the database log to a queue, then an idempotent indexer.','Handle ordering (versions on documents), deletes, retries and poison messages, and full rebuild from the source of truth.','Measure and alert on index lag; define the product behaviour for the delay window (read-your-writes for the author from the primary).','Reindexing strategy: build a new index alongside and swap an alias.'],pitfalls:['Claiming strong consistency between the database and the search index.']}
]);

enrich('ACID Transactions',[
 {h:'Atomicity and durability through the log',p:['Databases write changes to a write-ahead log (WAL) before changing data pages. Commit means the log record reached durable storage. Recovery replays committed records and undoes unfinished ones.'],ul:['Group commit batches many transactions into one disk flush to raise throughput.','fsync settings are a durability dial: turning them off is fast and loses recent commits on a crash.','Replicas receive the same log, which is how replication works in many databases.']},
 {h:'Isolation levels and the anomalies they allow',ul:['Read uncommitted: may read data that is later rolled back (dirty read). Rarely used.','Read committed: only committed data, but a repeated read can change (non-repeatable read). Default in PostgreSQL and Oracle.','Repeatable read / snapshot: a stable view per transaction; can still allow write skew. Default in MySQL InnoDB.','Serializable: behaves as if transactions ran one at a time; the safest, with retries on conflicts.','Lost update and write skew (two doctors both go off call because each saw the other on call) are the anomalies that surprise teams.']},
 {h:'Concurrency control: locks versus versions',ul:['Pessimistic: lock rows you read for update, others wait. Simple and safe, can deadlock and reduce throughput.','MVCC: readers see a snapshot and do not block writers; old row versions are kept and cleaned up later (vacuum).','Optimistic: read a version number, write only if unchanged, retry on conflict. Good when conflicts are rare.','Atomic single statements (UPDATE ... SET x = x + 1) are the simplest fix for counters.']},
 {h:'Deadlocks, long transactions and retries',ul:['Deadlock: two transactions wait on each other; the database kills one. Lock rows in a consistent order to reduce them.','Keep transactions short: no network calls or user waits inside one. Long ones hold locks and bloat version storage.','Design for retries: serialization failures and deadlocks are normal, and the application must safely retry the whole transaction.','Idempotency matters again: a retried transaction should not duplicate external side effects.']},
 {h:'Beyond one database',ul:['Distributed transactions: two-phase commit is atomic but blocks on coordinator failure and is slow.','Sagas: a sequence of local transactions with compensating actions, giving eventual rather than isolated consistency.','Outbox pattern: write the data and the event in one local transaction, publish the event afterwards.','ACID consistency (rules hold) is not CAP consistency (replicas agree).']}
],[
 {q:'Two customers buy the last item in stock at the same moment. Show three ways to prevent overselling and the trade-offs of each.',cover:['Atomic conditional update: UPDATE stock SET qty = qty - 1 WHERE id = ? AND qty > 0, check rows affected.','Row lock with SELECT ... FOR UPDATE inside a transaction: simple, serialises on hot rows.','Optimistic version column with retry; or a constraint (CHECK qty >= 0) as a safety net.','Hot item: contention on one row, consider reservation with expiry, sharded counters or a queue per item.','Reservation versus final purchase: hold stock during checkout and release on timeout.'],pitfalls:['Reading the quantity in the application and writing it back (a classic lost update).']},
 {q:'What does the default isolation level of your database actually protect against, and how would you find out whether your code is exposed?',cover:['Name the level and its allowed anomalies (read committed: non-repeatable reads, lost updates, write skew).','Review read-then-write patterns, check-then-act logic and invariants spanning several rows.','Tests with concurrent sessions, or tools that induce interleavings; production signals such as unexplained negative balances.','Fixes ranked by cost: atomic statement, constraint, lock, higher level with retry.'],pitfalls:['Assuming that wrapping code in a transaction makes it safe from concurrency problems.']},
 {q:'An order flow spans three services, each with its own database. How do you keep it correct without a distributed transaction?',lvl:'Staff+',cover:['Saga: local transactions per service with compensating actions (refund, release stock), orchestrated or choreographed.','Outbox per service so state change and event publish are atomic.','Idempotent consumers and message deduplication; at-least-once delivery is the norm.','Semantic locks or pending states so users never see half-done orders; timeouts and a reconciliation job.','Visibility and operations: saga state, dead letter queues, manual repair tooling.'],pitfalls:['Ignoring compensation failures and the interim states users can observe.']}
]);

enrich('SQL vs NoSQL',[
 {h:'The real trade-off: schema, joins, scale',ul:['Fixed schema (SQL) catches mistakes at write time and documents the data; flexible schema (document) speeds early change but moves validation into code.','Joins let you ask new questions later; without them you must model for known queries.','Single-node SQL is very capable; scale-out stores are built around partitioning from day one.','Operational maturity, tooling and hiring pool are real factors.']},
 {h:'Modelling: normalized tables versus aggregates',p:['Normalized design stores each fact once. Aggregate design stores data that changes together as one unit.'],ul:['Embed when the child has no life apart from the parent and is read with it (order lines in an order).','Reference when data is shared, large, or changes independently (products, customers).','A document that grows without bound (comments appended forever) needs a separate collection.','Denormalized copies need a plan for updates: accept staleness, update in a background job, or rebuild.']},
 {h:'Query power versus predictability',ul:['SQL planners choose join order and indexes for you, so new reports usually work.','Key-value and wide-column stores give predictable latency for the access paths you designed, and poor or no support for others.','Secondary indexes in distributed stores are separate and sometimes eventually consistent.','Analytics belongs in a warehouse or columnar engine whichever store serves the app.']},
 {h:'Consistency and transactions in both worlds',ul:['PostgreSQL and MySQL: full ACID, replication, and horizontal options (Citus, Vitess).','MongoDB: multi-document transactions exist but are costlier than single-document writes.','DynamoDB and Cassandra: single-item atomicity, tunable consistency, limited or lightweight transactions.','NewSQL (Spanner, CockroachDB): SQL and serializable transactions across nodes.']},
 {h:'How to decide',ul:['Write the top queries, the data growth rate, the consistency rules and the team skills first.','Default to relational unless a specific requirement points elsewhere.','Prototype the riskiest query on realistic data volume.','Revisit when requirements change, and keep the data access behind a clear boundary so a move is possible.']}
],[
 {q:'Model a social feed: users, posts, follows, likes. Which parts would you normalize, which would you denormalize, and where would each live?',cover:['Source of truth normalized: users, posts, follow edges, likes in a relational or key-value store.','Feed read path is denormalized: precomputed per-user timelines (fan-out on write) for normal users, fan-out on read for celebrities.','Counters (likes) kept as approximate or sharded counters, reconciled from events.','Update strategy for copied data (username changes) and staleness tolerance.','Storage choice for each piece and why.'],pitfalls:['Putting everything in one store or denormalizing everything without an update plan.']},
 {q:'A document database is slow for reporting queries across all orders. What are your options?',cover:['Check indexes and aggregation pipeline design first.','Move reporting off the serving path: change stream to a warehouse or columnar store.','Precompute summaries (materialised views, rollup collections) updated incrementally.','Consider whether the data model forces cross-document scans and whether the operational store should be relational.'],pitfalls:['Running heavy analytical scans on the primary serving the application.']},
 {q:'How would you migrate a large live relational table to a different data model or store with no downtime?',lvl:'Staff+',cover:['Expand and contract: add the new store, dual write via outbox or CDC, backfill history in batches, verify with comparison jobs.','Shadow reads to compare results, then switch reads gradually behind a flag.','Handle ordering, deletes, and in-flight writes during backfill.','Keep rollback possible until confidence is high; remove old paths last.','Capacity planning for backfill load and monitoring of divergence.'],pitfalls:['A big-bang cutover with no way back.']}
]);

enrich('Database Scaling',[
 {h:'Find the bottleneck first',ul:['Measure QPS, read to write ratio, p95 latency, CPU, IO wait, buffer cache hit rate, lock waits and connection counts.','Use slow query logs and EXPLAIN to find the few queries causing most load.','Separate reads from writes; scaling them uses different tools.','Load test with production-like data volume: small datasets hide index and memory problems.']},
 {h:'Vertical scaling and query tuning',ul:['Add RAM so the working set fits in memory: often the cheapest large win.','Fix N+1 queries, missing indexes and unbounded result sets.','Use connection pooling; thousands of idle connections waste memory.','Know the ceiling: the largest instance, failover time, and backup and restore time grow with size.']},
 {h:'Caching in front of the database',ul:['Cache-aside: read cache, on miss read database and fill; invalidate or expire on write.','A 90% hit rate removes 90% of those reads, but protects nothing for writes.','Handle stampedes with request coalescing and jittered expiry; handle staleness with TTLs matched to business tolerance.','Cache only what is hot and expensive to compute.']},
 {h:'Read replicas and the write path',ul:['Replicas add read capacity and a failover target; they lag behind the primary.','Route read-your-writes traffic to the primary, or wait for the replica to reach a log position.','Every write is still applied once on the primary and again on each replica.','Write-heavy workloads need batching, fewer indexes, queueing to smooth spikes, or sharding.']},
 {h:'Sharding and other structural moves',ul:['Partition by time or tenant to shrink hot tables and make archiving cheap.','Split by feature (move one service\'s tables to its own database) before sharding rows.','Shard rows when one primary cannot take the writes or hold the data.','Move analytics to a separate system so reports cannot hurt checkout.']}
],[
 {q:'Your primary database is at 90% CPU during peak. Walk through what you do in the first hour and the first quarter.',cover:['First hour: identify top queries and any recent change; kill or limit runaway queries; add a missing index; scale up the instance if safe; shed or delay non-critical work.','Short term: cache hot reads, add replicas for read traffic, tune connection pooling.','Quarter: remove structural limits: partitioning, moving analytics out, splitting by domain, sharding plan if writes are the limit.','Capacity model with headroom and alerts; load tests before peak events.'],pitfalls:['Jumping straight to sharding without checking queries and indexes.']},
 {q:'Explain why adding read replicas does not help a write-bound system and what does.',cover:['Writes go to the single leader and are replayed on every replica, so total write work grows with replica count.','Replicas only absorb reads and improve availability.','Options: reduce write cost (batching, fewer indexes, async processing), partition hot tables, shard to multiple primaries, switch to a store designed for distributed writes.','Measure per-shard write rate to size the shard count with headroom.'],pitfalls:['Assuming replicas scale everything.']},
 {q:'Design the scaling path for a database that must grow 100x over three years while the team stays small.',lvl:'Staff+',cover:['Stage plan tied to measured limits, not dates: tune, cache, replicas, partition, domain split, then shard.','Choose a managed or sharding-capable system early if the growth is certain; design keys with future sharding in mind (tenant or user id in every table).','Avoid features that block sharding: cross-entity joins on hot paths, global sequences, multi-entity transactions.','Operational readiness: online schema changes, backup and restore time, failover drills.','Cost model and the points at which you will re-decide.'],pitfalls:['Building a sharded system on day one with no evidence of need.']}
]);

enrich('Database Indexes',[
 {h:'How a B-tree works',ul:['Keys are sorted in pages; internal pages point to child pages; leaf pages hold the keys and row pointers or the rows.','Fan-out of a few hundred means a billion rows need about four or five levels, and the top levels stay in memory.','Inserts that overflow a page split it; random keys (like random UUIDs) cause more splits and cache misses than sequential ones.','Range queries walk the leaf pages in order.']},
 {h:'Choosing what to index',ul:['Columns in WHERE, JOIN and ORDER BY of frequent, slow queries.','High-selectivity columns first; very low-selectivity columns (booleans) rarely help alone.','Composite indexes: equality columns first, then range or sort columns; leftmost prefix rule.','Covering (INCLUDE) indexes avoid visiting the table; partial indexes cover only rows you query (WHERE active).']},
 {h:'Why the database ignores your index',ul:['Function or cast on the column (lower(email), date(created_at)) without an expression index.','Leading wildcard in LIKE, or implicit type conversion.','The planner estimates a scan is cheaper because too many rows match.','Stale statistics: run ANALYZE; check with EXPLAIN (ANALYZE) rather than guessing.']},
 {h:'The cost of indexes',ul:['Each index slows inserts, updates and deletes that touch its columns.','Indexes use disk and compete for memory with data.','Building an index on a large live table needs online or concurrent methods to avoid blocking writes.','Find unused and duplicate indexes from database statistics and drop them.']},
 {h:'Other index types',ul:['Hash: equality only.','LSM trees: write-optimised (Cassandra, RocksDB) with background compaction.','Inverted: text search. GIN for arrays and JSON.','Geospatial (R-tree, geohash) and bitmap indexes for low-cardinality analytics columns.']}
],[
 {q:'A query WHERE status = \'active\' AND created_at > ? ORDER BY created_at LIMIT 50 is slow on a 500M row table. Design the index and explain the reasoning.',cover:['Composite index (status, created_at): equality column first, then the range and sort column, so rows come out already ordered and the scan stops after 50.','Verify with EXPLAIN: index scan, no sort step, small rows examined.','Consider a partial index if most rows are inactive.','Pagination by keyset (created_at, id) rather than OFFSET.','Write cost and index size trade-off.'],pitfalls:['Putting the range column first, which forces a sort or a wide scan.']},
 {q:'Writes to a table became slow after the team added several indexes. How do you decide what to drop?',cover:['Check usage statistics (index scans over time) and the query log; unused ones go first.','Find duplicates and prefixes covered by a longer composite index.','Weigh each remaining index against the query it serves and that query\'s importance.','Drop safely: observe in staging, remove one at a time, keep the definition to recreate.','Consider moving rare reports to a replica or warehouse.'],pitfalls:['Dropping indexes without checking unique constraints or rare but critical queries.']},
 {q:'Why are random UUID primary keys a performance concern in a clustered index, and what are the alternatives?',lvl:'Staff+',cover:['Random keys insert all over the tree, causing page splits, poor locality, and a working set that does not fit memory.','Time-ordered ids (UUIDv7, ULID, Snowflake-style) keep inserts near the right edge and preserve rough ordering.','Trade-offs: ordered ids leak creation time and concentrate writes on one shard or partition in distributed stores.','Distributed stores often want hashed or prefixed keys for spread, while single-node B-trees want sequential ones.'],pitfalls:['Giving one universal answer without separating single-node and distributed cases.']}
]);

enrich('Database Partitioning',[
 {h:'Range, hash, list and composite',ul:['Range: ordered values such as dates; easy retention, risk of a hot latest partition.','Hash: even spread; range queries touch all partitions.','List: explicit values (region, tenant); skew if values differ in size.','Composite: range then hash (month, then hash of user) to combine retention with spread.']},
 {h:'Partition pruning and query design',ul:['The planner skips partitions only when the WHERE clause constrains the partition key with a usable expression.','Queries without the key scan every partition, often slower than the unpartitioned table.','Check the plan shows only the expected partitions.','Index each partition as needed; global unique constraints usually must include the partition key.']},
 {h:'Operating partitions',ul:['Create future partitions ahead of time with automation; a missing partition can fail inserts.','Drop or detach old partitions to delete data instantly, or move them to cheaper storage.','Rebalance or split a partition that grows too large.','Backups, vacuum and statistics run per partition, so maintenance windows shrink.']},
 {h:'Vertical partitioning and related ideas',ul:['Vertical partitioning splits columns: keep hot narrow columns apart from large rarely used ones (blobs, long text).','Functional partitioning moves whole tables or domains to separate databases.','Archiving old rows to cold storage is partitioning by age.','Multi-tenant systems often partition by tenant for isolation and per-tenant deletion.']},
 {h:'Partitioning versus sharding',ul:['Partitioning: pieces inside one server or one logical database, managed by it.','Sharding: pieces on different servers; the application or a router must find the right one.','Partitioning does not add write capacity of other machines; sharding does.','Many systems partition first and shard later, using the same key.']}
],[
 {q:'Design the storage for 2 billion events per day with 90 days of retention and queries by customer and time range.',cover:['Partition by day (range) to make retention a partition drop and to prune time-range queries.','Within a day, sub-partition or cluster by customer id (hash or sorted key) so customer queries are local.','Write path: append in batches; the current partition is the hot one, so plan IO capacity for it.','Index only what queries need; consider columnar or time-series storage for scans.','Sizing: bytes per event times 180 billion, replication, compression.'],pitfalls:['Choosing hash partitioning by id and losing cheap retention and time pruning.']},
 {q:'A partitioned table has one huge partition and several tiny ones. Why and how do you fix it?',cover:['Skewed key (a big tenant or region, or recent time) or a poor boundary choice.','Measure partition sizes and query heat.','Fixes: finer ranges for the busy range, composite partitioning, splitting the big tenant, hash within the large list value.','Rebalancing operationally: split online, backfill, switch.'],pitfalls:['Only adding more partitions without addressing the skewed key.']},
 {q:'When would you choose to partition a table instead of sharding it, and how do you prepare so a later move to sharding is easy?',lvl:'Staff+',cover:['Partition when one server can still handle the writes and the problem is size, maintenance, or retention.','Choose the partition key to match the future shard key (tenant or user id in every table and query).','Avoid cross-partition joins and global unique constraints on hot paths.','Use logical shards (many more than servers) to be able to move them later.','Monitor the signals that mean it is time to shard: write saturation, storage limits, failover and restore time.'],pitfalls:['Treating the two as the same thing.']}
]);

enrich('Database Sharding',[
 {h:'Sharding strategies',ul:['Hash of key: even spread; hard to rebalance with simple modulo.','Range of key: supports range scans; risk of hot ranges (time, sequential ids).','Directory: explicit map from key or range to shard; flexible, adds a lookup dependency.','Geo or tenant sharding: data lives where users or customers are, helping latency and compliance.']},
 {h:'Consistent hashing and logical shards',ul:['Ring with virtual nodes: a key goes to the next node clockwise; adding a node moves about 1/(N+1) of keys and balances load.','Logical shards: create many (say 1,024) fixed logical shards mapped to fewer physical servers; scale by moving whole logical shards.','The mapping lives in config or a coordination service and is cached by routers.','Moving a shard: copy, catch up using the change log, brief cutover, verify, delete.']},
 {h:'Choosing the shard key',ul:['Present in nearly every query so each request hits one shard.','High cardinality and even distribution of data and traffic.','Stable: a key that changes forces a row to move shards.','Watch hot keys (celebrities, huge tenants): split the key, cache, or dedicate a shard.']},
 {h:'What you lose and how to cope',ul:['Cross-shard joins: denormalize, replicate small reference tables to every shard, or join in the application.','Cross-shard transactions: avoid by design, or use sagas or two-phase commit sparingly.','Global uniqueness and sequences: use ids that embed shard or time (Snowflake style), or a dedicated allocator.','Scatter-gather queries add latency equal to the slowest shard and hurt tail latency.']},
 {h:'Operating a sharded fleet',ul:['Schema changes must roll across all shards with version-compatible code.','Backups and restores per shard; test restoring one shard and the whole set to a consistent point.','Per-shard monitoring to catch hot shards early.','Managed routers (Vitess, Citus, Spanner, DynamoDB) remove much of this work at a cost.']}
],[
 {q:'Design the sharding scheme for a multi-tenant SaaS where a few tenants are 1000x bigger than the median.',cover:['Shard by tenant id with a directory so big tenants can be pinned to dedicated shards while small ones are packed.','Logical shards mapped to physical servers for easy rebalancing.','Large tenants that outgrow one shard need a second level: shard within the tenant by a secondary key.','Cross-tenant queries (admin, analytics) go to a separate pipeline, not scatter-gather on the OLTP shards.','Noisy-neighbor isolation, per-tenant rate limits and monitoring.'],pitfalls:['Hashing by tenant id alone and leaving the whale tenant on one overloaded shard.']},
 {q:'You must reshard from 8 to 16 shards with no downtime. Describe the procedure and the failure modes.',cover:['If logical shards exist, move half of them to new servers; otherwise, split ranges or use consistent hashing.','Copy existing data, stream the ongoing changes, verify checksums, then switch routing for that shard atomically.','Dual reads or shadow reads during the move; keep rollback until verified.','Failure modes: missed writes during catch-up, stale routing caches, double ownership (fencing), hot copy load slowing production.','Throttle, move one shard at a time, and alert on lag.'],pitfalls:['Forgetting writes that arrive during the copy, or routing caches that point to the old shard.']},
 {q:'How do you implement a query that needs data from many shards (for example top 100 products by sales), and when would you avoid it?',lvl:'Staff+',cover:['Scatter-gather: ask every shard for its local top results, then merge; correct for top-k if each returns k.','Latency is the max over shards and failure of one shard affects the result; use timeouts and partial results policy.','Better for frequent queries: maintain a precomputed global aggregate or a separate read model fed from events.','Avoid scatter-gather on hot, latency-critical paths.'],pitfalls:['Putting global analytics queries on the sharded primary path.']}
]);

enrich('Database Replication',[
 {h:'Topologies',ul:['Single leader: simplest; all writes at one node, followers for reads and failover.','Multi-leader: write in several regions; needs conflict resolution (last-write-wins, merge, CRDTs).','Leaderless: write to and read from several nodes with quorums (W + R > N), repair stale replicas on read.','Cascading: followers replicate from followers to reduce load on the leader.']},
 {h:'Sync, async and quorum',ul:['Synchronous: no loss on failover; write latency includes the slowest required follower; availability falls if it stalls.','Asynchronous: lowest latency; recent writes can be lost if the leader dies.','Semi-synchronous: at least one follower confirms; common default for important data.','Quorum: with N=3, W=2, R=2 every read overlaps the latest write.']},
 {h:'Lag and consistency anomalies',ul:['Read-your-writes: a user must see their own update; route to leader or track a position.','Monotonic reads: a user must not see time go backwards between two replicas; pin a user to a replica.','Consistent prefix: related writes should be seen in order.','Monitor lag in seconds and bytes; alert and stop routing reads to a replica that is too far behind.']},
 {h:'Failover and split brain',ul:['Detection by heartbeats with timeouts: too short causes false failovers, too long extends downtime.','Pick the most up-to-date replica; reconcile or discard writes the old leader had that were not replicated.','Prevent two leaders with fencing tokens, leases and a consensus service (Raft, Paxos, ZooKeeper, etcd).','Rehearse failover; an untested failover procedure usually fails.']},
 {h:'Replication versus backup',ul:['Replication copies mistakes instantly: a dropped table or bad deploy is replicated to all followers.','Backups and point-in-time recovery from the log protect against human error and corruption.','A delayed replica gives a window to stop a bad change.','Cross-region replicas help disaster recovery; test the recovery time and data loss (RTO and RPO).']}
],[
 {q:'Your system uses a leader with two asynchronous followers across regions. The leader\'s region goes down. What happens to data and what do you do?',cover:['Followers may be missing the last acknowledged writes; the loss window equals replication lag (RPO).','Promote the most current follower, fence the old leader so it cannot accept writes if it returns.','Reconcile writes from the old leader (extract and replay or discard according to business rules).','Redirect clients, rebuild a new follower, and review the loss.','Reduce risk: semi-synchronous replication for critical data, tighter lag monitoring, tested runbooks.'],pitfalls:['Saying failover is lossless without specifying the replication mode.']},
 {q:'Users report seeing their data go back in time after refreshing. Diagnose and fix.',cover:['Reads are alternating between replicas with different lag: a monotonic read violation.','Confirm by logging the replica and log position per request.','Fixes: sticky routing per user or session, session consistency by passing a log position, route sensitive reads to the leader.','Reduce lag at the source: replica load, long-running queries on replicas, network.'],pitfalls:['Blaming the cache or application without checking replica lag.']},
 {q:'Design replication for a payments ledger that spans two regions and must not lose acknowledged writes, but also must stay available if one region fails.',lvl:'Staff+',cover:['Synchronous or quorum replication across at least three failure domains (for example three regions or zones), so a majority survives any single failure.','Consensus-based database (Spanner, CockroachDB, a Raft-based store) rather than hand-rolled failover.','Latency cost: each write waits for a cross-region quorum round trip; place the leader near the writers.','Reads: strongly consistent from the leader or bounded-stale from followers where acceptable.','Regional failure: automatic leader election, no data loss; backups and point-in-time recovery still needed for human errors.'],pitfalls:['Promising zero loss and full availability with only two nodes and no quorum reasoning.']}
]);

enrich('Bloom Filters',[
 {h:'How it works and the maths',ul:['m bits, k hash functions; add sets k bits, check tests k bits.','False positive probability is about (1 - e^(-kn/m))^k for n items.','The best k is about (m/n) ln 2; about 10 bits per item gives roughly 1% error with k near 7.','No false negatives: removing is impossible without a counting or cuckoo variant.']},
 {h:'Where databases use them',ul:['LSM stores (Cassandra, RocksDB, HBase, LevelDB) keep a filter per sorted file so reads skip files that cannot contain the key.','Distributed query engines use them to prune partitions or in join filtering.','Saves disk reads for keys that do not exist, which are otherwise the most expensive lookups.','Filters live in memory; their small size makes that practical.']},
 {h:'Other practical uses',ul:['Cache admission: only cache an object after it is requested twice (CDNs).','Crawlers and safe-browsing checks: avoid revisiting known URLs.','Username or email availability pre-checks in front of a database.','Deduplicating events or messages approximately before an exact check.']},
 {h:'Variants and limits',ul:['Counting Bloom filter: counters instead of bits, supports deletes at higher memory.','Cuckoo and quotient filters: support deletes and often better space at low error rates.','Scalable Bloom filters add new filters as the old one fills.','HyperLogLog and Count-Min Sketch are different structures for counting distinct items and frequencies.']},
 {h:'Sizing and operating one',ul:['Choose the target error rate and the maximum expected n, then compute m and k.','Overfilling silently raises the false positive rate; monitor the fill ratio and rebuild when needed.','Use good, independent hash functions (double hashing from two hashes is a common trick).','Always follow a positive answer with the authoritative check if correctness matters.']}
],[
 {q:'You run a key-value store and 90% of lookups are for keys that do not exist. How do you cut disk reads?',cover:['Put a Bloom filter per storage file or block (as LSM engines do) so a "no" skips the disk.','Size for about 1% false positives, so about 1% of missing-key lookups still touch disk.','Memory cost is a few bits per key; compare with the saved IO.','Keep filters in memory; rebuild them during compaction.','A cache of negative results is an alternative but needs invalidation.'],pitfalls:['Treating a Bloom filter "yes" as proof the key exists.']},
 {q:'How do you size a Bloom filter for 100 million items at a 0.1% false positive rate, and what happens if you get 300 million?',cover:['Required bits per item is about 14.4 for 0.1%, so about 1.4 billion bits (about 180 MB) with k near 10.','With 3x the items in the same bits, the false positive rate rises sharply (roughly tens of percent), because most bits become 1.','Plan for growth: scalable filters, periodic rebuild from the source of truth, or alerts on fill ratio.','State clearly that correctness never depends on the filter, only performance does.'],pitfalls:['Forgetting that the error rate depends on n and degrades once exceeded.']},
 {q:'Compare a Bloom filter, a hash set, a cuckoo filter and HyperLogLog. When would you pick each?',lvl:'Staff+',cover:['Hash set: exact membership, memory proportional to the items, fine if it fits.','Bloom filter: approximate membership, no deletes, tiny memory; use in front of an expensive check.','Cuckoo filter: approximate membership with deletes and good space at low error rates; use when items expire.','HyperLogLog: counts distinct items, cannot answer membership; use for unique visitor counts.','Decision driven by error tolerance, need to delete, memory budget and the question asked.'],pitfalls:['Mixing up membership testing and distinct counting.']}
]);

PHASES[3].iq=[
 {q:'You are the owner of the database for a fast-growing e-commerce platform. Orders per day are 20x what they were a year ago, checkout latency is rising, and the single PostgreSQL primary is at 80% CPU. Present the plan for the next six months.',cover:['Measure first: top queries by total time, read to write ratio, lock waits, connection counts, working set versus memory.','Quick wins: missing indexes, N+1 queries, connection pooler, cache hot reads, move reports to a replica or warehouse.','Capacity: read replicas with read-your-writes routing, bigger instance, table partitioning with retention on orders and events.','Structural: split services\' tables into their own databases, then plan sharding by customer or tenant with logical shards.','Safety: load tests, failover drills, backups restored in rehearsal, rollout with feature flags.','Decision points tied to measured thresholds, and the cost of each stage.'],pitfalls:['A plan that jumps to the most complex option first or never mentions measurement and rollback.']},
 {q:'Explain how indexes, partitioning, sharding and replication each change reads and writes, and give an example where choosing the wrong one makes things worse.',cover:['Index: faster reads for specific queries, slower writes, more space.','Partitioning: smaller pieces in one server, pruning and cheap retention, no extra write capacity.','Replication: more read capacity and fault tolerance, no write scaling, lag and failover issues.','Sharding: scales writes and storage, loses joins and transactions across shards, needs a good key.','Wrong choice example: adding replicas to a write-bound system, or hash partitioning a time-series table that needs range deletes.'],pitfalls:['Treating partitioning and sharding as synonyms or replicas as write scaling.']},
 {q:'Choose the data layer for a global chat application with 200 million users: messages, presence, search and payments for premium plans. Defend each choice and the consistency model.',lvl:'Staff+',cover:['Messages: high write volume partitioned by conversation id, wide-column or sharded store, ordered within a conversation, replicated across regions.','Presence: in-memory store with TTLs; eventual consistency is acceptable.','Search: derived index fed from messages through a log, rebuildable.','Payments: relational with ACID transactions in a smaller, separate database, idempotent APIs.','Cross-store consistency through events and outbox rather than distributed transactions; define what users may see during lag.','Hot conversation or celebrity channels, regional failover, retention and privacy deletion.'],pitfalls:['One database for everything, or a different product named for each component with no reasoning about access patterns.']},
 {q:'A production incident: after a failover the application shows missing recent writes and a few customers report duplicate charges. Reconstruct what happened, and list the changes you would make.',lvl:'Staff+',cover:['Likely asynchronous replication: acknowledged writes that had not reached the promoted follower were lost, so clients retried and charges were repeated.','Verify with replication positions, logs of the old leader, and payment provider records; reconcile money from the provider as the source of truth.','Prevent: semi-synchronous or quorum replication for payments, idempotency keys on charge creation, fencing of the old leader.','Detection: lag alerts, reconciliation jobs, failover drills including data-loss checks.','Communicate and remediate: refund duplicates, publish the post-incident review with owners and dates.'],pitfalls:['Blaming the client retries without addressing the replication mode and the missing idempotency.']}
];

/* ===== Phase 4 lessons: Caching Fundamentals ===== */
lesson(4,{key:'Caching 101',short:'Caching 101',tag:'Caching 1 of 5',title:'Caching: keep the answer close so you do not recompute it',
  lead:'A cache is a small, fast store that keeps copies of data that is expensive to fetch or compute. A read that finds its answer there is a hit and costs a millisecond or less. A miss goes to the slower source (a database, another service, a disk) and usually stores the result for next time.',
  more:['Caches work because access is skewed: a small share of items gets most of the requests. Caching the hottest 5% to 20% of data often serves most reads, which is why a cache much smaller than the database can remove most of its load. The two numbers to watch are the hit ratio and the latency of a miss: average latency is roughly hit ratio times cache time plus miss ratio times the slow path.',
    'Caches exist at every layer: the browser, a CDN at the network edge, a reverse proxy, an in-process cache inside the application, a shared cache such as Redis or Memcached, and the database\'s own buffer pool. Closer to the user means faster but harder to invalidate and less shared.',
    'Every cache trades freshness for speed. The data in it is a copy, so it can be stale. You control that with a time to live (TTL), by deleting or updating entries when the source changes, or both. Decide per piece of data how stale is acceptable: a product description can be minutes old, a bank balance cannot.'],
  demo:'cache101',takeaway:'Cache what is read often and costly to produce, sized for the hot set. Measure hit ratio and miss latency, and decide per data type how stale a cached copy may be.',
  pre:['Latency vs Throughput vs Bandwidth','Database Scaling'],
  quiz:[{q:'A cache hit costs 1 ms, a miss costs 21 ms, and the hit ratio is 90%. What is the approximate average latency?',o:['About 3 ms','About 11 ms','About 19 ms'],a:0,why:'0.9 times 1 plus 0.1 times 21 is 0.9 plus 2.1, about 3 ms.',hint:'Weight each path by how often it happens.'},
