        {q:'Why can a cache holding only 10% of the items serve most of the requests?',o:['Because caches compress data','Because popularity is skewed: a few items get most of the traffic','Because misses are free'],a:1,why:'Real workloads follow a long-tail distribution. The hottest items repeat often enough that keeping just them gives a high hit ratio.',hint:'Think of the most-watched videos.'}],
  terms:[['Hit ratio','The fraction of reads answered by the cache.'],['TTL','Time to live: how long an entry is kept before it expires.'],['Hot set','The small group of items that receives most requests.'],['Stale data','A cached copy older than the current source value.']]});

lesson(4,{key:'Caching Strategies',short:'Strategies',tag:'Caching 2 of 5',title:'Caching strategies: who fills the cache and when writes land',
  lead:'A caching strategy answers two questions: on a read, who loads missing data into the cache, and on a write, which of the cache and the database is updated first. The answers decide how stale reads can be, how fast writes are, and what you lose if the cache dies.',
  more:['For reads, cache-aside (lazy loading) is the common default: the application checks the cache, and on a miss reads the database and fills the cache. Read-through is the same idea built into a caching layer, so the application only talks to the cache. Both only cache data that is actually requested, and the first read of each item is slow.',
    'For writes, write-through updates the cache and the database together, so the cache stays fresh at the cost of slower writes. Write-back (write-behind) updates the cache and returns immediately, flushing to the database later in batches: very fast writes, but a cache failure before the flush loses data. Write-around writes only to the database and lets reads fill the cache, which avoids filling the cache with data nobody reads soon.',
    'The classic cache-aside write rule is: update the database, then delete the cache entry (not update it). Deleting is safer because two concurrent writers updating the cache in different orders can leave the wrong value there. Even so, a race between a slow reader and a writer can put a stale value back, so keep a TTL as a safety net. Watch for the cache stampede: when a popular entry expires, thousands of requests miss at once and hit the database together. Request coalescing (one loader, everyone else waits), early or jittered expiry, and serving slightly stale data while one request refreshes are the standard fixes.'],
  demo:'cachestrat',takeaway:'Cache-aside with delete-on-write and a TTL is the safe default. Write-through keeps the cache fresh at a write cost, write-back is fastest but can lose data, and every hot key needs stampede protection.',
  pre:['Caching 101','ACID Transactions'],
  quiz:[{q:'With cache-aside, after updating a row in the database, what should the application usually do with the cached copy?',o:['Delete it, so the next read loads the fresh value','Leave it, the TTL will handle it','Update the database again'],a:0,why:'Deleting avoids races where two writers update the cache in the wrong order. The next read fills it from the database. Keep a TTL too, as a safety net.',hint:'Which is harder to get wrong: update or delete?'},
        {q:'Which strategy can lose writes the client was told succeeded, if the cache crashes?',o:['Write-through','Write-back','Write-around'],a:1,why:'Write-back acknowledges after updating only the cache. Until the background flush, the database does not have the change.',hint:'Where does the data live at the moment of the reply?'}],
  terms:[['Cache-aside','The app loads missing data into the cache itself.'],['Write-through','Writes update cache and database together.'],['Write-back','Writes update the cache now and the database later.'],['Cache stampede','Many requests miss the same expired key at once and overload the source.']]});

lesson(4,{key:'Cache Eviction Policies',short:'Eviction',tag:'Caching 3 of 5',title:'Eviction policies: what to throw out when the cache is full',
  lead:'A cache has limited memory. When it is full and a new item arrives, it must evict something. The eviction policy decides what, and a good choice for your traffic pattern can raise the hit ratio a lot without any extra memory.',
  more:['LRU (least recently used) evicts the item that has gone unused the longest. It adapts quickly when popularity changes and is the most common default. LFU (least frequently used) evicts the item with the fewest uses, which protects long-term favourites but adapts slowly when something new becomes popular. FIFO evicts the oldest inserted item regardless of use: simple and cheap, usually worse.',
    'Each has a weak spot. A one-time scan (a batch job reading every record once) pushes popular items out of an LRU cache, an effect called cache pollution. LFU keeps items that were popular yesterday and are useless today unless counts decay. Modern caches mix the two: Redis offers approximate LRU and LFU with decay, and libraries such as Caffeine use W-TinyLFU, which admits a new item only if it looks more popular than the one it would evict.',
    'Eviction is different from expiry. TTL expiry removes data because it may be stale. Eviction removes data because memory is full. Watch both rates: a high eviction rate with a low hit ratio means the cache is too small for the hot set or the policy fits the traffic badly.'],
  demo:'evict',takeaway:'LRU is a good default, LFU protects stable favourites, and modern caches combine recency and frequency. Measure hit ratio and evictions on your real traffic, and beware scans that pollute the cache.',
  pre:['Caching 101'],
  quiz:[{q:'A nightly report reads every product once, and in the morning the cache hit ratio is terrible. Which policy is most likely in use?',o:['LFU','LRU','No cache at all'],a:1,why:'Each item the scan touched becomes "most recently used", so LRU evicts the genuinely popular items to make room for one-time reads.',hint:'Which policy only looks at the last access?'},
        {q:'What is the main weakness of plain LFU?',o:['It cannot store popular items','Items that were popular long ago keep high counts and stay even after nobody wants them','It evicts at random'],a:1,why:'Without aging the counts, old favourites crowd out new ones. Real LFU implementations decay counts over time.',hint:'Counts only go up.'}],
  terms:[['Eviction','Removing an item because the cache is full.'],['LRU','Evict the least recently used item.'],['LFU','Evict the least frequently used item.'],['Cache pollution','Filling the cache with items that will not be reused.']]});

lesson(4,{key:'Distributed Caching',short:'Distributed Cache',tag:'Caching 4 of 5',title:'Distributed caching: one cache spread over many servers',
  lead:'When the hot data no longer fits in one server\'s memory, or one cache server cannot take all the requests, you spread the cache over a cluster. Each key lives on one node chosen by hashing, so the cluster behaves like one big cache shared by all application servers.',
  more:['Key placement uses the same ideas as sharding. hash(key) mod N is simple, but when a node joins or leaves almost every key maps somewhere new, so the whole cache goes cold at once and the database takes the full load. Consistent hashing moves only about 1/N of the keys. Redis Cluster uses a fixed set of 16,384 hash slots assigned to nodes, which has the same effect.',
    'A local in-process cache is faster (no network hop) but each application server holds its own copy, so copies can disagree and invalidation must reach every server. A shared distributed cache has one copy per key and a network hop of a fraction of a millisecond. Many systems use both: a small local cache for the very hottest keys in front of the shared cluster.',
    'Plan for failure and hot spots. Losing a node turns its keys into misses that fall on the database. Replicas per shard and fast failover help, and so does treating the cache as an optimisation the system can survive without. A single very hot key can overload one node: replicate it, add a local cache, or split it across several keys. Also watch large values, connection counts, and network bandwidth on cache nodes.'],
  demo:'distcache',takeaway:'Spread keys with consistent hashing or hash slots so membership changes only cool a small slice of the cache. Size the database to survive a node loss, and handle hot keys with replication or local caching.',
  pre:['Caching 101','Consistent Hashing','Database Sharding'],
  quiz:[{q:'A cluster uses hash(key) mod N. One node dies and the database is immediately overloaded. Why?',o:['The dead node held all the data','Changing N remaps most keys, so most of the cache misses at once','Databases cannot run without a cache'],a:1,why:'With modulo placement, most keys move when N changes, so the surviving nodes are effectively empty and every request falls to the database.',hint:'Compare key mod 5 with key mod 4.'},
        {q:'What is the main downside of an in-process cache on each application server compared with a shared cache?',o:['It is slower than a network call','Each server has its own copy, so copies can disagree and must all be invalidated','It cannot have a TTL'],a:1,why:'Local caches skip the network but duplicate data. Invalidating one key means reaching every server, or accepting short TTLs.',hint:'How many copies exist?'}],
  terms:[['Hash slot','A fixed bucket of key space assigned to a node (Redis Cluster has 16,384).'],['Local cache','A cache inside the application process.'],['Hot key','One key that receives a large share of traffic.'],['Cold cache','A cache with few useful entries, so most reads miss.']]});

lesson(4,{key:'Content Delivery Network (CDN)',short:'CDN',tag:'Caching 5 of 5',title:'CDN: caches at the edge of the internet',
  lead:'A content delivery network is a global set of servers (edges or points of presence) that keep copies of your content close to users. A user in Sydney fetches your images from a server in Sydney instead of from your origin in Virginia, which cuts latency, and the edge absorbs traffic your origin would otherwise serve.',
  more:['The biggest gain is round trips. Opening a connection, setting up TLS and fetching a file each cost a round trip, and a round trip across an ocean takes 100 to 250 ms. Ending the connection at a nearby edge makes those trips cost 10 to 20 ms. On a miss, the edge fetches from the origin over a connection it keeps warm, and stores the result for the next user.',
    'CDNs cache what is the same for everyone: images, scripts, stylesheets, fonts, video segments and downloadable files, plus public API responses or HTML when they are not personalised. Control it with Cache-Control headers (max-age, s-maxage, public or private). Use versioned file names (app.3f9c.js) so you can cache for a year and still deploy instantly, because a new version is a new URL. Purge or use short TTLs for content that must change in place.',
    'A CDN also protects the origin: it absorbs traffic spikes, can shield the origin with a mid-tier cache so only one request per object reaches it, and usually adds DDoS protection and a web application firewall. Watch for cache key mistakes: including irrelevant query parameters or cookies splits one object into thousands of cache entries, while leaving out a header that changes the response (language, auth) serves the wrong content to users.'],
  demo:'cdn',takeaway:'A CDN cuts latency by serving cacheable content from servers near users and protects the origin from load. Make static assets immutable with versioned names, set Cache-Control deliberately, and design cache keys carefully.',
  pre:['Caching 101','Domain Name System (DNS)','HTTP/HTTPS'],
  quiz:[{q:'You deploy a new app.js but users keep getting the old one from the CDN for hours. What is the most robust fix?',o:['Ask users to clear their cache','Use versioned file names (app.3f9c.js) and reference the new name in the HTML','Turn off the CDN'],a:1,why:'A new file name is a new URL, so it is a guaranteed cache miss. The old file can stay cached safely, and you can use very long TTLs.',hint:'What does the cache key on?'},
        {q:'Which response is the worst candidate for caching at a shared CDN edge?',o:['A product image','A page showing the logged-in user\'s account balance','A JavaScript bundle'],a:1,why:'Personalised responses differ per user. Caching them publicly risks showing one user\'s data to another. Mark them private or no-store.',hint:'Is it the same for everyone?'}],
  terms:[['Edge / PoP','A CDN location close to users.'],['Origin','Your own server that holds the source content.'],['Cache-Control','HTTP header that tells caches what to store and for how long.'],['Purge','Removing content from CDN caches before it expires.']]});

enrich('Caching 101',[
 {h:'Where caches live',ul:['Client: browser HTTP cache, service worker, mobile app storage.','Edge: CDN points of presence.','Server: reverse proxy cache, in-process cache, shared cache cluster (Redis, Memcached).','Data layer: database buffer pool, query result caches, OS page cache.','Each layer closer to the user is faster but harder to invalidate.']},
 {h:'The numbers that matter',ul:['Hit ratio and miss ratio; average latency = hit ratio x hit cost + miss ratio x miss cost.','Tail latency: p99 is set by misses, so a 95% hit ratio can still leave a slow p99.','Load removed from the source: a 90% hit ratio cuts source reads tenfold.','Memory per entry, eviction rate and expiry rate tell you if the cache is the right size.']},
 {h:'What to cache',ul:['Results that are read often, expensive to compute or fetch, and change rarely.','Database rows by key, rendered pages or fragments, API responses, computed aggregates, sessions, permission checks.','Negative results (not found) with short TTLs, to block repeated lookups for missing keys.','Avoid caching data that must always be exact (balances at payment time) or that is unique per request.']},
 {h:'Freshness and invalidation',p:['There are only a few ways to keep a cache honest, and most systems combine them.'],ul:['TTL: simple and bounded staleness; choose per data type.','Explicit invalidation on write: delete or update the key when the source changes.','Event-driven invalidation: consume change events (CDC) and delete affected keys.','Versioned keys: include a version in the key so new data is a new key and old entries expire unused.']},
 {h:'When caching hurts',ul:['Low hit ratio: you pay the extra hop on most requests and gain little.','Hiding problems: a cache in front of a slow query masks it until the cache fails.','Correctness bugs from stale data, which are hard to reproduce.','Cold starts after deploys or failures can overload the source if it was sized assuming the cache.']}
],[
 {q:'Your product page takes 400 ms and the database is the bottleneck. Walk through how you would decide what to cache and where.',cover:['Profile the request: which queries and calls dominate, how often each item is read, how often it changes.','Choose layers: CDN for static assets and possibly the whole page for anonymous users, shared cache for product data and computed fields, local cache for tiny hot config.','Define TTL and invalidation per data type (price changes vs description).','Measure hit ratio, p50 and p99 before and after; size the database to survive a cold cache.','Watch correctness cases: price and stock must be fresh at checkout, not from the cache.'],pitfalls:['Caching the whole response for logged-in users and leaking personal data.']},
 {q:'How do you decide the TTL for a cached item?',cover:['Ask the business how stale is acceptable for that data and what a stale read costs.','Combine with change rate: data that changes hourly with a 24-hour TTL is wrong most of the day.','Add explicit invalidation where staleness is costly, and keep a TTL as a safety net.','Add jitter to TTLs so many keys do not expire at the same moment.','Monitor stale-read incidents and hit ratio to tune it.'],pitfalls:['Picking one TTL for everything.']},
 {q:'The cache cluster goes down at peak and the whole site fails. How do you redesign so the cache is an optimisation, not a dependency?',lvl:'Staff+',cover:['Capacity: size the source (database, services) to handle at least a degraded load without the cache, or have a plan to shed load.','Protection: request coalescing, rate limits and circuit breakers toward the database, serving stale data or degraded pages.','Resilience of the cache itself: replicas, multiple zones, fast failover, gradual warm-up.','Testing: chaos drills that disable the cache, and load tests with a cold cache.','Observability: alerts on hit ratio drops before they become outages.'],pitfalls:['Treating the cache as a source of truth or sizing the database for the cached load only.']}
]);

enrich('Caching Strategies',[
 {h:'Read strategies',ul:['Cache-aside: app reads cache, on miss reads source and fills. Most flexible, app owns the logic.','Read-through: the cache layer loads from the source on a miss. Cleaner app code, needs a cache that knows the source.','Refresh-ahead: refresh popular keys shortly before they expire, so users rarely see a miss.','All lazy approaches make the first read after expiry slow.']},
 {h:'Write strategies',ul:['Write-through: write cache and source together; fresh cache, slower writes, caches data that may never be read.','Write-back: write cache now, source later; fastest writes and batching, risk of loss unless the cache is durable or replicated.','Write-around: write only the source; avoids churn for write-heavy data that is rarely re-read.','Invalidate on write (delete the key) is the usual pairing with cache-aside.']},
 {h:'Races and stale data',ul:['Two writers updating the cache can leave the older value last: delete instead of update.','A reader that misses, reads the old value from the database, and writes it to the cache after a writer deleted the key re-inserts stale data: keep TTLs, or use versioned values and compare-and-set.','Delayed double delete (delete, write, delete again after a short delay) narrows the window.','Read replicas add another source of stale fills: fill from the primary for recently written keys.']},
 {h:'Cache stampedes',ul:['Many concurrent misses for one key after expiry or a cold start all hit the source.','Request coalescing (single flight): one request loads, the rest wait for its result.','Locks or leases on the key while it is being rebuilt.','Probabilistic early expiration and TTL jitter spread out refreshes.','Serve stale while revalidating: return the old value and refresh in the background.']},
 {h:'Choosing a strategy',ul:['Read-heavy, tolerant of brief staleness: cache-aside with TTL and delete on write.','Read-after-write must be fresh: write-through, or read the source for recently written keys.','Very high write rate, some loss acceptable (counters, metrics): write-back with periodic flush.','Data written once and read rarely: write-around.']}
],[
 {q:'Explain a race condition that leaves stale data in a cache-aside setup, and how you would close it.',cover:['Sequence: reader misses, reads old value from DB; writer updates DB and deletes key; reader writes the old value into the cache.','The stale value lives until TTL.','Fixes: short TTL as a bound, versioned values with compare-and-set, delayed second delete, lease tokens on fill (as in Facebook\'s memcache paper).','Pick by the cost of staleness for that data.'],pitfalls:['Claiming delete-on-write alone makes the cache always consistent.']},
 {q:'A popular key expires and the database CPU spikes to 100% for a few seconds every hour. Diagnose and fix.',cover:['Cache stampede: synchronized expiry of hot keys, many concurrent misses.','Confirm with miss spikes per key aligned with TTL boundaries.','Fix: request coalescing, serve-stale-while-revalidate, refresh-ahead for hot keys, TTL jitter.','Protect the database: concurrency limits for the rebuild path.'],pitfalls:['Simply raising the TTL, which only moves the spike.']},
 {q:'You need a leaderboard updated thousands of times per second and read by millions. Which caching and write strategy would you use?',lvl:'Staff+',cover:['Keep the live leaderboard in an in-memory structure (Redis sorted set) as the primary serving store; writes go there directly (write-back style).','Persist periodically or stream updates to a durable store; define acceptable loss on failure.','Shard by leaderboard or score range for very large boards; replicas for reads.','Cache the top-N view at the edge or locally for a second or two.','Recovery: rebuild from the durable log after a crash.'],pitfalls:['Writing every score update synchronously to a relational database.']}
]);

enrich('Cache Eviction Policies',[
 {h:'The classic policies',ul:['LRU: evict the least recently used; good general default, weak against scans.','LFU: evict the least frequently used; good for stable popularity, needs aging.','FIFO: evict the oldest inserted; cheap, ignores use.','Random: surprisingly decent and very cheap, used where bookkeeping is costly.','TTL-based: evict items closest to expiry first.']},
 {h:'Implementation cost',ul:['Exact LRU needs a hash map plus a doubly linked list: O(1) get and put, with pointer overhead per entry.','Redis approximates LRU and LFU by sampling a few keys and evicting the best of them.','LFU needs counters and decay; probabilistic counters keep memory small.','Lock contention on the shared list can limit throughput; segmented or sampled designs avoid it.']},
 {h:'Scan resistance and admission',ul:['Scans pollute LRU caches with one-time items.','Segmented LRU and 2Q keep new items in a probation area until they are used again.','ARC adapts between recency and frequency automatically.','TinyLFU admission: a new item enters only if its estimated frequency beats the eviction victim.']},
 {h:'Eviction versus expiry',ul:['Expiry (TTL) is about freshness; eviction is about memory.','Redis maxmemory-policy chooses what to evict (allkeys-lru, volatile-lru, allkeys-lfu, noeviction).','noeviction makes writes fail when full, which can surprise an application.','Monitor evicted keys per second and expired keys per second separately.']},
 {h:'Choosing and tuning',ul:['Replay real traffic traces against candidate policies and sizes.','Plot hit ratio against cache size to find the knee of the curve.','Separate caches for different workloads (sessions vs product data) so one cannot evict the other.','Re-check after product changes that shift access patterns.']}
],[
 {q:'Implement an LRU cache with O(1) get and put. Then discuss making it safe for many threads.',cover:['Hash map from key to node, doubly linked list ordered by recency; get moves node to front, put inserts at front and evicts the tail.','Edge cases: updating an existing key, capacity zero, eviction callbacks.','Concurrency: a single lock is simple but serialises; striped locks or segmented caches; approximate recency to avoid writes on every read.','Mention production libraries (Caffeine) that use buffers to record accesses without locking on the read path.'],pitfalls:['Using a list scan for recency, making operations O(n).']},
 {q:'Your cache hit ratio dropped from 92% to 70% after a new feature launched. How do you investigate?',cover:['Check whether the key space grew (new keys, cardinality from new query parameters).','Check eviction rate and memory: is the hot set now larger than the cache.','Look for scans or batch jobs polluting the cache.','Check TTL changes and invalidation storms from the feature.','Fix by resizing, separating workloads, changing policy, or fixing the key design.'],pitfalls:['Immediately doubling memory without understanding the cause.']},
 {q:'Design the eviction and admission strategy for a CDN edge with limited disk and a very long tail of objects.',lvl:'Staff+',cover:['Most objects are requested once; caching them wastes space and evicts useful ones.','Admission control: cache only on second request (Bloom filter of recent requests) or with TinyLFU-style frequency estimates.','Size-aware eviction: large objects cost more space per hit; weigh hit density (hits per byte).','Tiered storage: memory for the hottest small objects, SSD for the rest, and a mid-tier shield cache.','Measure byte hit ratio as well as request hit ratio.'],pitfalls:['Using plain LRU and letting one-hit wonders churn the cache.']}
]);

enrich('Distributed Caching',[
 {h:'Partitioning the key space',ul:['Client-side hashing (consistent hashing in the client library) or a proxy layer (Twemproxy, mcrouter, Envoy).','Redis Cluster: 16,384 hash slots mapped to masters; clients learn the map and follow redirects.','Hash tags force related keys onto the same slot so multi-key operations work.','Virtual nodes or many slots keep load even as nodes join and leave.']},
 {h:'Replication and failover',ul:['Primary and replica per shard; replicas promote on failure.','Replication is usually asynchronous, so a failover can lose recent cache writes: fine for a cache, not for a source of truth.','Replicas can serve reads to spread hot-key load, with some staleness.','Multi-zone placement so one zone outage does not empty the cache.']},
 {h:'Local plus shared caches',ul:['L1 in-process (microseconds) and L2 shared (sub-millisecond network hop).','L1 needs short TTLs or broadcast invalidation (pub/sub) to stay close to L2.','Use L1 for tiny, very hot, rarely changing data: config, feature flags, top items.','Measure memory per application instance; L1 multiplies by the number of instances.']},
 {h:'Hot keys and big keys',ul:['Detect hot keys with sampling or the cache\'s own hot-key reports.','Mitigate: local L1 copies, read replicas, or split into key#1..key#N and pick one at random for reads.','Big values (multi-megabyte) block the single-threaded event loop and saturate network; split or compress them.','Limit per-client connections and use pooling; connection storms can take a cluster down.']},
 {h:'Operational concerns',ul:['Warm new nodes gradually instead of shifting traffic all at once.','Plan capacity for the miss load when a node or zone fails.','Serialisation format and versioning: a deploy that changes the object shape must handle old cached values.','Security: authentication, TLS, and never exposing the cache to the internet.']}
],[
 {q:'Design a distributed cache for 500 GB of hot data serving 2 million reads per second across three zones.',cover:['Sizing: memory per node with headroom, number of shards, replicas per shard across zones; reads per node versus measured capacity.','Partitioning with hash slots or consistent hashing; client library or proxy routing.','Failover with replicas; behaviour during resharding.','Hot keys: L1 caches and replica reads; big-key limits.','Capacity of the backing store during a zone loss; warm-up strategy; monitoring per shard.'],pitfalls:['Forgetting replication doubles memory, or that one node failure means a burst of misses.']},
 {q:'How would you keep in-process caches on 300 application servers consistent when data changes?',cover:['Short TTLs where staleness of a few seconds is acceptable.','Broadcast invalidation via pub/sub (Redis pub/sub, Kafka topic) with key or version messages.','Versioned keys or a global version number checked cheaply.','Accept that broadcasts can be missed; TTL bounds the damage.','Consider whether a shared cache alone is good enough.'],pitfalls:['Assuming a broadcast invalidation always arrives.']},
 {q:'One key receives 30% of all cache reads and its shard is melting. What do you do now and later?',lvl:'Staff+',cover:['Now: add an in-process L1 cache with a short TTL for that key, or read from replicas.','Split the key into N copies with a random suffix for reads; writes update all copies.','Later: automatic hot-key detection and promotion to L1; rate limits per key; product fixes (precompute the response, push it to the CDN).','Make sure the backing store is protected with coalescing if the hot key expires.'],pitfalls:['Adding more shards, which does not spread one key.']}
]);

enrich('Content Delivery Network (CDN)',[
 {h:'How requests reach the edge',ul:['DNS-based routing: the CDN\'s DNS answers with an edge near the resolver.','Anycast: many edges announce the same IP and the network routes to the nearest.','The edge terminates TCP and TLS close to the user, so handshakes are cheap.','On a miss the edge fetches from the origin, often through a regional mid-tier (origin shield).']},
 {h:'Caching rules',ul:['Cache-Control: max-age for browsers, s-maxage for shared caches, private for per-user content, no-store for sensitive data.','stale-while-revalidate and stale-if-error let edges serve old content while refreshing or during origin outages.','ETag and Last-Modified allow cheap revalidation with 304 responses.','Vary tells caches which request headers change the response; use it sparingly.']},
 {h:'Cache keys and invalidation',ul:['The cache key is usually host plus path plus selected query parameters; strip tracking parameters.','Versioned asset names (content hash) allow year-long TTLs and instant deploys.','Purge by URL, by tag (surrogate keys), or everything; purges take seconds to propagate.','Soft purge marks content stale instead of deleting it, so edges can still serve it if the origin is down.']},
 {h:'Beyond static files',ul:['Video streaming: segments (HLS, DASH) are ordinary cacheable files.','Dynamic acceleration: even uncacheable requests benefit from edge TLS and optimised routes to the origin.','Edge compute: run small functions at the edge for redirects, A/B tests, auth checks, personalisation.','Security: DDoS absorption, WAF rules, bot management, signed URLs for private content.']},
 {h:'Push versus pull and cost',ul:['Pull CDN: edges fetch on demand; simple, first request per edge is slow.','Push CDN: you upload content ahead of time; good for large, predictable files.','Cost is mostly bytes out of the CDN; the hit ratio also decides origin egress cost.','Multi-CDN setups add resilience and price leverage at the cost of complexity.']}
],[
 {q:'Design the static asset and media delivery for a global e-commerce site.',cover:['Content-hashed file names with long max-age and immutable; HTML with short TTL or no-store.','Images resized and converted at the edge or in a pipeline, cached per variant (width, format) with a controlled cache key.','Origin shield to protect the origin; stale-if-error for resilience.','Purge strategy for product images, signed URLs for private files.','Metrics: hit ratio by region, origin egress, time to first byte.'],pitfalls:['Short TTLs on hashed assets, or including cookies in the cache key.']},
 {q:'Users in one country report the site is slow while others are fine. How do you investigate a CDN-related cause?',cover:['Check CDN analytics by region: hit ratio, edge latency, error rates.','Confirm routing: are users reaching a nearby edge (DNS resolver location, anycast routing issues)?','Check the origin path for misses: origin latency from that region, shield placement.','Synthetic tests from that region; compare providers if multi-CDN.','Fixes: adjust routing, add a closer shield, raise cacheability.'],pitfalls:['Assuming the CDN is always the fastest path without measuring.']},
 {q:'Your origin goes down for 20 minutes. How should the CDN be configured so most users do not notice?',lvl:'Staff+',cover:['stale-if-error and stale-while-revalidate with generous windows on cacheable content.','Long TTLs with versioned URLs for assets; soft purges instead of hard ones.','Origin shield and request collapsing to avoid a thundering herd when the origin returns.','Static fallback pages for uncacheable routes; edge logic to show degraded mode.','Multi-region origins with health-checked failover at the CDN.'],pitfalls:['Relying on short TTLs everywhere, so caches empty during the outage.']}
]);

PHASES[4].iq=[
 {q:'Design the caching layers for a news site that gets 50x traffic on a breaking story. Cover browser, CDN, application and database caches, and how a correction to the story reaches readers quickly.',cover:['CDN caches article HTML for anonymous users with short TTL plus stale-while-revalidate; assets versioned with long TTL.','Origin shield and request collapsing so a spike does not hit the origin per edge.','Application cache for rendered fragments and article data; database read replicas behind it.','Correction path: purge by surrogate key (article id) at the CDN and delete application keys, with TTL as a bound.','Logged-in or personalised parts loaded separately (edge includes or client-side calls).','Load test at the spike level with a cold cache.'],pitfalls:['Long TTLs with no purge plan, or no protection for the origin when TTLs expire under load.']},
 {q:'Compare cache-aside, read-through, write-through, write-back and write-around, and give a workload where each is the right choice.',cover:['Cache-aside: general read-heavy data with tolerance for brief staleness.','Read-through: when a caching layer or library can own loading, simplifying app code.','Write-through: read-after-write freshness needed, writes not too frequent.','Write-back: high write rates where some loss is acceptable or the cache is durable.','Write-around: write-heavy data that is rarely re-read soon.','Each choice\'s failure mode: staleness, write latency, data loss, cache misses after writes.'],pitfalls:['Describing the strategies without failure modes.']},
 {q:'A company\'s database is sized only for the 5% of traffic that misses the cache. Explain the risks and how you would make the system safe.',lvl:'Staff+',cover:['Risks: cache node or cluster loss, deploys that flush or change key formats, stampedes on hot keys, eviction storms; any of them sends 20x load to the database.','Protection: coalescing, concurrency limits and circuit breakers toward the database; serve stale; degrade features.','Resilience: replicated multi-zone cache, gradual warm-up, versioned key changes rolled out slowly.','Capacity: decide what minimum load the database must survive and test it in game days.','Observability: hit ratio, miss rate per key, database headroom alerts.'],pitfalls:['Assuming the hit ratio is a constant.']},
 {q:'How do you keep caches, a database and a search index consistent enough for an e-commerce catalog where prices change several times a day?',lvl:'Staff+',cover:['Database is the source of truth; price changes emit events through an outbox or CDC.','Consumers invalidate application cache keys and CDN surrogate keys, and update the search index.','TTLs as a safety net; versioned values to avoid older events overwriting newer data.','Checkout always reads the price from the source of truth, so a stale display never becomes a wrong charge.','Measure end-to-end propagation lag and alert on it.'],pitfalls:['Trusting cached prices at payment time.']}
];

/* ===== Phase 5 lessons: Asynchronous Communication ===== */
lesson(5,{key:'Pub/Sub',short:'Pub/Sub',tag:'Async 1 of 4',title:'Pub/Sub: announce what happened, let others react',
  lead:'In publish/subscribe, a service publishes a message to a topic without knowing who will read it. Every subscriber to that topic gets its own copy. The publisher says "an order was placed", and email, analytics, search and fraud checks each react on their own time.',
  more:['Compare this with direct calls. If the order service calls four services one after another, the customer waits for all four, one broken service fails the order, and every new consumer means changing the order service. With pub/sub the order service publishes once and returns. Subscribers are decoupled in three ways: they do not need to be running at the same time (the broker holds messages), the publisher does not know they exist, and each scales and fails on its own.',
    'Delivery models differ by system. Push systems (Google Pub/Sub push, SNS to HTTP endpoints) call subscribers. Pull systems (Kafka, Pub/Sub pull) let subscribers fetch at their own pace, which handles slow consumers better. Most give at-least-once delivery, so a subscriber can see the same message twice and must handle that. Ordering is usually guaranteed only within a partition or ordering key, not across the whole topic.',
    'The cost is that the flow becomes harder to see. Nobody "calls" the analytics service, so tracing a request needs correlation ids carried in the message. Topics become contracts: the message schema must be versioned like an API. And the publisher gets no answer, so pub/sub fits notifications of facts ("this happened"), not questions that need a reply.'],
  demo:'pubsub',takeaway:'Publish facts to a topic and let any number of subscribers react independently. You gain loose coupling, resilience to slow consumers and easy fan-out; you pay with at-least-once duplicates, weaker ordering and harder tracing.',
  pre:['APIs'],
  quiz:[{q:'The order service calls email, analytics and search synchronously, and the analytics service is down. What happens, and what does pub/sub change?',o:['Nothing; calls never fail','Orders fail or wait on a timeout; with pub/sub the order succeeds and analytics catches up when it returns','Pub/sub makes analytics never fail'],a:1,why:'Synchronous chains share fate. With a topic, the broker keeps analytics\' messages until it is back, and the order flow does not depend on it.',hint:'Who has to be up for the order to succeed?'},
        {q:'A subscriber receives the same OrderPlaced event twice. What is the right design response?',o:['Switch brokers, duplicates mean a bug','Make the handler idempotent, for example by recording processed event ids','Ask the publisher to publish less often'],a:1,why:'Most brokers deliver at least once. Duplicates are normal, so handlers must produce the same result when run twice.',hint:'Remember the Idempotency lesson.'}],
  terms:[['Topic','A named channel that messages are published to.'],['Subscription','One subscriber\'s copy of the stream from a topic.'],['Fan-out','One message delivered to many receivers.'],['Event','A message stating a fact that already happened.']]});

lesson(5,{key:'Message Queues',short:'Queues',tag:'Async 2 of 4',title:'Message queues: a buffer of work for consumers',
  lead:'A message queue holds tasks until a consumer is ready to process them. Producers add messages; consumers take them one at a time, process them, and acknowledge. Each message is handled by one consumer. Queues smooth out spikes, let slow work happen in the background, and let you add workers to go faster.',
  more:['Queue-based load leveling is the first big use. Traffic arrives in bursts, but the database or payment provider behind the workers can only take a steady rate. The queue absorbs the burst and the consumers drain it at a safe pace. The trade is latency: during a spike, a message may wait seconds or minutes. If arrivals exceed capacity for long, the queue grows without limit, so watch queue depth and the age of the oldest message, and scale consumers on them.',
    'Competing consumers is the second. Many identical workers read from the same queue and each message goes to one of them, so throughput scales by adding workers. A message is hidden while one worker processes it (a visibility timeout or unacknowledged state); if that worker dies, the message reappears for another. That means messages can be processed twice, so handlers must be idempotent, and strict ordering across many consumers is lost unless you use FIFO queues or partitioning by key.',
    'Failures need a plan. A poison message (bad data, a bug) fails every time; retried forever it blocks a worker and floods the logs. Retry a few times with backoff, then move it to a dead letter queue (DLQ) for inspection and later replay. Alert on DLQ size, because a growing DLQ is lost work. Also bound message size, set a retention period, and decide what happens when the queue itself is full: reject producers, or shed low-priority work.'],
  demo:'mqueue',takeaway:'Queues decouple producers from slow consumers, absorb spikes and scale with competing workers. Monitor depth and message age, make handlers idempotent, and send repeated failures to a dead letter queue.',
  pre:['Pub/Sub','Idempotency'],
  quiz:[{q:'Arrivals are 1,000 messages per second for 10 minutes, and your consumers handle 600 per second. What happens?',o:['Messages are dropped immediately','The queue grows by about 400 per second, and new messages wait longer and longer until you add consumers or the spike ends','Consumers speed up automatically'],a:1,why:'A queue absorbs the difference as backlog. That is fine for short spikes; sustained overload needs more capacity.',hint:'Arrivals minus capacity.'},
        {q:'One message crashes the consumer every time it is processed. What should happen to it?',o:['Retry it forever','After a few attempts with backoff, move it to a dead letter queue and alert','Delete the whole queue'],a:1,why:'A poison message never succeeds. A DLQ removes it from the main flow without losing it, so someone can fix and replay it.',hint:'Do not let one message block the rest.'}],
  terms:[['Acknowledgement','The consumer telling the queue a message is done, so it can be deleted.'],['Visibility timeout','How long a received message stays hidden before it is redelivered.'],['Dead letter queue','Where messages go after repeated failures.'],['Load leveling','Using a queue to turn bursty arrivals into steady processing.']]});

lesson(5,{key:'Message Brokers',short:'Brokers',tag:'Async 3 of 4',title:'Message brokers: queues, logs and delivery guarantees',
  lead:'A message broker is the server that stores and routes messages between producers and consumers. The two main families behave differently. Queue brokers (RabbitMQ, ActiveMQ, Amazon SQS) hand each message to a consumer and delete it once acknowledged. Log brokers (Kafka, Pulsar, Kinesis) append messages to a durable, ordered log that consumers read by position and can read again.',
  more:['Queue brokers are good at task distribution: flexible routing (RabbitMQ exchanges route by key or pattern), per-message acknowledgement, priorities, delayed messages and dead lettering. Once a message is consumed it is gone, so a new consumer cannot read history. Log brokers keep messages for a retention period whatever is consumed. Each consumer group tracks its own offset, so many independent groups read the same stream, a group can rewind to replay, and throughput is very high because reads and writes are sequential. A Kafka topic is split into partitions; order is kept within a partition, and a partition is read by at most one consumer in a group, so the number of partitions caps parallelism.',
    'Delivery guarantees come from when a consumer acknowledges. Acknowledge before processing and a crash loses the message: at-most-once. Acknowledge after processing and a crash causes redelivery: at-least-once, the common default. Exactly-once delivery across a network is not achievable in general; what systems offer is exactly-once processing within a boundary (Kafka transactions for read-process-write inside Kafka) or effectively-once results from at-least-once delivery plus idempotent handlers.',
    'Brokers are critical infrastructure. Replicate them (Kafka replicates each partition to several brokers and acknowledges writes when in-sync replicas have them), monitor consumer lag, plan partition counts and retention for growth, and register message schemas (Avro, Protobuf with a schema registry) so producers cannot break consumers.'],
  demo:'brokers',takeaway:'Use a queue broker to distribute tasks, a log broker when several consumers need the same stream or replay matters. Expect at-least-once delivery and design idempotent consumers; replicate the broker and watch consumer lag.',
  pre:['Message Queues','Database Replication'],
  quiz:[{q:'A new analytics team wants to process the last 7 days of order events that other services have already consumed. Which broker type makes this easy?',o:['A queue broker, messages stay after acknowledgement','A log broker with 7+ days of retention: the new consumer group starts at an old offset','Neither can do it'],a:1,why:'Logs keep messages independent of consumption and each group has its own offset, so replay is built in.',hint:'Which one deletes messages after reading?'},
        {q:'A consumer processes a message, then crashes before acknowledging. With acknowledge-after-processing, what happens?',o:['The message is lost','The message is redelivered and processed again, so the handler must be idempotent','The broker crashes too'],a:1,why:'That is at-least-once delivery: no loss, possible duplicates.',hint:'The broker never heard "done".'}],
  terms:[['Partition','An ordered shard of a log topic; the unit of parallelism.'],['Offset','A consumer\'s position in a partition.'],['Consumer group','Consumers sharing the work of a topic; each partition goes to one member.'],['Consumer lag','How far a group is behind the newest message.']]});

lesson(5,{key:'Change Data Capture (CDC)',short:'CDC',tag:'Async 4 of 4',title:'Change data capture: stream every database change',
  lead:'Change data capture reads a database\'s own change log and turns every committed insert, update and delete into an event. Other systems (a search index, a cache, a data warehouse, other services) stay in sync by consuming that stream, without the application having to publish anything.',
  more:['It solves the dual-write problem. An application that writes to the database and then publishes an event has two writes and no shared transaction. A crash between them leaves the database changed but no event sent (or, in the other order, an event for a change that never happened). Retries do not fix this reliably. Two patterns do. The transactional outbox writes the business row and an "outbox" row in the same database transaction; a relay then publishes outbox rows to the broker and marks them sent. CDC goes one step further and reads the write-ahead log (PostgreSQL logical replication, MySQL binlog) with a connector such as Debezium, so anything that committed is published, in commit order.',
    'The two combine well: CDC on the outbox table gives you business-level events (OrderPlaced with the fields consumers need) with log-based reliability, instead of exposing raw table rows that couple every consumer to your schema. Delivery is at-least-once, so consumers must be idempotent, and events carry a position (log sequence number or version) so a consumer can ignore older updates that arrive late.',
    'Practical concerns: the initial snapshot of existing data before streaming starts, schema changes flowing through to consumers, the log retention on the database (a stuck connector can make the database keep log files until the disk fills), deletes (tombstones), and monitoring end-to-end lag from commit to consumer.'],
  demo:'cdc',takeaway:'Never rely on writing to a database and a broker separately. Use a transactional outbox, CDC from the database log, or both, and make consumers idempotent and order-aware.',
  pre:['Message Brokers','ACID Transactions','Database Replication'],
  quiz:[{q:'An app saves an order and then publishes OrderCreated. It crashes between the two. What is the result?',o:['Both happen anyway','The order exists but no event was published, so other systems never learn about it','The database rolls back automatically'],a:1,why:'The database commit and the publish are separate operations with no shared transaction. This is the dual-write problem.',hint:'Two systems, two writes.'},
        {q:'How does the transactional outbox pattern fix that?',o:['It publishes the event before the database write','It writes the event as a row in the same database transaction as the order, and a relay publishes it afterwards','It removes the broker'],a:1,why:'Both rows commit atomically, so the event cannot be lost. The relay may publish it more than once, which idempotent consumers handle.',hint:'Use the one transaction you have.'}],
  terms:[['Dual write','Writing to two systems without a shared transaction.'],['Transactional outbox','An events table written in the same transaction as the data.'],['Write-ahead log','The database\'s ordered log of changes, which CDC reads.'],['Debezium','A widely used open-source CDC connector platform.']]});

/* ===== Phase 5: in-depth sections and senior interview questions ===== */

enrich('Pub/Sub',[
 {h:'Synchronous versus asynchronous',ul:['Synchronous: the caller waits for the answer; latency adds up along the chain and failures propagate.','Asynchronous: the caller hands off a message and continues; work happens later and failures are isolated.','Use synchronous calls when the caller needs the answer now (is the card valid?), asynchronous for side effects (send an email, update analytics).','Many flows mix both: validate synchronously, then publish an event for everything else.']},
 {h:'Events, commands and messages',ul:['Event: a fact in the past tense (OrderPlaced). Many subscribers, the publisher does not care who reacts.','Command: a request to do something (ChargeCard). Usually one handler, often on a queue.','Event notification carries an id; event-carried state transfer carries the data so subscribers need not call back.','Keep events small but sufficient; calling the publisher back for details re-creates coupling.']},
 {h:'Ordering and partitioning',ul:['Global ordering does not scale; most systems order per key (per order id, per user).','Choose the ordering key so related events land in the same partition.','Consumers that need cross-key ordering must use timestamps or versions and tolerate gaps.','Retries can reorder messages; include a version so consumers can ignore stale updates.']},
 {h:'Fan-out patterns',ul:['One topic, many subscriptions: each subscriber gets every message.','SNS to SQS style: a topic fans out into one queue per subscriber, so each consumes at its own pace with its own retries and DLQ.','Filtering on the subscription keeps subscribers from receiving irrelevant messages.','Very high fan-out (millions of devices) needs dedicated push systems, not one subscription per device.']},
 {h:'Operating event-driven systems',ul:['Correlation ids in every message so a request can be traced across subscribers.','Schema registry and compatibility rules (add optional fields, never rename) so publishers cannot break subscribers.','Monitor per-subscription backlog and age of oldest message.','Document who publishes and who consumes each topic; topics outlive the teams that created them.']}
],[
 {q:'When a user signs up, you must create the account, send a welcome email, start a trial in billing and add them to the CRM. Design the flow and explain which parts are synchronous.',cover:['Synchronous: validate input and create the account in one transaction; return to the user.','Publish UserSignedUp through an outbox; email, billing and CRM subscribe independently.','Each subscriber is idempotent (keyed by user id) and has retries and a DLQ.','Failure handling: if billing is down, signup still succeeds and the trial starts when it recovers; define whether that delay is acceptable.','Observability with a correlation id from the signup request.'],pitfalls:['Calling all four services inside the signup request.']},
 {q:'Subscribers need events for the same order in the order they happened. How do you guarantee it with a partitioned broker?',cover:['Use the order id as the partition or ordering key so all its events go to one partition.','One consumer per partition in a group processes them in sequence.','Retries must not skip ahead: block the key or park later events until the failing one succeeds.','Include a version so late or duplicate events can be detected and ignored.','Accept no ordering across different orders.'],pitfalls:['Assuming a topic is globally ordered.']},
 {q:'Your company has 200 topics and nobody knows who consumes what. A schema change broke three teams last month. What governance would you introduce?',lvl:'Staff+',cover:['Schema registry with compatibility checks in CI (backward and forward compatible changes only).','Topic catalog with owners, consumers, retention and data classification; automate from broker metadata.','Versioning policy: new event types or versioned topics for breaking changes, with deprecation windows.','Contract tests between producers and key consumers.','Ownership: producers own the contract; platform team owns the tooling and guardrails.'],pitfalls:['Solving it only with documentation that goes out of date.']}
]);

enrich('Message Queues',[
 {h:'Load leveling in numbers',ul:['Backlog grows at arrival rate minus processing rate.','Wait time for a new message is roughly backlog divided by processing rate.','A spike of 10 minutes at 400 extra per second leaves 240,000 messages, which drain only as fast as your spare capacity.','Set alerts on the age of the oldest message, not only queue length, because age reflects user impact.']},
 {h:'Competing consumers and scaling',ul:['Add identical workers to raise throughput; autoscale on backlog or age.','Prefetch limits stop one worker from hoarding many messages while others idle.','Downstream limits still apply: 100 workers can overload a database that 10 could not.','Ordering is lost across workers; use FIFO queues with message groups or partition by key when order matters.']},
 {h:'Visibility, acknowledgement and retries',ul:['A received message is hidden for the visibility timeout; set it longer than the normal processing time, and extend it for long jobs.','Retry with exponential backoff and jitter; use delayed redelivery rather than tight loops.','Every redelivery can duplicate work: handlers must be idempotent.','Separate transient errors (retry) from permanent ones (send to DLQ at once).']},
 {h:'Dead letter queues',ul:['After N failed attempts, move the message to a DLQ with its error and attempt count.','Alert on DLQ growth; it means lost work or a bug.','Provide tooling to inspect, fix and replay DLQ messages.','Do not let a DLQ become a silent graveyard; give it an owner.']},
 {h:'Queue choices',ul:['Managed queues (SQS, Google Cloud Tasks, Azure Service Bus) remove operations work.','RabbitMQ for rich routing, priorities and low latency.','Redis lists or streams for lightweight, lower-durability queues.','A log broker (Kafka) can act as a queue with consumer groups, but per-message retries and DLQs need extra work.']}
],[
 {q:'Design an image processing pipeline: users upload photos, and each needs thumbnails, face blurring and metadata extraction. Traffic is 10x higher in the evening.',cover:['Upload to object storage; publish a job message with the object key (not the image bytes).','Queue per task type or a fan-out to several queues; competing workers autoscaled on backlog and message age.','Idempotent workers (output path derived from input key); retries with backoff; DLQ with replay tooling.','Load leveling: accept the evening backlog within a target delay, scale workers, protect downstream storage.','Status tracking so the user sees progress; cost control by scaling to near zero at night.'],pitfalls:['Putting large images in messages or processing synchronously in the upload request.']},
 {q:'Messages in your queue are sometimes processed twice and occasionally never. Diagnose both.',cover:['Twice: visibility timeout shorter than processing time, crashes after work but before ack, or producer retries; fix with longer or extended timeouts and idempotent handlers.','Never: acknowledging before processing, messages expiring past retention, or failures going to a DLQ nobody watches.','Check metrics: redelivery counts, DLQ size, message age, consumer errors.','Add end-to-end reconciliation for critical work.'],pitfalls:['Trying to achieve exactly-once delivery instead of idempotent processing.']},
 {q:'A downstream payment provider allows 50 requests per second, but orders arrive at up to 500 per second at peak. Design the processing layer.',lvl:'Staff+',cover:['Queue orders for payment; consumers throttled globally to 50 per second (token bucket shared across workers, or a fixed number of workers with a rate limit).','Accept and acknowledge orders to the user as pending; notify on completion.','Priority handling for retries vs new orders; backoff on 429 from the provider; circuit breaker.','Idempotency keys on payment calls so retries never double charge.','Capacity: peak backlog and drain time; SLA for payment confirmation; alerting on age.'],pitfalls:['Scaling consumers with load and getting rate-limited or blocked by the provider.']}
]);

enrich('Message Brokers',[
 {h:'Queue brokers in depth',ul:['RabbitMQ: producers publish to exchanges (direct, topic, fanout, headers) that route to queues by bindings.','Per-message acknowledgement, requeue, priorities, TTL and dead-letter exchanges.','Quorum queues replicate with Raft for durability.','Best for task distribution and complex routing at moderate scale.']},
 {h:'Log brokers in depth',ul:['Kafka: topics split into partitions, each an append-only log replicated across brokers.','Producers choose the partition by key; order holds within a partition.','Consumer groups split partitions among members and commit offsets; rebalancing reassigns partitions when members join or leave.','Retention by time or size, or log compaction that keeps the latest value per key.']},
 {h:'Delivery guarantees',ul:['At-most-once: commit or ack before processing; possible loss.','At-least-once: commit after processing; possible duplicates. The usual choice.','Exactly-once: Kafka idempotent producers and transactions give exactly-once within Kafka read-process-write; side effects outside need idempotency.','Producer side: retries plus idempotent producer settings prevent duplicate appends.']},
 {h:'Durability and availability',ul:['Replication factor 3 with min.insync.replicas 2 and acks=all is a common Kafka setting for important data.','Unclean leader election trades data loss for availability; keep it off for critical topics.','Spread replicas across zones; plan for broker loss and partition reassignment.','Back up or mirror critical topics to another region if needed.']},
 {h:'Choosing a broker',ul:['Need replay, multiple independent consumers, very high throughput, stream processing: a log (Kafka, Pulsar, Kinesis).','Need per-message routing, priorities, delays, simple work queues: a queue broker (RabbitMQ, SQS).','Managed services cut operational load significantly.','Consider message size limits, latency targets, ordering needs and team experience.']}
],[
 {q:'Kafka or RabbitMQ for (a) an order event stream consumed by six services and (b) a job queue for sending emails with retries and priorities? Justify each.',cover:['(a) Kafka: multiple consumer groups read independently, replay for new consumers, ordering per order id, high throughput.','(b) RabbitMQ or SQS: per-message acks and retries, priorities, delayed retries and DLQs built in.','Mention that either can be bent to the other job at a cost.','Operational and managed-service considerations.'],pitfalls:['Picking one tool for everything without reasons.']},
 {q:'A Kafka consumer group is falling behind (lag grows every hour). How do you investigate and fix it?',cover:['Measure lag per partition: uniform lag means not enough capacity; one hot partition means key skew.','Check processing time per message, downstream slowness, rebalances, GC pauses, commit settings.','Fixes: add consumers up to the partition count, increase partitions (with care for ordering), batch downstream writes, fix hot keys, make processing asynchronous within the consumer.','Prevent: autoscaling on lag and alerts on lag growth rate.'],pitfalls:['Adding consumers beyond the number of partitions and expecting a speedup.']},
 {q:'Explain how you would build an exactly-once money transfer pipeline on top of a broker that offers at-least-once delivery.',lvl:'Staff+',cover:['Accept that delivery is at-least-once; aim for exactly-once effects.','Each transfer has a unique id; the consumer records processed ids in the same database transaction as the balance changes (inbox / dedup table).','Outputs are published through an outbox in the same transaction.','Ordering per account via partition key; versions to reject stale events.','Reconciliation jobs comparing ledgers to catch anything missed.'],pitfalls:['Relying on a broker\'s exactly-once setting to cover side effects in an external database.']}
]);

enrich('Change Data Capture (CDC)',[
 {h:'The dual-write problem',ul:['Database write plus broker publish, or database plus cache plus search, are separate operations.','Any crash, timeout or partial failure between them leaves the systems disagreeing, silently.','Retrying from the application cannot tell whether the first attempt happened.','Distributed transactions (two-phase commit) across a database and a broker are rarely available or worth it.']},
 {h:'Transactional outbox',ul:['Insert the business change and an outbox row (event type, payload, key) in one transaction.','A relay polls the outbox (or CDC reads it) and publishes, then marks rows sent or deletes them.','Publishing is at-least-once; include an event id for consumer deduplication.','Keep the outbox small: clean up sent rows; index by unsent and creation time.']},
 {h:'Log-based CDC',ul:['Reads the write-ahead log or binlog: low overhead on the database, captures every change including ones made outside the app.','Emits before and after images of rows with a log position, preserving commit order per table or key.','Initial snapshot then streaming; connectors resume from the last position after restarts.','Alternatives: trigger-based CDC (simple, adds write cost) and polling on updated_at (misses deletes and fast updates).']},
 {h:'Consumers of change streams',ul:['Search indexes, caches (invalidate on change), data warehouses and lakes, read models for CQRS, other services.','Idempotent upserts keyed by primary key with version checks.','Tombstones for deletes; compacted topics keep the latest state per key.','Schema evolution: database migrations become event schema changes for every consumer.']},
 {h:'Running CDC in production',ul:['Monitor connector lag from commit time to publish time.','A stalled connector can make the database retain log segments until disk fills; alert on replication slot size.','Plan re-snapshots, backfills and connector upgrades.','Restrict sensitive columns; CDC streams copy data, including personal data, to many places.']}
],[
 {q:'Your service updates PostgreSQL and then publishes to Kafka. Occasionally the search index is missing products. Explain the cause and give two fixes with trade-offs.',cover:['Dual write: crashes or publish failures after commit lose events; publishing first creates phantom events.','Outbox: same transaction, relay publishes; needs a relay and cleanup, keeps business-level events.','Log-based CDC (Debezium) on the tables or the outbox: no app changes for capture, but raw row events and operational care for slots and snapshots.','Either way: idempotent indexer with versions, a periodic reconciliation job, lag monitoring.'],pitfalls:['Adding retries in the app and calling it fixed.']},
 {q:'Design keeping Redis cache entries in sync with a database using CDC.',cover:['CDC stream of row changes; a consumer deletes or updates cache keys derived from the primary key.','Prefer delete over set to avoid writing stale values; use versions if setting.','Handle lag: TTLs as a bound; read-your-writes for the writer if needed.','Multiple keys per row (lists, aggregates) need a mapping from row to keys.','Failure: consumer down means stale cache until it catches up; alert on lag.'],pitfalls:['Treating CDC as instantaneous.']},
 {q:'You must split a monolith\'s database: the new Orders service will own order data, but the monolith still reads and writes it during migration. How do you use CDC and events to migrate safely?',lvl:'Staff+',cover:['Phase 1: CDC from the monolith tables builds the new service\'s store; the new service serves reads in shadow mode and compares.','Phase 2: switch writes to the new service; publish its changes back (outbox) so remaining monolith readers stay correct.','Avoid two writers for the same rows at once; a clear cutover per entity or tenant.','Idempotency, ordering by order id, and reconciliation reports at each phase.','Rollback plan and the point after which rollback is no longer possible.'],pitfalls:['Bidirectional sync with both sides writing the same rows, causing loops and conflicts.']}
]);

PHASES[5].iq=[
 {q:'Design the asynchronous backbone for an e-commerce platform: orders, payments, inventory, shipping, notifications and analytics. Choose brokers, topics and delivery semantics.',cover:['Events on a log broker per domain (orders, payments, inventory), partitioned by entity id; commands for work queues where per-message retry matters.','Outbox in each service for reliable publishing; idempotent consumers with dedup tables.','Saga for the order flow (reserve stock, charge, ship) with compensations; timeouts.','Notifications via queues with retries and DLQs; analytics reads the logs into a warehouse.','Schema registry, correlation ids, lag and DLQ alerting, replay procedures.'],pitfalls:['A single global topic, or synchronous calls disguised as events that wait for replies.']},
 {q:'Compare pub/sub, message queues, log brokers and CDC. For each, give a problem where it is the right tool and one where it is wrong.',cover:['Pub/sub: notify many subscribers of facts; wrong when the caller needs an answer.','Queue: distribute tasks to workers with retries; wrong when several consumers need every message or history.','Log broker: shared, replayable event streams at high volume; wrong for per-message priorities and delays.','CDC: reliably mirror database changes; wrong as a public API of business events without shaping.'],pitfalls:['Treating these as interchangeable names for the same thing.']},
 {q:'An event-driven system has grown to 40 services. Incidents now take hours to debug because nobody can see how an event flows. What do you change?',lvl:'Staff+',cover:['Correlation and causation ids in every message, propagated by shared libraries; distributed tracing across producers and consumers.','Event catalog generated from schemas and broker metadata: owners, producers, consumers.','Per-consumer dashboards: lag, error rate, DLQ size, processing time; alert routing to owners.','Replay and inspection tools for DLQs and topics with access controls.','Design review rules: avoid long event chains for critical user-facing flows; use orchestration where visibility matters.'],pitfalls:['Logging more without a way to connect the logs.']},
 {q:'A consumer bug corrupted data in a read model for three days. How do you recover, and how should the system have been designed to make this easy?',lvl:'Staff+',cover:['Fix the bug, then rebuild the read model by replaying events from a log broker with sufficient retention (new consumer group or reset offsets), into a new store, then swap.','If retention was too short, rebuild from the source of truth via a snapshot plus CDC.','Design: read models as disposable projections; retention or archived streams long enough to replay; idempotent projections; blue-green rebuilds.','Verify with reconciliation against the source before switching.'],pitfalls:['Patching corrupted rows by hand without a repeatable rebuild.']}
];
