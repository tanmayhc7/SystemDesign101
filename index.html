lesson(6,{key:'HeartBeats',short:'Heartbeats',tag:'Distributed 1 of 8',title:'Heartbeats: how a cluster knows who is alive',
  lead:'A heartbeat is a small periodic message that says "I am still alive". A monitor (or every peer) records when it last heard from each node, and if a node stays silent longer than a timeout, it is suspected dead: traffic is moved away, its work is reassigned, or a replacement is started.',
  more:['The hard part is that silence is ambiguous. A node that stopped sending heartbeats might have crashed, or it might be in a long garbage-collection pause, overloaded, or cut off by a network problem while still running. Across a network you cannot tell these apart. So failure detection is always a guess, and the timeout sets the trade-off: short timeouts detect real crashes quickly but raise false alarms; long timeouts are calm but leave a dead node receiving traffic for longer.',
    'Practical systems soften this. They require several missed heartbeats, not one. Adaptive detectors such as the phi accrual detector (used by Cassandra and Akka) learn the normal arrival pattern and output a suspicion level instead of a yes or no. Many systems combine heartbeats with indirect checks: if A cannot reach C, it asks B to try (as in the SWIM protocol), which separates "C is down" from "the link between A and C is down".',
    'False alarms are dangerous, not just wasteful. If a paused node is declared dead and its work is given to another node, the paused one may wake up and keep working too: two nodes doing the same job, or two leaders. That is why a failure detector must be paired with fencing (covered in Distributed Locking) or consensus, so a node that has been replaced cannot cause damage when it returns.'],
  demo:'heartbeat',takeaway:'Heartbeats detect failures by silence, which is always a guess. Tune the timeout between fast detection and false alarms, require several misses, and make sure a node wrongly declared dead cannot do harm when it comes back.',
  pre:['Availability','Failover'],
  quiz:[{q:'You lower the heartbeat timeout from 10 s to 1 s. What is the main risk?',o:['Crashes are detected more slowly','Pauses and network blips get mistaken for crashes, causing needless failovers','Heartbeats stop working'],a:1,why:'Short timeouts mean any brief silence looks like death. Unnecessary failovers cost capacity and can create duplicate workers.',hint:'What else causes silence besides a crash?'},
        {q:'Why can a monitor never be sure a silent node has crashed?',o:['Because heartbeats are encrypted','Because a crash, a long pause and a broken network link all look the same from outside','Because nodes lie'],a:1,why:'In an asynchronous network, a slow or unreachable node is indistinguishable from a dead one. Detectors can only suspect.',hint:'Think about what the monitor actually observes.'}],
  terms:[['Heartbeat','A periodic "I am alive" message.'],['Failure detector','The component that decides a node is suspected dead.'],['Phi accrual','An adaptive detector that outputs a suspicion level.'],['False positive','Declaring a healthy node dead.']]});

lesson(6,{key:'Service Discovery',short:'Discovery',tag:'Distributed 2 of 8',title:'Service discovery: finding the current address of a service',
  lead:'In a microservice system, instances start, stop, move and scale all the time, so hard-coded addresses do not work. Service discovery keeps a live list of where each service\'s healthy instances are, and gives callers a way to find them.',
  more:['A service registry is the list. Instances register when they start (or a platform such as Kubernetes registers them), send heartbeats or are health-checked, and are removed when they stop or fail. Consul, etcd, ZooKeeper and Eureka are common registries; Kubernetes uses its own API and endpoints. The registry must itself be highly available, which is why these systems are built on consensus.',
    'There are two ways to use it. In client-side discovery, the caller asks the registry (or keeps a cached copy) and picks an instance itself, which allows smart load balancing but puts logic in every client library. In server-side discovery, the caller sends to a stable name or load balancer (a Kubernetes Service, an AWS load balancer, a service mesh sidecar), which picks the instance. DNS is the simplest form, but DNS caching and TTLs make it slow to react to change.',
    'Discovery is only as fresh as its slowest cache. A crashed instance stays in callers\' lists until the registry notices (health check or missed heartbeats) and callers refresh. So clients must still use timeouts, retry on another instance, and handle connection errors. Health checks should test whether an instance can really serve (readiness), not just whether the process is running (liveness).'],
  demo:'discovery',takeaway:'A registry tracks healthy instances; callers find them directly or through a load balancer. Expect stale entries: use health checks, short cache lifetimes, timeouts and retries on another instance.',
  pre:['Load Balancing','Domain Name System (DNS)','HeartBeats'],
  quiz:[{q:'An instance crashes without deregistering. Why do some requests still go to it for a while?',o:['The registry is broken','The registry and the clients\' cached lists take time to notice and refresh','Load balancers prefer dead instances'],a:1,why:'Health checks run periodically and clients cache the list. Until both update, the dead address is still used, so callers need retries.',hint:'Count the caches between the crash and the caller.'},
        {q:'What is the difference between a liveness and a readiness check?',o:['They are the same','Liveness: is the process running; readiness: can it serve traffic right now (dependencies up, warmed up)','Readiness only applies to databases'],a:1,why:'A process can be alive but not ready, for example while loading data. Routing traffic should depend on readiness.',hint:'Alive is not the same as useful.'}],
  terms:[['Service registry','A live list of service instances and their addresses.'],['Client-side discovery','The caller looks up instances and chooses one.'],['Server-side discovery','A load balancer or proxy chooses the instance.'],['Readiness check','A check that an instance can serve requests now.']]});

lesson(6,{key:'Consensus Algorithms',short:'Consensus',tag:'Distributed 3 of 8',title:'Consensus: getting several machines to agree',
  lead:'Consensus lets a group of machines agree on a value, or on the order of a log of commands, even when some of them crash or the network drops messages. It is the foundation of leader election, replicated configuration stores (etcd, ZooKeeper, Consul) and strongly consistent databases (Spanner, CockroachDB).',
  more:['Raft, the most widely taught algorithm, works like this. One node is the leader. Clients send writes to the leader, which appends them to its log and sends them to followers. An entry is committed once a majority of nodes have stored it, and only then is it applied and acknowledged. If followers stop hearing from the leader, one of them times out (at a random moment, to avoid ties), increases the term number, and asks for votes. It wins with a majority, and only a node with an up-to-date log can win, so committed entries are never lost. Paxos solves the same problem with a different structure and is used in systems such as Chubby and Spanner.',
    'Majorities are the key idea. With five nodes, a majority is three, so the cluster survives two failures. Any two majorities share at least one node, which is why two leaders cannot both commit conflicting entries in the same term. The price is availability during partitions: the side of a split that holds only a minority cannot commit anything. Consensus systems are CP: they choose consistency over availability.',
    'Consensus is expensive, so you use it for small, critical state: who the leader is, cluster membership, configuration, locks, and the metadata of larger systems. Each write needs a round trip to a majority, so clusters are usually 3 or 5 nodes (more nodes means slower writes, not more speed), placed in different failure domains. Application data is then replicated by simpler means, coordinated by that small consensus core.'],
  demo:'raft',takeaway:'Consensus (Raft, Paxos) keeps a replicated log consistent through crashes by committing only with a majority. Use 3 or 5 nodes, expect the minority side of a partition to stop accepting writes, and keep the consensus layer for small, critical state.',
  pre:['CAP Theorem','Database Replication','HeartBeats'],
  quiz:[{q:'A 5-node Raft cluster has 2 nodes down. Can it still accept writes?',o:['No, all 5 are needed','Yes, 3 of 5 is a majority','Only reads are possible'],a:1,why:'Raft needs a majority (3 of 5) to elect a leader and commit entries, so it tolerates 2 failures.',hint:'Majority of 5.'},
        {q:'Why is a 4-node consensus cluster rarely used?',o:['It cannot elect a leader','It tolerates only 1 failure, the same as 3 nodes, but needs more machines and acknowledgements','Even numbers are slower to hash'],a:1,why:'A majority of 4 is 3, so only one node can fail, exactly like a 3-node cluster, with more cost and write latency.',hint:'Compute the tolerated failures for 3, 4 and 5.'}],
  terms:[['Quorum / majority','More than half of the nodes; needed to decide.'],['Term','Raft\'s election counter; a higher term wins.'],['Leader election','Choosing the single node that orders writes.'],['Split brain','Two nodes acting as leader at once; majorities prevent it.']]});

lesson(6,{key:'Distributed Locking',short:'Locks',tag:'Distributed 4 of 8',title:'Distributed locking: one worker at a time across machines',
  lead:'A distributed lock makes sure only one process across many machines does something at a time: runs a nightly job, processes one customer\'s account, or writes one file. Locks are granted by a shared service, such as Redis, ZooKeeper, etcd or a database row, with a lease that expires so a crashed holder cannot block everyone forever.',
  more:['Leases create a subtle danger. Client A takes the lock with a 10-second lease, then pauses for 15 seconds (a garbage collection, a slow disk, a frozen VM). Its lease expires, client B takes the lock, and then A wakes up still believing it holds the lock. Both write. No lease length fixes this, because a pause can always be longer. Clocks also drift, so time-based reasoning across machines is fragile.',
    'The fix is a fencing token: a number that increases with every lock grant. The client sends its token with every write, and the protected resource remembers the highest token it has seen and rejects anything lower. A stale holder\'s write then fails instead of corrupting data. ZooKeeper (sequential nodes), etcd (revisions) and databases (a version column) can provide such tokens. A plain Redis lock with SET NX and a TTL is fine for efficiency (avoiding duplicate work that is harmless) but not for correctness.',
    'Before reaching for a lock, ask whether you need one. Often a database constraint, an atomic conditional update, an idempotent operation, or partitioning work so each item has one owner (for example by queue partition) gives the same safety with fewer moving parts. When you do use a lock, keep critical sections short, always set a lease, renew it while working, and design for the lock service being unavailable.'],
  demo:'dlock',takeaway:'Locks with leases can be held by two clients at once after a pause. For correctness, have the protected resource check a fencing token; for mere efficiency a simple lease is enough. Prefer designs that avoid locks.',
  pre:['Consensus Algorithms','ACID Transactions'],
  quiz:[{q:'A client\'s lease expired during a long pause, and another client took the lock. What stops the first client\'s late write from corrupting data?',o:['A longer lease','A fencing token checked by the storage, which rejects writes with an older token','Synchronised clocks'],a:1,why:'Only the resource itself can reliably reject stale writers. Leases and clocks cannot rule out long pauses.',hint:'Who should do the final check?'},
        {q:'When is a simple Redis lock with a TTL acceptable?',o:['Never','When the lock only prevents duplicate work that would be harmless if it happened occasionally','For bank transfers'],a:1,why:'For efficiency locks, a rare double run costs a little extra work. For correctness, you need fencing or a different design.',hint:'What happens if two holders ever overlap?'}],
  terms:[['Lease','A lock that expires automatically after a set time.'],['Fencing token','An increasing number sent with writes so stale lock holders are rejected.'],['Critical section','Work that must not run concurrently.'],['Process pause','A stall (GC, VM suspend) during which a process does nothing.']]});

lesson(6,{key:'Gossip Protocol',short:'Gossip',tag:'Distributed 5 of 8',title:'Gossip: spreading information like a rumour',
  lead:'In a gossip protocol, each node periodically picks a few random peers and exchanges what it knows: which nodes are alive, cluster membership, configuration or small pieces of state. News spreads like a rumour, reaching every node in a number of rounds that grows only with the logarithm of the cluster size.',
  more:['Gossip has no central coordinator, so there is nothing single to fail or overload. Each node sends a fixed number of messages per round, so load per node stays flat as the cluster grows, and losing messages or nodes only slows the spread a little because information arrives along many paths. With a fanout of 2 or 3, a cluster of 1,000 nodes is usually fully informed in about 10 rounds.',
    'The trade-off is that gossip is eventually consistent: different nodes hold different views for a short time, and you cannot know exactly when everyone has heard. That is fine for membership, failure suspicion and metadata, and not for things that need agreement (use consensus for those). Gossip is used for membership and failure detection in Cassandra, Consul (Serf, based on SWIM), Redis Cluster and DynamoDB-style stores, and for anti-entropy: nodes periodically compare data summaries (often Merkle trees) and repair differences.',
    'Design details that matter: messages carry version numbers or heartbeat counters so newer information wins; nodes remember suspected failures and spread them too; and the gossip interval and fanout trade bandwidth for speed. Very large clusters may gossip within groups and summarise between them.'],
  demo:'gossip',takeaway:'Gossip spreads information to N nodes in about log N rounds with constant work per node and no coordinator. Use it for membership, failure detection and anti-entropy where eventual consistency is acceptable.',
  pre:['HeartBeats','Consistent Hashing'],
  quiz:[{q:'A gossip cluster grows from 500 to 1,000 nodes. Roughly how does the time to spread an update change?',o:['It doubles','It grows by about one round','It stays exactly the same'],a:1,why:'Spread time is proportional to log N. Doubling N adds about one round.',hint:'log2(1000) minus log2(500).'},
        {q:'Which is a poor use of gossip?',o:['Spreading cluster membership','Detecting failed nodes','Deciding which single node is the leader with a strict guarantee'],a:2,why:'Gossip gives eventual agreement only. Strict single-leader decisions need consensus.',hint:'Which one needs everyone to agree at once?'}],
  terms:[['Fanout','How many peers each node contacts per round.'],['Anti-entropy','Background comparison and repair of replicas.'],['SWIM','A gossip-based membership and failure detection protocol.'],['Eventual consistency','All nodes converge if updates stop.']]});

lesson(6,{key:'Circuit Breaker',short:'Circuit Breaker',tag:'Distributed 6 of 8',title:'Circuit breakers and resilience: failing fast to survive',
  lead:'When a service you depend on is failing, calling it again and again makes things worse: your threads wait on timeouts, your own callers back up, and the struggling service gets no room to recover. A circuit breaker watches the failure rate and, past a threshold, stops calling for a while and fails immediately, usually with a fallback.',
  more:['A breaker has three states. Closed: calls pass through while failures are counted over a rolling window. Open: once failures pass a threshold (for example 50% of the last 20 calls), calls fail at once without touching the downstream, for a cool-down period. Half-open: after the cool-down, a few trial calls go through; if they succeed the breaker closes, otherwise it opens again. Failing fast keeps threads and connections free, and the fallback (cached data, a default value, a reduced page) keeps the user experience partly working.',
    'Breakers work together with other resilience patterns. Timeouts on every remote call, set from the downstream\'s real latency, so nothing waits forever. Retries only for transient errors and idempotent calls, with exponential backoff and jitter so clients do not retry in lockstep, and with a retry budget so retries cannot multiply through layers into a retry storm. Bulkheads give each dependency its own limited pool of threads or connections, so one slow dependency cannot use them all. Load shedding rejects low-priority work when overloaded, and graceful degradation turns off optional features (recommendations, reviews) to protect the core (checkout).',
    'The goal is to contain failures. In a chain of services, one slow dependency without timeouts or breakers can exhaust resources upstream and take down everything that calls it: a cascading failure. Libraries and meshes implement these patterns (Resilience4j, Polly, Envoy, Istio), but the important decisions (thresholds, timeouts, what the fallback is) are product decisions that need to be tested, for example with fault injection.'],
  demo:'breaker',takeaway:'Put a timeout on every call, retry sparingly with backoff, jitter and a budget, isolate dependencies with bulkheads, and use circuit breakers with fallbacks so one failing service does not take others down with it.',
  pre:['Fault Tolerance','Rate limiting','Idempotency'],
  quiz:[{q:'Three layers of services each retry a failed call 3 times. The bottom service is overloaded. How many calls can one user request cause at the bottom?',o:['4','12','64'],a:2,why:'Each layer makes up to 4 attempts per call it receives: 4 x 4 x 4 = 64. Retries multiply through layers, so retry at one layer with a budget.',hint:'Attempts per layer is retries plus one.'},
        {q:'What does a circuit breaker do in the open state?',o:['Sends all traffic to the downstream service','Fails calls immediately, usually returning a fallback, without calling the downstream','Restarts the downstream service'],a:1,why:'Open means stop calling for a cool-down period. That frees resources and gives the downstream time to recover.',hint:'An open electrical circuit carries no current.'}],
  terms:[['Circuit breaker','Stops calls to a failing dependency for a while.'],['Bulkhead','Separate resource pools so one dependency cannot exhaust all of them.'],['Jitter','Randomness added to retry delays to avoid synchronised retries.'],['Cascading failure','One failure spreading through services that depend on it.']]});

lesson(6,{key:'Disaster Recovery',short:'Disaster Recovery',tag:'Distributed 7 of 8',title:'Disaster recovery: surviving the loss of a whole region',
  lead:'Disaster recovery is the plan for losing far more than one server: a data center, a cloud region, or your data itself (corruption, deletion, ransomware). It is measured by two numbers. RPO (recovery point objective) is how much data you can afford to lose, measured in time. RTO (recovery time objective) is how long you can afford to be down.',
  more:['Strategies trade cost against those numbers. Backup and restore copies backups to another region and rebuilds after a disaster: cheapest, with RPO equal to the backup interval and RTO of hours. Pilot light replicates data continuously and keeps minimal infrastructure ready to scale up: RPO of seconds to minutes, RTO of tens of minutes. Warm standby runs a smaller full copy that can take traffic quickly: RTO of minutes. Multi-site active-active serves users from several regions at once: RPO and RTO near zero, at the highest cost and complexity (conflicts, data placement, consistency across regions).',
    'Replication is not a backup. A bad deploy, an accidental DROP TABLE or ransomware is copied to every replica within seconds. You also need point-in-time recovery (backups plus the write-ahead log), immutable or offline copies that an attacker or a bad script cannot delete, and retention long enough to notice slow corruption.',
    'A plan that has never been tested is a hope. Run regular recovery drills: restore backups into a clean environment and check the data, fail over a region on purpose, and time it. Automate failover where you can, write runbooks for the rest, and include the things people forget: DNS TTLs, secrets and certificates in the other region, capacity quotas, and dependencies on third-party services that live in the failed region.'],
  demo:'dr',takeaway:'Set RPO and RTO per system from business needs, then choose the cheapest strategy that meets them. Keep backups separate from replication, and prove recovery with regular drills.',
  pre:['Database Replication','Failover','Availability'],
  quiz:[{q:'A database is replicated synchronously to another region. An engineer accidentally deletes a table. What protects you?',o:['The replica, it has a copy','Point-in-time backups, because the deletion was replicated instantly','Nothing can help'],a:1,why:'Replication copies mistakes too. Backups plus the change log let you restore to just before the deletion.',hint:'What did the replica receive?'},
        {q:'Backups run every 12 hours and restoring takes 3 hours. What are the RPO and RTO in the worst case?',o:['RPO 3 h, RTO 12 h','RPO up to 12 h, RTO about 3 h (plus detection and decision time)','Both zero'],a:1,why:'You can lose everything since the last backup (up to 12 h) and you are down while restoring (about 3 h, plus time to notice and decide).',hint:'RPO is about data, RTO about time down.'}],
  terms:[['RPO','Maximum acceptable data loss, measured in time.'],['RTO','Maximum acceptable downtime.'],['Pilot light / warm standby','DR setups with minimal or reduced infrastructure ready in a second region.'],['Point-in-time recovery','Restoring a database to any moment using backups plus logs.']]});

lesson(6,{key:'Distributed Tracing',short:'Tracing',tag:'Distributed 8 of 8',title:'Distributed tracing: following one request through many services',
  lead:'In a microservice system one user request can touch dozens of services. When it is slow or fails, logs from each service show only their own piece. Distributed tracing records the whole journey: every step is a span with a start time and duration, all spans of a request share a trace id, and a viewer shows them as a timeline.',
  more:['Context propagation makes it work. The first service creates a trace id and a span id and passes them on in request headers (the W3C traceparent standard) and in message metadata for queues. Each downstream service creates child spans that point to their parent. OpenTelemetry is the standard way to instrument code and export spans to back ends such as Jaeger, Zipkin, Tempo or commercial tools.',
    'A trace answers questions logs and metrics cannot: which service on the critical path is slow, which calls run in sequence that could run in parallel, where retries or N+1 calls hide, and how a failure in one service shows up upstream. The same ids also tie the pieces together: putting the trace id (or a correlation id) into every log line and error report lets you jump from a metric spike to an example trace to the exact logs.',
    'Tracing everything is expensive, so systems sample. Head-based sampling decides at the start (for example keep 1%), which is cheap but may miss the rare slow request. Tail-based sampling decides after the trace finishes and keeps all errors and slow traces, at the cost of buffering spans. Keep span attributes useful but free of sensitive data, and watch overhead in hot paths.'],
  demo:'trace',takeaway:'Propagate a trace context through every call and message, record spans with OpenTelemetry, and put the trace id in logs. Use sampling that keeps errors and slow requests, and read traces to find the critical path.',
  pre:['APIs','Latency vs Throughput vs Bandwidth'],
  quiz:[{q:'What lets spans from five different services be shown as one trace?',o:['They run on the same machine','A shared trace id passed along in request headers, with each span recording its parent','Synchronised clocks only'],a:1,why:'Context propagation carries the trace id and parent span id with every call, so the back end can rebuild the tree.',hint:'What travels with the request?'},
        {q:'You sample 1% of traces at the start of each request, and the problem is a rare timeout. What is the risk?',o:['None','The few slow requests are likely not sampled; tail-based sampling that keeps slow and failed traces fixes this','Sampling makes requests slower'],a:1,why:'Head-based sampling decides before knowing the outcome. Tail-based sampling keeps the interesting traces.',hint:'When is the decision made?'}],
  terms:[['Trace','The full record of one request across services.'],['Span','One timed operation within a trace, with a parent.'],['Context propagation','Passing trace ids along with calls and messages.'],['Sampling','Recording only some traces to control cost.']]});

/* ===== Phase 6: in-depth sections and senior interview questions ===== */

enrich('HeartBeats',[
 {h:'Push, pull and peer-to-peer',ul:['Push: nodes send heartbeats to a monitor or coordinator.','Pull: the monitor polls health endpoints (load balancer health checks).','Peer-to-peer: nodes check each other, often via gossip, with no central monitor.','Leases: a node holds a lease it must renew; failing to renew is the heartbeat signal.']},
 {h:'Choosing interval and timeout',ul:['Interval sets bandwidth and detection granularity; timeout is usually several intervals.','Detection time is roughly the timeout plus the time to act on it.','Timeouts must exceed normal worst-case pauses (GC, network jitter) to avoid flapping.','Separate the heartbeat path from heavy work so overload does not delay heartbeats.']},
 {h:'Better failure detectors',ul:['Phi accrual: models heartbeat arrival times and outputs a suspicion value; the threshold is tunable.','SWIM: direct probe, then indirect probes through other members, then suspicion before confirming death.','Require agreement from several observers before declaring a node dead.','Flap damping: do not let a node bounce in and out of the cluster.']},
 {h:'What happens after detection',ul:['Remove the node from load balancing and discovery.','Reassign its partitions, leases or leadership.','Fence it so it cannot act if it returns (epoch numbers, fencing tokens, STONITH in clusters).','Start a replacement, and avoid replacing too many nodes at once on a network blip.']},
 {h:'Limits of failure detection',ul:['In an asynchronous network a perfect detector is impossible; you can only suspect.','Partial failures (slow disk, half-working node) pass simple heartbeats; add health checks that exercise real work.','A process can heartbeat fine while its main work is stuck; tie heartbeats to progress when it matters.','Correlated failures (a whole zone) need capacity planning, not just detection.']}
],[
 {q:'Design failure detection for a 2,000-node storage cluster. A false positive costs a 2 TB re-replication.',cover:['Avoid a central monitor; use SWIM-style probing with indirect checks and gossip of suspicions.','Phi accrual or multi-miss thresholds tuned to observed GC and network behaviour.','Two-stage response: mark suspect (stop routing new writes) quickly, start re-replication only after a longer grace period.','Rate-limit re-replication and stop if many nodes fail together (likely a network or zone issue).','Fencing with epochs so a returning node does not serve stale data.'],pitfalls:['Triggering expensive recovery on the first missed heartbeat.']},
 {q:'A service is marked healthy by its health check but returns errors for 30% of requests. Why, and how would you change health checking?',cover:['Liveness checks only prove the process runs; dependencies or a stuck thread pool can still fail real requests.','Readiness checks that test critical dependencies cheaply; outlier detection in the load balancer based on real error rates.','Avoid deep checks that cascade (every service checking every dependency) and overload them.','Use passive health from traffic plus active checks.'],pitfalls:['Making the health check call every downstream service.']},
 {q:'Explain how a GC pause can create two leaders, and how a well-designed system prevents damage.',lvl:'Staff+',cover:['Leader pauses longer than the election timeout; followers elect a new leader with a higher term.','Old leader resumes and, until it learns the new term, may try to act.','Prevention: consensus rejects its messages (stale term); external resources check fencing tokens or epochs; leases checked against a monotonic clock with safety margins.','Leaders should verify their leadership (read index or lease) before serving linearizable reads.'],pitfalls:['Claiming leases alone prevent this.']}
]);

enrich('Service Discovery',[
 {h:'Registration patterns',ul:['Self-registration: the instance registers itself and renews with heartbeats.','Third-party registration: the platform (Kubernetes, a registrar) watches instances and registers them.','Deregister on graceful shutdown, and expire on missed heartbeats for crashes.','Metadata in the registry: version, zone, weight, tags for routing.']},
 {h:'Client-side discovery',ul:['Client library looks up instances and balances across them (Netflix Ribbon and Eureka, gRPC with xDS).','Enables zone-aware routing, least-request balancing, and retries to another instance.','Every language needs the library; upgrades are harder.','Cache the instance list and watch for changes rather than querying per request.']},
 {h:'Server-side discovery and meshes',ul:['Caller uses a stable virtual address; a load balancer or proxy resolves instances.','Kubernetes Services and kube-proxy, cloud load balancers, and DNS-based discovery.','Service meshes (Envoy, Istio, Linkerd) put a sidecar proxy beside each service for discovery, retries, mTLS and telemetry.','Simpler clients, but an extra hop and more infrastructure to run.']},
 {h:'DNS as discovery',ul:['Simple and universal: SRV or A records per service.','TTL caching delays updates; some clients ignore TTLs entirely.','Limited health awareness and load balancing (round robin at best).','Good for coarse-grained discovery between systems, weaker for fast-changing instances.']},
 {h:'Reliability of the registry',ul:['The registry is critical: run it as a consensus cluster across zones.','Clients should keep working with the last known list if the registry is unavailable.','Guard against mass deregistration (Eureka self-preservation) during network problems.','Watch registry load from very frequent heartbeats in large fleets.']}
],[
 {q:'Your company is moving 300 services from static config files to dynamic discovery. Choose an approach and plan the migration.',cover:['Platform choice: Kubernetes Services plus DNS for most, or a mesh if you need retries, mTLS and traffic shifting uniformly.','Registry high availability and client caching of last known state.','Readiness checks and graceful shutdown (deregister, drain) in every service.','Incremental migration: dual-publish addresses, move callers service by service, keep fallbacks.','Observability for routing decisions and stale-endpoint errors.'],pitfalls:['Making every request depend on a live registry lookup.']},
 {q:'During a deploy, clients see errors for about 30 seconds as old instances stop. Fix it.',cover:['Graceful shutdown: fail readiness first, wait for registries and load balancers to remove the instance, drain in-flight requests, then exit.','Shorter registry and client cache refresh, or push-based updates.','Client retries on connection errors to another instance (safe for idempotent calls).','Rolling deploys with surge capacity so enough instances remain ready.'],pitfalls:['Killing processes immediately on deploy.']},
 {q:'Compare client-side load balancing in a library with a sidecar service mesh for a polyglot organisation. When is a mesh worth its cost?',lvl:'Staff+',cover:['Library: no extra hop, rich control, but per-language implementations and upgrade coordination.','Mesh: uniform features (mTLS, retries, outlier detection, traffic shifting, telemetry) without code changes, at the cost of latency, resources and operational complexity.','Worth it with many languages, strict security needs, or heavy traffic management; not for a small homogeneous fleet.','Consider proxyless options (gRPC xDS) as a middle ground.'],pitfalls:['Adopting a mesh with no team to operate it.']}
]);

enrich('Consensus Algorithms',[
 {h:'Raft in more detail',ul:['Leader election: randomised election timeouts, votes granted only to candidates with logs at least as up to date.','Log replication: AppendEntries with the previous index and term so followers detect and repair gaps.','Commit rule: an entry from the current term is committed when stored on a majority.','Membership changes use joint consensus or one-at-a-time changes to avoid two majorities.','Snapshots compact the log.']},
 {h:'Paxos and friends',ul:['Basic Paxos agrees on one value with prepare and accept phases; Multi-Paxos keeps a stable leader for a log.','Zab (ZooKeeper) and Viewstamped Replication are close relatives.','EPaxos and others reduce leader bottlenecks at the cost of complexity.','Byzantine consensus (PBFT, blockchains) tolerates malicious nodes and needs 3f+1 nodes.']},
 {h:'Reads and linearizability',ul:['A write is linearizable once committed by a majority.','Reads from a follower may be stale; linearizable reads go through the leader with a read index or a lease check.','Leader leases speed up reads but depend on bounded clock drift.','Many systems offer both strong and stale-but-fast reads.']},
 {h:'Sizing and placement',ul:['3 nodes tolerate 1 failure, 5 tolerate 2, 7 tolerate 3; more nodes add write latency.','Place nodes in different zones; for region failure tolerance, spread across 3 regions.','Write latency is bounded below by the round trip to the closest majority.','Use observers or learners for read scaling without joining the voting quorum.']},
 {h:'Where consensus is used',ul:['Coordination services: ZooKeeper, etcd, Consul.','Databases: Spanner, CockroachDB, TiDB, YugabyteDB replicate each data range with Raft or Paxos.','Kafka KRaft and Kubernetes (via etcd) for cluster metadata.','Leader election for any singleton job, through these services rather than hand-rolled.']}
],[
 {q:'Explain how Raft guarantees that a committed entry is never lost, even if the leader crashes right after committing.',cover:['Commit requires storage on a majority.','Elections require a majority vote, and voters reject candidates with less up-to-date logs.','Any electing majority overlaps the committing majority in at least one node, which holds the entry and blocks out-of-date candidates.','So the new leader has the entry and will replicate it.'],pitfalls:['Saying the leader persists to disk so it is safe.']},
 {q:'Your etcd cluster for Kubernetes is spread across two data centers, three nodes in one and two in the other. What happens if the link between them fails, and how should it be deployed?',cover:['The side with 3 nodes keeps a majority and continues; the other side cannot commit.','If the 3-node data center itself fails, the cluster is unavailable: two sites cannot tolerate one site loss.','Use three failure domains (for example 2-2-1 across three sites) to survive any single site loss.','Consider latency between sites for write performance.'],pitfalls:['Thinking an even split across two sites is fault tolerant.']},
 {q:'Design leader election for a singleton job scheduler running in three regions, including what happens during partitions and long pauses.',lvl:'Staff+',cover:['Use a consensus-backed lock or lease (etcd, ZooKeeper) across three regions rather than custom heartbeats.','Leader holds a lease and renews; a leader that cannot renew steps down before the lease expires (with clock drift margin).','Fencing: every job dispatch carries the leadership epoch; workers and stores reject older epochs.','Partition: only the side with the majority keeps or elects a leader; the minority stops scheduling.','Idempotent jobs so a rare double dispatch is harmless; monitoring of leadership changes.'],pitfalls:['Electing a leader by the lowest node id seen via heartbeats.']}
]);

enrich('Distributed Locking',[
 {h:'Ways to implement a lock',ul:['Database: a row with a unique constraint or SELECT FOR UPDATE; advisory locks in PostgreSQL.','Redis: SET key value NX PX ttl, release only if the value matches (Lua script).','ZooKeeper: ephemeral sequential nodes, waiters watch their predecessor; the node vanishes if the session dies.','etcd: leases plus transactions on revisions; the revision serves as a fencing token.']},
 {h:'Leases, renewals and clocks',ul:['Always use a lease so a crashed holder releases eventually.','Renew in the background well before expiry, and stop work if renewal fails.','Clocks drift and jump; leases depend on elapsed time being roughly the same on different machines.','A process cannot detect its own pause reliably, so it cannot know it lost the lock in time.']},
 {h:'Fencing tokens',ul:['Every grant returns a strictly increasing token.','The protected resource stores the highest token seen and rejects lower ones.','Requires the resource to participate; works naturally with databases (conditional updates) and storage that supports preconditions.','Without it, locks give mutual exclusion only in the absence of pauses.']},
 {h:'Efficiency versus correctness locks',ul:['Efficiency: avoid doing the same work twice (sending a report twice is annoying but tolerable). A simple lease lock is fine.','Correctness: overlapping holders corrupt data or money. Needs consensus-backed locks plus fencing, or a lock-free design.','Redlock (multi-node Redis) has been debated precisely because it lacks fencing and relies on timing.']},
 {h:'Avoiding locks',ul:['Partition work so each key has one owner (Kafka partitions, consistent hashing).','Optimistic concurrency with version checks.','Atomic conditional updates and unique constraints in the database.','Idempotent operations so duplicates are harmless.','Queues with exactly one consumer per message group.']}
],[
 {q:'A cron job runs on 5 servers for redundancy and must send a monthly invoice exactly once per customer. Design it.',cover:['Elect one runner via a lease lock, but do not rely on it for correctness.','Correctness from idempotency: an invoices table with a unique key (customer, month); insert before sending; skip if exists.','Sending through an outbox so a crash between insert and send is retried, with the provider\'s idempotency key.','Monitoring of missed runs; the lock only reduces duplicate effort.'],pitfalls:['Trusting a Redis lock to guarantee exactly once.']},
 {q:'Walk through what can go wrong with a Redis SET NX lock with a 30-second TTL protecting writes to a shared file.',cover:['Holder pauses beyond 30 s; another client acquires; both write.','Releasing someone else\'s lock if release does not check the value.','Redis failover with asynchronous replication can lose the lock key; two holders.','Mitigations: fencing tokens checked by storage, consensus-backed lock service, or redesign to avoid the shared file.'],pitfalls:['Only suggesting a longer TTL.']},
 {q:'Design a lock service used by hundreds of teams. What guarantees and API would you offer?',lvl:'Staff+',cover:['Built on consensus (Raft) across zones; sessions with keepalives and leases.','API: acquire with lease, renew, release, and a fencing token (monotonic revision) on every grant.','Document that correctness requires fencing at the resource; provide client libraries that make it easy.','Fairness and waiting (watch predecessors), limits per tenant, metrics on contention and hold times.','Guidance to prefer partitioning and idempotency; review high-volume use cases.'],pitfalls:['Offering locks without tokens and leaving teams to discover pauses in production.']}
]);

enrich('Gossip Protocol',[
 {h:'How gossip rounds work',ul:['Every interval, each node picks k random peers.','Push: send what you know. Pull: ask what they know. Push-pull: exchange both ways; fastest convergence.','State carries versions or heartbeat counters; the higher version wins.','Rounds to reach everyone grow with log N; messages per node per round stay constant.']},
 {h:'Membership and failure detection',ul:['Each node keeps a membership list with heartbeat counters gossiped around.','A node whose counter stops increasing for a while is suspected, then removed.','SWIM separates probing (direct and indirect) from dissemination (piggybacked on probe messages).','Lifeguard and similar extensions reduce false positives from slow nodes.']},
 {h:'Anti-entropy and repair',ul:['Replicas periodically compare data and fix differences in the background.','Merkle trees summarise ranges of keys so only differing branches are exchanged.','Read repair fixes stale replicas when a read notices disagreement.','Hinted handoff stores writes for an unreachable node and delivers them later.']},
 {h:'Strengths and limits',ul:['No single point of failure, scales to thousands of nodes, tolerant of message loss.','Eventual consistency: no guarantee of when everyone knows.','Bandwidth grows with state size; keep gossiped state small.','Not suitable for decisions that need agreement; combine with consensus.']},
 {h:'Where you meet it',ul:['Cassandra and ScyllaDB membership and schema agreement.','Consul and Serf (SWIM) membership.','Redis Cluster bus for node state.','Epidemic broadcast in large peer-to-peer and blockchain networks.']}
],[
 {q:'How many rounds and messages does it take to spread an update to 10,000 nodes with fanout 3? How would you speed it up?',cover:['Rounds roughly log base (1+fanout) of N plus a tail, so around 7 to 10 rounds.','Messages per round grow as more nodes know, up to N x fanout; total messages on the order of N x fanout x rounds, often reduced by stopping after a node has gossiped a few times.','Speed: push-pull, higher fanout, shorter interval, or a hierarchical design.','Trade-off with bandwidth.'],pitfalls:['Saying it takes N rounds.']},
 {q:'Your gossip-based cluster keeps marking healthy nodes dead during traffic peaks. Why, and what do you change?',cover:['Gossip and probe messages are delayed by CPU or network saturation, so heartbeats look missed.','Prioritise or isolate gossip traffic (separate thread, network class).','Use indirect probes and suspicion periods; adaptive detectors; scale timeouts with load.','Investigate why nodes are saturated; avoid cascading removals.'],pitfalls:['Only increasing the timeout without fixing saturation.']},
 {q:'Design how a Dynamo-style key-value store uses gossip, hinted handoff and Merkle trees together. What consistency do clients get?',lvl:'Staff+',cover:['Gossip for membership, ring ownership and failure suspicion.','Writes to N replicas with quorum W; unavailable replicas get hinted handoff (sloppy quorum).','Background anti-entropy with Merkle trees per key range; read repair on quorum reads.','Clients get eventual consistency, tunable with R and W; conflicts resolved with vector clocks or last-write-wins.','Trade-offs: availability during partitions versus stale reads and conflict handling.'],pitfalls:['Claiming gossip makes the data strongly consistent.']}
]);

enrich('Circuit Breaker',[
 {h:'Breaker mechanics',ul:['Closed: count failures and slow calls over a rolling window (count or time based).','Open: fail fast for a wait duration; return a fallback or an error the caller understands.','Half-open: allow a limited number of trial calls; close on success, reopen on failure.','Count timeouts and 5xx as failures; do not count client errors (4xx) caused by bad input.','Per dependency, and sometimes per endpoint or per host.']},
 {h:'Timeouts and retries',ul:['Every network call needs a timeout; base it on the dependency\'s p99 plus margin, and propagate a deadline through the call chain.','Retry only idempotent operations and transient errors (timeouts, 503, connection resets).','Exponential backoff with full jitter spreads retries out.','Retry budgets (for example retries at most 10% of requests) and retrying at a single layer stop retry storms.','Hedged requests (send a second request after a delay) can cut tail latency for idempotent reads.']},
 {h:'Bulkheads and load shedding',ul:['Separate thread pools, connection pools or semaphores per dependency.','A slow dependency then exhausts only its own pool.','Concurrency limits (static or adaptive, like Netflix\'s concurrency-limits) protect a service from overload.','Shed low-priority traffic first; return 429 or 503 quickly instead of queueing forever.']},
 {h:'Fallbacks and graceful degradation',ul:['Serve cached or default data, hide optional features, or queue work for later.','Decide per feature what "degraded" looks like with product owners.','Fallbacks must be cheap and not depend on the same failing system.','Test them; untested fallbacks often fail when needed.']},
 {h:'Testing resilience',ul:['Fault injection in staging and carefully in production (latency, errors, dropped connections).','Chaos experiments: kill instances, block a dependency, add packet loss.','Game days with on-call teams to practise recovery.','Dashboards for breaker state changes, retry rates and pool saturation.']}
],[
 {q:'The recommendations service becomes slow, and within minutes the whole product page and then checkout fail. Explain the cascade and redesign.',cover:['No or long timeouts: page threads wait on recommendations, pool exhausts, page fails; checkout shares the pool or the same gateway.','Fix: short timeouts with deadlines, circuit breaker with fallback (hide recommendations), bulkhead pools per dependency.','Load shedding and priority so checkout is protected.','Retry limits to avoid amplifying the slowdown.','Fault-injection tests to prove the page renders without recommendations.'],pitfalls:['Adding retries, which worsens the overload.']},
 {q:'How do you choose timeout values and retry policies across a chain of five services?',cover:['Start from the user-facing latency budget and allocate deadlines downwards; propagate the remaining deadline.','Each timeout above the callee\'s normal p99, below the caller\'s remaining budget.','Retry at one layer (usually the edge or the closest to the failing dependency), with backoff, jitter and a budget.','Idempotency keys for retried writes.','Measure and revisit as latency profiles change.'],pitfalls:['Same 30-second timeout and 3 retries everywhere.']},
 {q:'After a 10-minute outage of a core service, it recovers, then immediately falls over again under the returning load. Why, and what patterns prevent it?',lvl:'Staff+',cover:['Thundering herd: clients retry together, queues dump backlog, caches are cold, breakers close simultaneously.','Jittered backoff, retry budgets, half-open breakers admitting limited trial traffic.','Admission control and load shedding at the recovering service; gradual traffic ramp (rate limits that rise over time).','Warm caches before full traffic; drain queued work at a controlled rate.','Practise recovery in game days.'],pitfalls:['Assuming the incident is over once the service is back up.']}
]);

enrich('Disaster Recovery',[
 {h:'Defining RPO and RTO',ul:['Set them per system with the business, based on the cost of lost data and downtime.','Tier systems: payments may need RPO near zero, an internal report can tolerate a day.','RTO includes detection, decision, failover and verification, not only the technical switch.','Write them down and test against them.']},
 {h:'Strategies and their costs',ul:['Backup and restore: cheapest; RPO = backup interval; RTO hours.','Pilot light: replicated data, minimal compute ready; RTO tens of minutes.','Warm standby: scaled-down full stack running; RTO minutes.','Active-active: both regions serve; near-zero RPO and RTO; needs multi-region data design and conflict handling.']},
 {h:'Backups done right',ul:['3-2-1: three copies, two media types, one off-site; plus immutable or air-gapped copies against ransomware.','Point-in-time recovery from base backups plus logs.','Encrypt backups and protect the keys separately.','Regularly restore and verify data, not just that the backup job succeeded.']},
 {h:'Failing over a region',ul:['Traffic: DNS with low TTLs, global load balancers or anycast.','Data: promote replicas; know the replication lag at failover time (your actual RPO).','Dependencies: secrets, certificates, quotas, third-party integrations, configuration all available in the other region.','Fail back: plan the return, including resynchronising data written during the failover.']},
 {h:'Testing and readiness',ul:['Scheduled DR drills, from tabletop exercises to real region failovers.','Measure actual RTO and RPO in drills and compare with targets.','Keep runbooks current and automated where possible.','Track DR as a product requirement with owners, not as a one-time project.']}
],[
 {q:'Design disaster recovery for an online banking app with RPO near zero and RTO of 15 minutes.',cover:['Synchronous or quorum replication of the ledger across at least three zones or regions (consensus database), so a region loss loses no committed data.','Warm standby or active-active application tier in a second region; global load balancing with health checks.','Automated failover runbooks, tested regularly; secrets and certificates replicated.','Backups with point-in-time recovery for logical corruption; immutable copies.','Communication plan and regulatory reporting.'],pitfalls:['Relying on replication alone without backups.']},
 {q:'Ransomware encrypts your production databases and the attacker also deleted the backups they could reach. What would have saved you, and what is your recovery plan?',cover:['Immutable or object-locked backups in a separate account with separate credentials; offline copies.','Detect the time of compromise; restore to a point before it; verify integrity.','Rebuild infrastructure from code in a clean environment; rotate all credentials.','Prioritise systems by business tier; communicate.','Afterwards: least privilege on backup deletion, monitoring for mass deletes.'],pitfalls:['Assuming cloud snapshots in the same account are safe.']},
 {q:'Leadership asks for active-active across two regions for a global e-commerce site. What are the hard problems and how would you decide whether it is worth it?',lvl:'Staff+',cover:['Data: which data must be strongly consistent globally (inventory, payments) versus partitionable by user or region; conflict resolution for concurrent writes.','Two regions cannot form a majority after a split; you need a third site or accept one side stopping writes.','Routing users to a home region; failover of their data.','Cost: double capacity, cross-region replication traffic, engineering effort.','Compare with warm standby against the real RTO/RPO needs; phased approach.'],pitfalls:['Treating active-active as just running the app twice.']}
]);

enrich('Distributed Tracing',[
 {h:'Traces, spans and context',ul:['A trace is a tree of spans; each span has a trace id, span id, parent id, name, start, duration, status and attributes.','W3C Trace Context (traceparent, tracestate headers) is the standard propagation format.','Propagate through HTTP, gRPC metadata, message headers, and into background jobs.','Span links connect related traces, for example a batch job processing many messages.']},
 {h:'OpenTelemetry',ul:['Vendor-neutral APIs and SDKs for traces, metrics and logs.','Automatic instrumentation for common frameworks and clients, plus manual spans for business steps.','The Collector receives, processes (sampling, filtering, enrichment) and exports to back ends.','Semantic conventions keep attribute names consistent across services.']},
 {h:'Sampling strategies',ul:['Head-based: decide at the root (for example 1%); cheap, consistent across services, may miss rare problems.','Tail-based: buffer spans and decide after the trace completes; keep errors, slow traces and a baseline sample.','Rate-limited sampling per service or endpoint to bound cost.','Always record metrics on 100% of traffic; traces explain individual examples.']},
 {h:'Correlation with logs and metrics',ul:['Put trace id and span id in every log line (structured logging).','Exemplars link metric spikes to example traces.','Correlation ids for business flows that span several traces (an order\'s lifecycle).','Dashboards from spans: service maps, error and latency by dependency.']},
 {h:'Reading a trace',ul:['Find the critical path: the chain of spans that determines total latency.','Look for gaps (time not covered by child spans: queueing, CPU, missing instrumentation).','Sequential calls that could be parallel; repeated calls (N+1); retries.','Compare a slow trace with a normal one for the same endpoint.']}
],[
 {q:'p99 latency of checkout doubled after a release, but every service\'s own dashboard looks normal. How do you find the cause with tracing?',cover:['Query traces for slow checkouts (tail-sampled), compare with fast ones.','Look at the critical path: new sequential calls, retries, a new dependency, gaps indicating queueing.','Check span attributes for the release version and specific endpoints or tenants.','Correlate with logs via trace id.','Fix and confirm with before/after trace comparison.'],pitfalls:['Looking only at averages per service.']},
 {q:'How do you propagate tracing context through a Kafka-based asynchronous flow and present it usefully?',cover:['Inject traceparent into message headers on produce; extract on consume.','Consumer spans as children (or links for batch consumption) of the producer span.','Long-lived flows may be better as linked traces plus a business correlation id.','Measure queue time as the gap between produce and consume spans.'],pitfalls:['Starting a new unrelated trace in every consumer.']},
 {q:'Design an observability strategy for 500 microservices with a fixed budget. What do you collect, sample and keep?',lvl:'Staff+',cover:['Metrics (RED: rate, errors, duration) for all traffic; SLOs per user journey.','Traces with OpenTelemetry everywhere; tail-based sampling keeping errors and slow traces, low baseline rate; per-service caps.','Structured logs with trace ids; log levels and retention tiers; drop noisy debug logs in production.','Collectors for processing and cost control; ownership of dashboards and alerts by service teams.','Review cost monthly; sample more where incidents happen.'],pitfalls:['Trying to keep 100% of everything forever.']}
]);

PHASES[6].iq=[
 {q:'Design a highly available job scheduler that runs 50,000 scheduled jobs per hour across a fleet of workers, where each job must run once per schedule.',cover:['Job definitions in a replicated database; scheduler leadership via a consensus-backed lease with fencing epochs.','Scheduler enqueues due jobs to a queue partitioned by job id; workers are competing consumers.','Idempotent execution keyed by (job id, scheduled time); unique constraint on runs.','Heartbeats from workers for long jobs; reassign on timeout; jobs must tolerate a rare duplicate.','Monitoring: missed schedules, lag, failure rates; DR for the scheduler state.'],pitfalls:['Running the scheduler on every node and relying on a cron lock without idempotency.']},
 {q:'Explain how heartbeats, gossip, consensus and leases relate to each other. Give a system that uses each, and say what goes wrong if you substitute one for another.',cover:['Heartbeats detect failures; gossip spreads membership and suspicion; consensus makes binding decisions; leases grant time-bound authority.','Examples: load balancer health checks, Cassandra membership, etcd, a leader lease in Kafka or HDFS.','Substitution failures: using gossip to elect a leader (split brain), using heartbeats alone for exclusive ownership (pauses), using consensus for high-volume data (slow).'],pitfalls:['Treating them as interchangeable.']},
 {q:'A microservice platform has frequent cascading outages. Propose a resilience program for the next two quarters.',lvl:'Staff+',cover:['Baseline: map dependencies via tracing; identify critical user journeys and SLOs.','Standards in shared libraries or the mesh: timeouts with deadlines, retry budgets with jitter, circuit breakers, bulkheads, load shedding.','Product work: define fallbacks and degraded modes for each journey.','Testing: fault injection and game days; chaos experiments for top dependencies.','Governance: production readiness reviews, incident follow-up tracking, dashboards for breaker and retry behaviour.'],pitfalls:['Turning on retries everywhere as the main fix.']},
 {q:'Your system spans two regions. Product wants writes accepted in both regions during a network split between them, and also wants no conflicting data. Explain why both cannot be fully satisfied and propose designs.',lvl:'Staff+',cover:['CAP: during a partition you must choose between accepting writes on both sides (availability) and preventing conflicts (consistency).','Option 1: single writer per data item (home region by user or tenant); the other side rejects or queues writes for items it does not own.','Option 2: accept both and merge with CRDTs or application rules where the data allows (counters, sets, carts).','Option 3: consensus across three regions; the minority side stops writing.','Choose per data type; communicate the behaviour to users.'],pitfalls:['Promising both with a clever timestamp scheme (last-write-wins silently loses data).']}
];

lesson(7,{key:'Client-Server Architecture',short:'Client-Server',tag:'Patterns 1 of 5',title:'Client-server: who asks and who answers',
  lead:'In client-server architecture, clients (browsers, phone apps, other programs) send requests and servers answer them. Data and core logic live on servers you control, so many clients can share them safely. Almost every web system is built on this shape, usually split into tiers.',
  more:['Tiers separate concerns. A two-tier system has clients talking straight to a database server. A three-tier system adds an application tier between them: presentation (the client), application logic (stateless servers), and data (databases and storage). Larger systems add more layers, such as a CDN, an API gateway, caches and background workers, but the idea is the same: each tier has one job and can scale on its own.',
    'The most important design rule for the application tier is to keep servers stateless. If a server keeps a user\'s session in its own memory, every request from that user must reach the same server (sticky sessions), and losing that server logs the user out. If state lives in a shared store (a database, Redis, or a signed token held by the client), any server can answer any request, so you can add, remove and restart servers freely behind a load balancer.',
    'Where logic runs is a choice too. Thin clients (server-rendered pages) keep logic on the server and are easy to update. Thick clients (single-page apps, mobile apps) do more work locally for responsiveness and offline use, but you must assume they can be modified, so the server still validates everything. The trade-offs of the model itself: the server side is a central point to scale and protect, while peer-to-peer designs (the last lesson in this line) spread that load.'],
  demo:'clientserver',takeaway:'Split the system into tiers with one job each, keep application servers stateless with state in a shared store, and never trust the client: validate everything on the server.',
  pre:['Load Balancing','HTTP/HTTPS'],
  quiz:[{q:'Users are randomly logged out whenever servers are added or restarted. What is the most likely cause?',o:['The database is too slow','Sessions are stored in each server\'s memory instead of a shared store','The load balancer uses HTTPS'],a:1,why:'When state lives on one server, any request routed elsewhere, or a restart, loses it. Move sessions to a shared store or a signed token.',hint:'Where does the session live?'},
        {q:'Why must the server validate input even if the client app already does?',o:['It doesn\'t need to','Clients can be modified or bypassed, so the server is the only trustworthy place to enforce rules','Validation is faster on servers'],a:1,why:'Anyone can call your API directly. Client-side checks are for user experience, not security.',hint:'Who controls the client?'}],
  terms:[['Tier','A layer of the system with one responsibility, such as presentation, logic or data.'],['Stateless server','A server that keeps no per-user data between requests.'],['Sticky session','Routing a user to the same server every time.'],['Thick client','A client that runs much of the application logic itself.']]});

lesson(7,{key:'Microservices Architecture',short:'Microservices',tag:'Patterns 2 of 5',title:'Microservices: independent services, independent teams',
  lead:'A microservices architecture splits an application into small services, each owning one business capability and its own data, deployed independently and talking over the network. The main benefit is organisational: teams can build, deploy and scale their part without waiting for everyone else.',
  more:['The alternative is a monolith: one codebase and one deployable. Monoliths are simple to build, test, debug and run, and they are the right start for most products. They become painful when many teams share them: deploys queue up, a bug in one module can take down everything, and the whole thing scales as one unit. A modular monolith keeps one deployable but enforces strict module boundaries (separate packages, no shared tables, explicit interfaces). It captures much of the benefit and is the natural stepping stone, because well-bounded modules can later be extracted into services.',
    'Microservices move complexity from the code to the network and operations. Each request may cross several services, adding latency and multiplying failure points (five services at 99.9% each give about 99.5% for the chain). You need service discovery, timeouts, retries and circuit breakers, tracing, per-service pipelines and monitoring, and a way to keep data consistent across services that no longer share a database (events, sagas, the outbox pattern). Hexagonal architecture (ports and adapters) helps inside each service: business logic sits in the middle and talks to databases, queues and APIs only through interfaces, so infrastructure can change without rewriting the logic.',
    'Draw boundaries around business capabilities (orders, payments, catalogue), not technical layers, so most changes touch one service. Each service owns its data; other services ask through its API or listen to its events. Watch for the distributed monolith: services that must be deployed together, share a database, or call each other synchronously in long chains. That has the costs of both styles and the benefits of neither.'],
  demo:'micro',takeaway:'Start with a well-structured (modular) monolith; move to microservices when team size and independent scaling justify the operational cost. Bound services by business capability, give each its own data, and make calls between them resilient.',
  pre:['Client-Server Architecture','Service Discovery','Circuit Breaker'],
  quiz:[{q:'A 6-person startup is building its first product. Which architecture is usually best?',o:['Dozens of microservices from day one','A well-structured monolith, ideally with clear module boundaries','Peer-to-peer'],a:1,why:'Microservices solve coordination problems between many teams at a large operational cost. A small team gains speed from a monolith.',hint:'What problem do microservices actually solve?'},
        {q:'Three "microservices" share one database schema and must always be deployed together. What is this called?',o:['A modular monolith','A distributed monolith: the costs of microservices without their independence','Serverless'],a:1,why:'Shared data and lockstep deploys remove independence while keeping the network costs.',hint:'Can any of them change alone?'}],
  terms:[['Monolith','One codebase deployed as a single unit.'],['Modular monolith','A monolith with strictly enforced internal module boundaries.'],['Bounded context','The part of the domain one service owns, with its own model and data.'],['Hexagonal architecture','Business logic in the centre, infrastructure behind ports and adapters.']]});

lesson(7,{key:'Serverless Architecture',short:'Serverless',tag:'Patterns 3 of 5',title:'Serverless: run code without managing servers',
  lead:'In a serverless architecture you write functions or containers, and the cloud provider runs them on demand, scales them automatically (down to zero), and bills you per request and execution time. You do not manage machines, operating systems or capacity, though servers still exist.',
  more:['Functions as a service (AWS Lambda, Google Cloud Functions, Azure Functions) run your code in response to events: an HTTP request through an API gateway, a file landing in storage, a message on a queue, a schedule. Serverless also covers managed back ends you use without running servers: databases like DynamoDB, queues, object storage, authentication. A typical serverless app is a set of small functions glued together by these managed services and events.',
    'It shines for spiky, unpredictable or low traffic, event processing, scheduled jobs and glue code: you pay nothing when idle and scale instantly with demand, with very little operations work. The costs: cold starts (a new instance must start before handling its first request, adding from tens of milliseconds to seconds), limits on run time, memory and package size, per-request pricing that becomes expensive at high steady volume, harder local testing and debugging, and some lock-in to one provider\'s services.',
    'Design for it deliberately. Keep functions stateless and short, put state in managed stores, make handlers idempotent because events are delivered at least once, and watch the database: thousands of concurrent functions each opening connections can exhaust a relational database, so use a connection proxy or a database built for it. For steady heavy traffic or long-running work, containers on a managed platform (Cloud Run, Fargate, Kubernetes) are often the better middle ground.'],
  demo:'serverless',takeaway:'Serverless trades control for zero server management and pay-per-use scaling. It fits spiky and event-driven work; watch cold starts, limits, database connections and cost at high steady volume.',
  pre:['Client-Server Architecture','Message Queues'],
  quiz:[{q:'An internal reporting job runs for 2 minutes once a night. Which deployment is likely cheapest and simplest?',o:['Three always-on servers','A scheduled serverless function','A peer-to-peer network'],a:1,why:'You pay only for 2 minutes of compute a day and manage no servers.',hint:'How much of the day is the work actually running?'},
        {q:'After moving an API to functions, the relational database runs out of connections at peak. Why?',o:['Functions cannot use databases','Each of many concurrent function instances opens its own connections','The API gateway is misconfigured'],a:1,why:'Serverless scales out to many instances quickly. Use a connection pooler or proxy, or a database designed for many short connections.',hint:'Count the instances at peak.'}],
  terms:[['FaaS','Functions as a service: code run on demand by the provider.'],['Cold start','Delay while a new function instance starts.'],['Scale to zero','No running instances, and no cost, when idle.'],['BaaS','Back end as a service: managed databases, auth, storage.']]});

lesson(7,{key:'Event-Driven Architecture',short:'Event-Driven',tag:'Patterns 4 of 5',title:'Event-driven architecture: systems that react to what happened',
  lead:'In an event-driven architecture, services communicate mainly by publishing events (facts such as OrderPlaced or PaymentFailed) and reacting to events from others, instead of calling each other directly. Producers do not know who listens, so services are loosely coupled and new behaviour can be added by adding a consumer.',
  more:['Events flow through a broker (Kafka, a cloud event bus, a message queue). This gives you the strengths covered in Phase 5: resilience to slow or failed consumers, easy fan-out, buffering of spikes, and replay. It changes how you handle business transactions that span services. Without a shared database there is no single transaction, so a multi-step process like "reserve stock, charge, ship" becomes a saga: a series of local transactions, each with a compensating action (release stock, refund) run if a later step fails. Choreography lets each service react to the previous event; orchestration uses a coordinator that calls each step and tracks state, which is easier to follow and monitor.',
    'Two related patterns often come with it. Event sourcing stores the full history of changes as immutable events and derives current state by replaying them, giving an audit trail and the ability to rebuild state as of any time. CQRS (command query responsibility segregation) separates the write model from read models: commands change state and emit events, and read models (views shaped for each screen or query) are built from those events. Read models scale independently but lag behind writes.',
    'The costs are real: eventual consistency that users can see, harder debugging (follow the trace and correlation ids), schema evolution of events, duplicate and out-of-order delivery (idempotent, version-aware consumers), and flows that nobody can see in one place. Use events for side effects and integration between domains; keep synchronous calls where the caller genuinely needs an answer now.'],
  demo:'eventdriven',takeaway:'Event-driven systems decouple services through published facts. Coordinate cross-service transactions with sagas and compensations, use event sourcing and CQRS where history and separate read models pay off, and design for eventual consistency and duplicates.',
  pre:['Pub/Sub','Change Data Capture (CDC)','ACID Transactions'],
  quiz:[{q:'In a saga, the payment step fails after stock was reserved. What happens?',o:['A global rollback undoes everything automatically','A compensating action releases the reserved stock, and the order is cancelled','Nothing, the stock stays reserved'],a:1,why:'There is no distributed transaction. Each completed step is undone by its own compensating action.',hint:'Who undoes the reservation?'},
        {q:'What is the main trade-off of CQRS read models?',o:['They cannot be indexed','They can lag behind the write side, so reads may be briefly stale','They require a monolith'],a:1,why:'Read models are updated from events after the write commits, so there is a delay.',hint:'When does the read side learn about a change?'}],
  terms:[['Saga','A multi-step business transaction made of local transactions plus compensations.'],['Compensating action','A step that semantically undoes an earlier step.'],['Event sourcing','Storing state as a sequence of events.'],['CQRS','Separating the write model from read models.']]});

lesson(7,{key:'Peer-to-Peer (P2P) Architecture',short:'P2P',tag:'Patterns 5 of 5',title:'Peer-to-peer: every node is both client and server',
  lead:'In a peer-to-peer system, participants (peers) both use and provide resources: each downloads from others and uploads to others. There is no central server doing all the work, so capacity grows as more peers join. BitTorrent, blockchains, some video calling and content delivery systems, and IPFS are built this way.',
  more:['The scaling property is the reason to choose it. Distributing a large file from one server takes time proportional to the number of downloaders, because the server must upload every copy. In P2P, each peer that has part of the file uploads it to others, so total upload capacity grows with the number of peers and distribution time levels off. BitTorrent splits files into pieces, fetches rarest pieces first, and rewards peers that upload (tit-for-tat).',
    'Peers must find each other and the data. Some systems use a central tracker or index (simple but a single point of failure); fully decentralised ones use a distributed hash table (DHT) such as Kademlia, which maps keys to peers using consistent-hashing-like ideas and finds anything in about log N hops. Peers behind home routers need NAT traversal (STUN, TURN relays) to connect directly, which is also how WebRTC video calls connect.',
    'The costs: peers join and leave constantly (churn), have uneven bandwidth, and cannot be trusted, so data must be verified with hashes, and systems must resist free riders and malicious peers (Sybil attacks). There is no central place to enforce rules, monitor, or delete content. Many real systems are hybrids: central services for login, discovery and control, peers for the heavy data transfer.'],
  demo:'p2p',takeaway:'P2P makes capacity grow with the number of participants and removes the central bottleneck. Pay for it with discovery (trackers or DHTs), NAT traversal, churn, and verifying untrusted peers; hybrids are common.',
  pre:['Client-Server Architecture','Consistent Hashing','Checksums'],
  quiz:[{q:'Why does P2P file distribution stay fast as downloaders grow from 1,000 to 100,000?',o:['Peers have faster connections than servers','Each new peer also uploads to others, so total upload capacity grows with the number of peers','Files get smaller'],a:1,why:'Capacity scales with demand, unlike a single server whose upload is fixed.',hint:'Who is uploading?'},
        {q:'How does a peer know a piece it received from a stranger is not corrupted or malicious?',o:['It trusts all peers','It checks the piece against a hash from the trusted metadata (torrent file or content address)','It asks the central server for a copy'],a:1,why:'Cryptographic hashes let peers verify data from untrusted sources.',hint:'Remember checksums and hashes.'}],
  terms:[['Peer','A node that both requests and serves data.'],['DHT','Distributed hash table: a decentralised key-to-peer lookup.'],['Churn','Peers constantly joining and leaving.'],['NAT traversal','Techniques to connect peers behind home routers.']]});
