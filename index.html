 {h:'Tiers and their jobs',ul:['Presentation: browser, mobile app, or a server that renders pages.','Application: stateless services with business logic, behind load balancers.','Data: databases, caches, object storage, search.','Edge and supporting tiers: CDN, API gateway, background workers, queues.','Each tier scales, deploys and fails separately.']},
 {h:'Where state lives',ul:['Server memory: fast but ties users to servers; lost on restart.','Shared session store (Redis, database): any server can serve any request.','Client tokens (signed JWT or cookies): no server lookup, but revocation and size need care.','Long-lived connections (WebSockets) are inherently stateful; route them deliberately and keep durable state elsewhere.']},
 {h:'Thin and thick clients',ul:['Server-rendered pages: simple, SEO-friendly, logic updated centrally.','Single-page and mobile apps: responsive, offline-capable, but logic is duplicated and app versions linger.','Backends for frontends shape APIs per client type.','Always validate and authorise on the server.']},
 {h:'Request and response patterns',ul:['Synchronous request/response for most interactions.','Polling, long polling, SSE or WebSockets when the server must push.','Batch endpoints and pagination to reduce chattiness.','Version APIs because old clients stay in the field.']},
 {h:'Limits of the model',ul:['Server-side capacity must grow with clients.','The server tier is the target for attacks and the place outages hurt everyone.','Latency depends on distance to the servers; CDNs and regional deployments help.','P2P and edge computing push some work out to clients or the network edge.']}
],[
 {q:'Your web app keeps sessions in server memory and you need to scale from 2 to 50 servers with rolling deploys. What do you change?',cover:['Move sessions to a replicated store or signed tokens; make servers stateless.','Remove sticky sessions or keep them only as an optimisation.','Graceful shutdown and connection draining for deploys.','Externalise other state: uploaded files to object storage, caches to a shared cache, scheduled jobs to a single scheduler.','Test by killing servers under load.'],pitfalls:['Keeping sticky sessions and hoping no server dies.']},
 {q:'A mobile app has five versions in the wild and a slow network. How does that shape your server API design?',cover:['Backward-compatible API evolution and versioning; deprecation timelines; minimum supported version enforcement.','Fewer, coarser calls (aggregation, BFF), compression, pagination.','Server-side validation regardless of client checks.','Feature flags and remote configuration instead of requiring app updates.','Idempotency for retries on flaky networks.'],pitfalls:['Breaking changes that strand old app versions.']},
 {q:'When would you move logic from the server to the client or the edge, and what risks come with that?',lvl:'Staff+',cover:['Move for latency, offline use, or server cost: rendering, input validation for UX, caching, simple personalisation at the edge.','Keep authority on the server: authorisation, pricing, money, anything security relevant.','Risks: inconsistent logic across platforms, slower rollout of fixes, tampering, harder observability.','Mitigate with shared libraries or schemas, server-side verification, and edge functions under central control.'],pitfalls:['Trusting client-calculated prices or permissions.']}
]);

enrich('Microservices Architecture',[
 {h:'When microservices pay off',ul:['Many teams that need to ship independently.','Parts with very different scaling, reliability or technology needs.','Clear, stable domain boundaries.','Mature platform: CI/CD, observability, service discovery, on-call per service.','If none of these hold, a modular monolith is usually better.']},
 {h:'Drawing boundaries',ul:['Bound by business capability (domain-driven design bounded contexts), not technical layer.','Each service owns its data; no shared tables.','Aim for high cohesion inside a service and few, stable calls between them.','A change that always touches three services means the boundary is wrong.']},
 {h:'Communication and data',ul:['Synchronous APIs (REST, gRPC) for queries that need an answer; events for side effects and integration.','Data duplication via events for local reads, accepting eventual consistency.','Sagas and the outbox pattern for cross-service workflows.','API contracts versioned and tested (consumer-driven contract tests).']},
 {h:'Inside a service: hexagonal architecture',ul:['Core domain logic has no dependency on frameworks, databases or transports.','Ports: interfaces the core needs (repository, payment gateway) or offers (use cases).','Adapters: implementations for PostgreSQL, Kafka, HTTP controllers, test doubles.','Benefits: testable logic, swappable infrastructure, clearer boundaries when extracting services.']},
 {h:'Migrating from a monolith',ul:['Strangler fig: route a slice of traffic to a new service, grow it, retire the old code path.','Modularise first: enforce boundaries in the monolith, then extract modules with the cleanest seams.','Split the database last and carefully, using CDC or dual-run with verification.','Stop if the remaining monolith is healthy; not everything needs extracting.']}
],[
 {q:'Your company has a 2-million-line monolith and 15 teams who block each other on deploys. Plan the next year.',cover:['Measure the pain: deploy frequency, lead time, incidents by module, build time.','Modularise: enforce module boundaries and ownership; separate CI per module; feature flags.','Extract the highest-value, cleanest boundaries first with the strangler pattern; platform investment (pipelines, observability, discovery) before many services.','Data ownership per service with CDC-based migration.','Define success metrics and stop when gains flatten.'],pitfalls:['A big-bang rewrite into microservices.']},
 {q:'A request passes through eight services and p99 latency and error rate have grown. What do you do?',cover:['Trace to find the critical path and the slow or failing hops.','Parallelise independent calls; cache or replicate data locally via events to remove synchronous hops.','Merge services that are always called together (wrong boundary).','Timeouts, retries with budgets, circuit breakers, hedging for idempotent reads.','Availability math: series dependencies multiply failure probability.'],pitfalls:['Adding retries everywhere.']},
 {q:'How do you decide whether to split a service into two, or merge two services into one?',lvl:'Staff+',cover:['Split when parts have different owners, change rates, scaling or reliability needs, and the interface between them is narrow.','Merge when they change together, call each other chattily, share data, or one team owns both.','Consider operational cost per service and team cognitive load (team topologies).','Make the decision reversible where possible: hexagonal design, contract tests.'],pitfalls:['Using lines of code or a fixed service size as the rule.']}
]);

 {h:'Building blocks',ul:['Functions triggered by HTTP (via API gateway), queues, streams, storage events, schedules.','Managed data: DynamoDB, Firestore, Aurora Serverless, S3.','Workflow engines (Step Functions, Durable Functions) for multi-step processes with retries and state.','Event buses (EventBridge) to route events between functions and services.']},
 {h:'Cold starts and latency',ul:['First request to a new instance pays initialisation: runtime start, code load, dependency setup.','Larger packages and heavier runtimes start slower; keep handlers lean and initialise outside the handler.','Provisioned concurrency or minimum instances remove cold starts at a cost.','Latency-sensitive paths may be better on always-on containers.']},

 {h:'Cost model',ul:['Pay per request and per GB-second of execution; nothing when idle.','Cheap for spiky and low volume; expensive for high, steady volume compared with busy servers.','Hidden costs: API gateway per request, logging volume, data transfer.','Include the saved operations work in the comparison.']},

 {h:'Structured and unstructured P2P',ul:['Unstructured: peers connect randomly; search by flooding or gossip (early Gnutella). Simple, inefficient for rare items.','Structured: a DHT assigns keys to peers so lookups take about log N hops (Chord, Kademlia, Pastry).','Hybrid: central tracker or index plus peer data transfer (BitTorrent with trackers, early Napster).']},

],[

 {q:'A video calling product uses peer-to-peer connections. Calls with more than four people degrade badly. Why, and what architecture would you move to?',lvl:'Staff+',cover:['Full mesh: each participant uploads a stream to every other, so upload bandwidth and CPU grow with participants.','SFU (selective forwarding unit): each client uploads once to a server that forwards streams; simulcast for different qualities.','MCU mixes streams server-side at higher server cost.','Keep P2P for 1:1 calls; TURN for connectivity; regional SFUs for latency.','Cost and privacy (end-to-end encryption with SFUs) trade-offs.'],pitfalls:['Blaming network conditions without analysing the topology.']}
